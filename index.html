<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Animated, chapter-by-chapter lessons on the 8086 microprocessor and assembly language, with Bangla and English voice-over and quizzes.">
<style>[hidden]{display:none!important}</style>
<title>8086 and Assembly Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<style>
/* Layout: chapter rail on the left, lesson column on the right. The "bench scope" stage stays dark in both themes;
   it is the one bold element. Everything around it is quiet datasheet paper. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#152038; --muted:#56627A; --rule:#D3D9E3;
  --accent:#9A6200; --accent-soft:#F5E6C6; --teal:#0B6B76; --teal-soft:#D2EBED;
  --st-bg:#0D1626; --st-grid:#132037; --st-panel:#14223A; --st-line:#26354F; --st-line2:#3A4C6C;
  --st-fg:#E4EAF4; --st-dim:#8191AE; --st-gold:#F2B550; --st-hl:#2C2412; --st-teal:#4CC9CE; --st-tealbg:#0F2C33;
  --st-red:#F2806E; --st-green:#93D68F; --st-violet:#C9A3F2; --st-code:#0A1220; --st-con:#04080E;
  --f-disp:"IBM Plex Sans Condensed","Noto Sans Bengali",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans Bengali",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans Bengali",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090E19; --surface:#101828; --ink:#E2E7F0; --muted:#95A2BA; --rule:#222E46;
  --accent:#F0B24A; --accent-soft:#33280F; --teal:#5CCBD0; --teal-soft:#10323A;
  --st-bg:#060B15; --st-grid:#0D172A; --st-panel:#0F1A2E; --st-line:#1E2C47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090E19; --surface:#101828; --ink:#E2E7F0; --muted:#95A2BA; --rule:#222E46;
  --accent:#F0B24A; --accent-soft:#33280F; --teal:#5CCBD0; --teal-soft:#10323A;
  --st-bg:#060B15; --st-grid:#0D172A; --st-panel:#0F1A2E; --st-line:#1E2C47; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.bn-on .cap,.bn-on .tr-li{font-family:"Noto Sans Bengali",var(--f-body)}

/* header */
.top{max-width:1340px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.b-name{font-family:var(--f-disp);font-weight:700;font-size:1.25rem;letter-spacing:.01em;line-height:1.15;text-wrap:balance}
.b-sub{color:var(--muted);font-size:.82rem}
.seg-tog{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--surface)}
.seg-tog button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg-tog button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.top-r{display:flex;align-items:center;gap:10px}
.lg-lab{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* layout */
.wrap{max-width:1340px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding-block:22px 64px}
.rail{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto}
.rail-tog{display:none}
.rail-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:2px 0 10px}
.ch-btn{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;align-items:start}
.ch-btn:hover{background:var(--surface)}
.ch-btn[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--rule)}
.ch-n{font-family:var(--f-mono);font-weight:600;color:var(--accent);font-size:.95rem;padding-top:1px}
.ch-t{font-weight:500;font-size:.92rem;line-height:1.3}
.ch-p{grid-column:2;height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
.ch-p i{display:block;height:100%;background:var(--teal);width:0}
.rail-foot{margin-top:14px;font-size:.78rem;color:var(--muted);padding:0 10px}

main{min-width:0}
.ch-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.15;margin:4px 0 0;text-wrap:balance}
.tstrip{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 14px}
.tchip{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem;display:inline-flex;gap:7px;align-items:baseline;max-width:100%}
.tchip b{font-family:var(--f-mono);font-weight:600;color:var(--muted);font-size:.78rem}
.tchip.done b{color:var(--teal)}
.tchip[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.tchip[aria-current="true"] b{color:var(--st-gold)}

/* player */
.player{background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.stage{position:relative;background-color:var(--st-bg);color:var(--st-fg);min-height:420px;padding:46px 22px 58px;display:flex;align-items:center;justify-content:center;
  background-image:linear-gradient(var(--st-grid) 1px,transparent 1px),linear-gradient(90deg,var(--st-grid) 1px,transparent 1px);background-size:32px 32px;overflow:hidden}
.st-label,.st-step{position:absolute;top:14px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--st-dim)}
.st-label{left:18px;right:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-step{right:18px}
.st-note{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--st-tealbg);color:var(--st-teal);border:1px solid #1F5A63;
  font-family:var(--f-mono);font-size:.85rem;padding:6px 14px;border-radius:999px;text-align:center;white-space:normal}
.scene{width:100%;max-width:1000px;min-width:0}
.cap{padding:18px 22px 6px;font-size:1.12rem;line-height:1.6;min-height:4.4em;text-wrap:pretty}
.bn-on .cap{font-size:1.16rem;line-height:1.75}
.cap .spk{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--teal);margin-right:8px;vertical-align:middle;opacity:0}
.playing .cap .spk{opacity:1;animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(.55);opacity:.4}}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:8px 22px 16px}
.btns{display:flex;align-items:center;gap:6px}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);display:grid;place-items:center}
.ib:hover{border-color:var(--ink)}
.ib svg{width:18px;height:18px;fill:currentColor}
.ib.vbtn[aria-pressed="false"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ib.play{width:52px;height:52px;background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ib.play svg{width:22px;height:22px}
.dots{display:flex;gap:5px;flex:1 1 160px;min-width:140px}
.dots button{flex:1;height:8px;border:0;border-radius:4px;background:var(--rule);padding:0}
.dots button.seen{background:var(--accent-soft)}
.dots button.cur{background:var(--accent)}
.opts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.opts select{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:5px 8px;max-width:210px;font-size:.85rem}
.opts label{display:inline-flex;align-items:center;gap:6px}
.vrow{display:inline-flex;align-items:center;gap:6px;padding:3px 6px;border-radius:10px}
.vrow.cur{background:var(--accent-soft)}
.vrow.cur label{color:var(--ink);font-weight:600}
.opts .tone{max-width:110px}
.tbtn{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:.8rem;font-weight:600}
.tbtn:hover{border-color:var(--ink)}
.tbtn:disabled{opacity:.4;cursor:default}
.vhint{margin:0 22px 16px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:.88rem}
.below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:22px}
.below.solo{grid-template-columns:minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;min-width:0}
.panel h2{font-family:var(--f-disp);font-size:1.05rem;margin:0 0 10px;font-weight:600;letter-spacing:.02em}
.tr-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.tr-li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:.93rem;color:var(--muted)}
.tr-li b{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);padding-top:2px}
.tr-li:hover{background:var(--bg)}
.tr-li.cur{background:var(--accent-soft);color:var(--ink)}
.tr-li.cur b{color:var(--accent)}
.tnav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.tnav button{border:1px solid var(--rule);background:var(--surface);border-radius:12px;padding:10px 14px;text-align:left;max-width:48%;min-width:0}
.tnav button small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
.tnav button span{font-weight:600}
.tnav button.nx{text-align:right;margin-left:auto}
.tnav button.glow{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.kbd{font-size:.78rem;color:var(--muted);margin-top:8px}

/* tool panel */
.tool .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tool input,.tool select{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:6px 9px;font-family:var(--f-mono);min-width:0}
.tool input{width:120px}
.tool .tb{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:6px 11px;font-family:var(--f-mono);font-weight:600;font-size:.85rem}
.tool .tb:hover{border-color:var(--ink)}
.tool .tb.on{background:var(--ink);color:var(--surface)}
.tool .out{font-family:var(--f-mono);font-size:.86rem;background:var(--bg);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-x:auto;line-height:1.6}
.tool .out b{color:var(--accent)}
.tool .out i{font-style:normal;color:var(--teal)}
.tool .help{font-size:.84rem;color:var(--muted);margin:0 0 10px}
.tool .lab{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mini-stage{background:var(--st-bg);color:var(--st-fg);border-radius:12px;padding:16px 10px;margin-bottom:10px}
.jt{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:.82rem}
.jt td{padding:4px 6px;border-bottom:1px solid var(--rule)}
.jt .y{color:var(--teal);font-weight:600}
.jt .n{color:var(--muted)}

/* ===== stage scenes ===== */
.fly{position:absolute;z-index:5;transform:translate(-50%,-50%);transition:transform .6s cubic-bezier(.4,0,.2,1);background:var(--st-gold);color:#1B1405;font-family:var(--f-mono);font-weight:600;
  padding:4px 10px;border-radius:6px;font-size:.95rem;box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none;white-space:nowrap}
.chg{animation:chg .9s ease-out}
@keyframes chg{0%{background:var(--st-gold);color:#1B1405}100%{}}
.scroll-x{overflow-x:auto;width:100%}
/* diagram */
.dg{width:100%;min-width:620px;height:auto;display:block}
.split .dg{min-width:400px}
.dg text{fill:var(--st-fg);font-family:var(--f-disp)}
.dg .nl{font-weight:600}
.dg .nl.mono,.dg .ns.mono{font-family:var(--f-mono);font-weight:500}
.dg .ns{fill:var(--st-dim);font-size:17px;font-family:var(--f-body)}
.dg .fl{fill:var(--st-dim);font-size:18px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--f-mono)}
.dg .nb{fill:var(--st-panel);stroke:var(--st-line2);stroke-width:2;transition:fill .35s,stroke .35s}
.dg .frame .nb{fill:none;stroke-dasharray:7 7;stroke:var(--st-line2)}
.dg .bar .nb{fill:var(--st-line)}
.dg .node{transition:opacity .35s}
.dg .node.hl .nb{stroke:var(--st-gold);stroke-width:3;fill:var(--st-hl)}
.dg .frame.hl .nb{fill:none;stroke:var(--st-gold)}
.dg .node.hl .nl{fill:var(--st-gold)}
.dg .node.dim,.dg .edge.dim{opacity:.32}
.dg .node.off,.dg .edge.off{opacity:.06}
.dg .c-teal .nb{stroke:#2C6E78}
.dg .c-red .nb{stroke:#7A3A33}
.dg .ep{fill:none;stroke:var(--st-line2);stroke-width:3;transition:stroke .3s}
.dg .ef{fill:none;stroke:transparent;stroke-width:3}
.dg .edge.dash .ep{stroke-dasharray:6 6}
.dg .edge.on .ep{stroke:var(--st-teal)}
.dg .edge.on .ef{stroke:var(--st-teal);stroke-dasharray:10 14;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.dg .dot{fill:var(--st-gold);display:none}
.dg .edge.on .dot{display:block}
.dg .el{fill:var(--st-dim);font-size:17px;font-family:var(--f-mono)}
.dg .edge.on .el{fill:var(--st-teal)}
.dg .mk{fill:var(--st-line2)}
.dg .mk.on{fill:var(--st-teal)}
/* cards */
.cards{display:grid;gap:14px;width:100%}
.cd{background:var(--st-panel);border:1px solid var(--st-line);border-radius:12px;padding:14px 16px;transition:opacity .35s,border-color .35s,transform .35s;min-width:0}
.cd.pend{opacity:.22}
.cd.hl{border-color:var(--st-gold);background:var(--st-hl);transform:translateY(-3px)}
.cd-tag{font-family:var(--f-mono);font-size:.78rem;color:var(--st-gold);letter-spacing:.06em;margin-bottom:4px}
.cd-h{font-family:var(--f-disp);font-weight:600;font-size:1.12rem;line-height:1.25;margin-bottom:6px}
.cd-b{margin:0;padding-left:18px;color:#C3CCDC;font-size:.92rem;line-height:1.5}
p.cd-b{padding-left:0}
.cd-b li+li{margin-top:3px}
.cd-c{margin:6px 0 8px;background:var(--st-code);border:1px solid var(--st-line);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:.85rem;color:var(--st-teal);white-space:pre-wrap;overflow-x:auto}
.cd.bad .cd-tag{color:var(--st-red)}
.cd.good .cd-tag{color:var(--st-green)}
/* lines */
.lns{display:flex;flex-direction:column;gap:7px;width:100%;max-width:860px;margin:0 auto;font-family:var(--f-mono);font-size:clamp(13px,1.55vw,17px);overflow-x:auto}
.lns.big{font-size:clamp(14px,1.9vw,21px)}
.ln{white-space:pre;padding:3px 10px;border-radius:6px;transition:opacity .35s,background .35s}
.ln.p{white-space:normal;font-family:var(--f-body);color:#C3CCDC}
.ln.h{font-size:.78em;letter-spacing:.14em;text-transform:uppercase;color:var(--st-teal);margin-top:6px}
.ln.res{color:var(--st-gold);font-weight:600}
.ln.dim{color:var(--st-dim)}
.ln.bad{color:var(--st-red)}
.ln.pend{opacity:.1}
.ln.hl{background:var(--st-hl);box-shadow:inset 3px 0 0 var(--st-gold)}
.lns b.a,.cd b.a,.cap b.a{color:var(--st-gold);font-weight:600}
.lns b.t,.cd b.t{color:var(--st-teal);font-weight:600}
.lns .d,.cd .d{color:var(--st-dim)}
.lns [class^="f"]{border-radius:4px;transition:background .3s,color .3s}
.sf1 .f1,.sf2 .f2,.sf3 .f3,.sf4 .f4{background:var(--st-gold);color:#1B1405}
/* bits */
.bits{display:flex;flex-direction:column;gap:16px;align-items:center;width:100%}
.brow{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;justify-content:center}
.blab{font-family:var(--f-mono);font-size:.9rem;color:var(--st-dim);min-width:64px;text-align:right}
.bbox{display:flex;flex-direction:column;gap:4px}
.bline{display:flex;gap:4px}
.bc{width:var(--cw);flex:none;text-align:center;font-family:var(--f-mono)}
.bc.gs{margin-left:9px}
.bidx,.bnm{font-size:11px;color:var(--st-dim)}
.bnm .bc{font-weight:600;color:var(--st-teal)}
.cell{height:calc(var(--cw)*1.15);display:grid;place-items:center;background:var(--st-panel);border:1px solid var(--st-line);border-radius:6px;font-size:calc(var(--cw)*.5);color:#8C9AB5;position:relative}
.cell.one{color:var(--st-gold);border-color:#5C4A22;background:#1F1A0E}
.cell.hl{box-shadow:0 0 0 2px var(--st-teal);transform:translateY(-3px)}
.cell.mv{transition:transform .5s cubic-bezier(.4,0,.2,1);z-index:2}
.cell.pop{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.3);background:var(--st-teal);color:#04161A}100%{transform:none}}
.bnib{display:flex;gap:4px}
.bnib span{flex:none;text-align:center;font-family:var(--f-mono);font-weight:600;color:var(--st-teal);border-top:2px solid #2A5961;padding-top:2px;font-size:.95rem}
.bnib span.gs{margin-left:9px}
.bval{font-family:var(--f-mono);font-size:.85rem;color:var(--st-dim);min-width:100px}
.bval b{color:var(--st-fg);font-weight:600}
.cfbox{display:flex;flex-direction:column;align-items:center;gap:4px}
.cfbox .cflab{font-family:var(--f-mono);font-size:11px;color:var(--st-red);font-weight:600}
.cfbox .cell{border-color:#7A3A33}
/* mem */
.mem{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start;width:100%}
.mcols{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.mcol{display:flex;flex-direction:column;gap:5px;min-width:0}
.mtitle{font-family:var(--f-mono);font-size:.78rem;color:var(--st-teal);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}
.mrow{display:grid;grid-template-columns:minmax(0,auto) 64px minmax(92px,auto) 88px;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.88rem}
.mcol.narrow .mrow{grid-template-columns:minmax(0,auto) 54px 54px 70px}
.msym{color:var(--st-dim);text-align:right;font-size:.8rem;white-space:nowrap}
.ma{color:var(--st-dim);font-size:.82rem}
.mv{white-space:nowrap;background:var(--st-panel);border:1px solid var(--st-line);border-radius:6px;padding:5px 8px;text-align:center;min-height:30px;transition:border-color .3s,background .3s}
.mv.empty{color:var(--st-line2)}
.mv.empty::before{content:"·"}
.mrow.hl .mv{border-color:var(--st-gold);background:var(--st-hl);color:var(--st-gold)}
.mp{display:flex;gap:4px;flex-wrap:wrap}
.chip{background:var(--st-teal);color:#04161A;font-weight:600;font-size:.72rem;padding:2px 7px;border-radius:999px;position:relative}
.chip::before{content:"";position:absolute;left:-6px;top:50%;transform:translateY(-50%);border:5px solid transparent;border-right-color:var(--st-teal);border-left:0}
.mregs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;min-width:200px}
.mreg,.creg{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--st-panel);border:1px solid var(--st-line);border-radius:8px;padding:6px 10px;font-family:var(--f-mono);font-size:.88rem}
.mreg .rn,.creg .rn{color:var(--st-teal);font-weight:600}
.mreg.hl,.creg.hl{border-color:var(--st-gold)}
.con{background:var(--st-con);border:1px solid var(--st-line);border-radius:8px;padding:9px 12px;font-family:var(--f-mono);font-size:.88rem;color:#CFE6CF;min-height:62px;white-space:pre-wrap;word-break:break-all;flex:1 1 100%}

@keyframes blink{50%{opacity:0}}
/* regs */
.rfwrap{width:100%;display:flex;flex-direction:column;gap:14px;align-items:center}
.ins{font-family:var(--f-mono);font-size:clamp(17px,2.4vw,24px);color:var(--st-gold);font-weight:600;min-height:1.4em;text-align:center}
.rf{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;width:100%}
.rg{border:1px solid var(--st-line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;transition:border-color .3s,opacity .3s;background:rgba(20,34,58,.45)}
.rg.hl{border-color:var(--st-gold)}
.rg.dim{opacity:.35}
.rgt{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--st-dim)}
.reg{display:flex;align-items:center;gap:10px}
.reg .rn{font-family:var(--f-mono);font-weight:600;color:var(--st-teal);width:52px;flex:none}
.reg .rd{font-size:.75rem;color:var(--st-dim);line-height:1.25;min-width:0}
.rvs{display:flex;gap:3px}
.rv{font-family:var(--f-mono);background:var(--st-panel);border:1px solid var(--st-line);border-radius:6px;padding:4px 8px;font-size:1rem;min-width:46px;text-align:center;position:relative;transition:border-color .3s}
.rv small{position:absolute;bottom:-14px;left:0;right:0;font-size:9px;color:var(--st-dim)}
.reg.split{padding-bottom:12px}
.rv.hl,.reg.hl .rv{border-color:var(--st-gold);color:var(--st-gold)}
/* code */
.cw{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;width:100%;align-items:start}
.cw.solo{grid-template-columns:minmax(0,1fr);max-width:720px;margin:0 auto}
.cp{background:var(--st-code);border:1px solid var(--st-line);border-radius:10px;max-height:350px;overflow:auto;font-family:var(--f-mono);font-size:13.5px;padding:8px 0;position:relative}
.cl{display:grid;grid-template-columns:34px minmax(0,1fr);white-space:pre;line-height:1.65;transition:background .25s}
.cn{color:#3E4E6C;text-align:right;padding-right:10px;font-size:.8em}
.cl.cur{background:rgba(242,181,80,.13);box-shadow:inset 3px 0 0 var(--st-gold)}
.cl.cur .cn{color:var(--st-gold)}
.ct .k{color:var(--st-teal)}.ct .lb{color:var(--st-gold)}.ct .cm{color:#5F7091;font-style:italic}.ct .n{color:var(--st-violet)}.ct .s{color:var(--st-green)}.ct .rgn{color:#9DB7E8}
.cside{display:flex;flex-direction:column;gap:10px;min-width:0}
.cregs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.cflags{display:flex;gap:5px;flex-wrap:wrap}
.fchip{font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--st-line);border-radius:6px;padding:3px 7px;background:var(--st-panel);display:flex;gap:6px}
.fchip b{color:var(--st-teal)}
.fchip.one{border-color:#5C4A22;color:var(--st-gold)}
.fchip.hl{box-shadow:0 0 0 2px var(--st-gold)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;width:100%;align-items:center}
.split .cw{grid-template-columns:minmax(0,1fr)}
/* alu */
.alu{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.alu-t{display:grid;grid-template-columns:auto auto auto auto;gap:6px 16px;align-items:center;font-family:var(--f-mono);font-size:clamp(13px,1.7vw,19px)}
.alu-t .op{color:var(--st-gold);text-align:right;font-weight:600}
.alu-t .bn{letter-spacing:.06em}
.alu-t .bn .o{color:var(--st-gold)}
.alu-t .bn .z{color:#6E7D99}
.alu-t .hx{color:var(--st-fg);font-weight:600}
.alu-t .iv{color:var(--st-dim);font-size:.78em}
.alu-t .rule{grid-column:1/-1;border-top:2px solid var(--st-line2)}
.alu-t .pend{opacity:.1}
.alu-cy{font-family:var(--f-mono);font-size:.85rem;color:var(--st-red);min-height:1.2em}
.flg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.fbox{display:flex;flex-direction:column;align-items:center;min-width:58px;padding:6px 8px;border-radius:10px;border:1px solid var(--st-line);background:var(--st-panel);transition:all .3s}
.fbox .fn{font-family:var(--f-mono);font-size:.75rem;color:var(--st-dim)}
.fbox .fv{font-family:var(--f-mono);font-size:1.35rem;font-weight:600;color:#6E7D99}
.fbox.one .fv{color:var(--st-gold)}
.fbox.hl{border-color:var(--st-teal);background:var(--st-tealbg);transform:translateY(-3px)}
.fbox.pend{opacity:.15}
.alu-i{font-family:var(--f-body);font-size:.92rem;color:#C3CCDC;text-align:center;max-width:720px}
.alu-i b{color:var(--st-gold)}
/* seg */
.segw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px;width:100%;align-items:center}
.segc{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:clamp(14px,1.8vw,20px)}

.segr svg{width:100%;height:auto;display:block}

.segr .band{fill:var(--st-tealbg);stroke:var(--st-teal);stroke-width:2}

.segr .mark{stroke:var(--st-gold);stroke-width:3}
.segr .blab{fill:var(--st-fg);font-size:15px}
.segr .mlab{fill:var(--st-gold);font-weight:600}
/* clock */
.clk svg{width:100%;height:auto}

.clk .wave2{fill:none;stroke:var(--st-violet);stroke-width:2}
.clk text{font-family:var(--f-mono);fill:var(--st-dim);font-size:16px}
.clk .ann{fill:var(--st-gold);font-weight:600}

.clk .dotc{fill:var(--st-gold)}
/* grid2d */
.g2{display:flex;flex-direction:column;gap:18px;align-items:center;width:100%}

.g2c{font-family:var(--f-mono);font-size:.82rem;background:var(--st-panel);border:1px solid var(--st-line);border-radius:6px;padding:7px 6px;text-align:center;min-width:66px;transition:all .3s}
.g2c.hl{border-color:var(--st-gold);background:var(--st-hl);color:var(--st-gold)}

.g2s{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:100%}

.g2t{font-family:var(--f-mono);font-size:.78rem;color:var(--st-teal);letter-spacing:.1em;text-transform:uppercase}

/* memory models */
.mm{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;width:100%;align-items:center}
.mmtw{overflow-x:auto}
.mmt{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:.84rem}
.mmt caption{text-align:left;color:var(--st-teal);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;padding-bottom:8px}
.mmt th{color:var(--st-dim);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--st-line2);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.mmt td{padding:8px;white-space:normal;border-bottom:1px solid var(--st-line);vertical-align:top;color:#C3CCDC;transition:background .3s,color .3s}
.mmt td.mn{color:var(--st-fg);font-weight:600}
.mmt td.sg{white-space:nowrap;text-align:center}
.mmt th.sg{text-align:center}
.mmt td.md{font-family:var(--f-body);font-size:.84rem}
.mmt tr.hl td{background:var(--st-hl);color:var(--st-gold)}
.mmt tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--st-gold)}
.mmv{display:flex;flex-direction:column;gap:12px;min-width:0}
.mmt0{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;color:var(--st-gold)}
.mml{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center}
.mmll{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;color:var(--st-dim)}
.mmb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative;padding-bottom:0}
.mmseg{height:70px;border-radius:8px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-mono)}
.mmseg b{font-size:.8rem;font-weight:600}
.mmseg small{font-size:.68rem;color:var(--st-dim)}
.mmseg.c{border-color:var(--st-teal);background:var(--st-tealbg);color:var(--st-teal)}
.mmseg.d{border-color:#8A6A2C;background:#211B0E;color:var(--st-gold)}
.mmseg.ghost{border:1px dashed var(--st-line);background:none}
.mmarr{position:absolute;bottom:0;height:22px;overflow:hidden;text-overflow:ellipsis;padding:0 4px;border-radius:5px;background:repeating-linear-gradient(135deg,var(--st-red) 0 6px,#B4574A 6px 12px);color:#1B0A07;font-family:var(--f-mono);font-size:.68rem;font-weight:600;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.mmarr.in{left:0;width:calc((100% - 16px)/3)}
.mmarr.span{left:0;right:0}
.mmb:has(.mmarr){padding-bottom:30px}
.mmcap{font-size:.9rem;color:#C3CCDC}
.mmpop{animation:mmpop .45s ease-out both}
@keyframes swapin{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes mmpop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
/* quiz */
.quiz{margin-top:22px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 20px;scroll-margin-top:12px}

.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}

<script>
"use strict";
/* ================= core helpers ================= */
let LANG='en';
const L=x=>x==null?'':(typeof x==='object'&&!Array.isArray(x)&&('en' in x||'bn' in x)?(x[LANG]!=null?x[LANG]:x.en):x);
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
  if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='text')e.textContent=v;else if(k.slice(0,2)==='on'&&typeof v==='function')e.addEventListener(k.slice(2),v);else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
function sv(tag,attrs,...kids){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs){if(attrs[k]!=null)e.setAttribute(k,attrs[k]);}
  for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mk(s){s=esc(L(s));return s.replace(/\[\[(.+?)\]\]/g,'<b class="a">$1</b>').replace(/\{\{(.+?)\}\}/g,'<b class="t">$1</b>')
  .replace(/~~(.+?)~~/g,'<span class="d">$1</span>').replace(/\{([1-4]):(.+?)\}/g,'<span class="f$1">$2</span>');}
const plain=s=>String(L(s)).replace(/\[\[|\]\]|\{\{|\}\}|~~/g,'');
const acc=(steps,i,k)=>{const o={};for(let j=0;j<=i;j++){const v=(steps[j].s||{})[k];if(v)Object.assign(o,v);}return o;};
const last=(steps,i,k,d)=>{for(let j=i;j>=0;j--){const v=(steps[j].s||{})[k];if(v!==undefined)return v;}return d;};
const uni=(steps,i,k)=>{const set=new Set();for(let j=0;j<=i;j++){const v=(steps[j].s||{})[k];if(v!=null)[].concat(v).forEach(x=>set.add(x));}return set;};
const flash=e=>{if(!e)return;e.classList.remove('chg');void e.offsetWidth;e.classList.add('chg');};
const RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)').matches:false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const range=(a,b)=>{const o=[];for(let k=a;k<=b;k++)o.push(k);return o;};
const HX=(n,d)=>(n>>>0).toString(16).toUpperCase().padStart(d,'0').slice(-d);
const BN=(n,w)=>(n>>>0).toString(2).padStart(w,'0').slice(-w);
const sgn=(n,w)=>(n&(1<<(w-1)))?n-(1<<w):n;
const SC={};const TOOLS={};
let STAGE=null;
function fly(a,b,text){if(!a||!b||RM||!STAGE)return Promise.resolve();const sr=STAGE.getBoundingClientRect(),ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
  if(!ra.width||!rb.width)return Promise.resolve();const f=el('div',{class:'fly',text});f.style.left=(ra.left-sr.left+ra.width/2)+'px';f.style.top=(ra.top-sr.top+ra.height/2)+'px';
  STAGE.append(f);void f.offsetWidth;f.style.transform=`translate(-50%,-50%) translate(${(rb.left+rb.width/2)-(ra.left+ra.width/2)}px,${(rb.top+rb.height/2)-(ra.top+ra.height/2)}px)`;
  return sleep(680).then(()=>f.remove());}

/* assembly syntax highlight */
const KW=new Set('PROC ENDP DB DW DD DQ DT EQU DUP END TITLE PTR BYTE WORD OFFSET LABEL .MODEL .STACK .DATA .CODE SMALL MEDIUM COMPACT LARGE HUGE'.split(' '));
const REGS=new Set('AX BX CX DX AH AL BH BL CH CL DH DL SI DI SP BP CS DS SS ES IP'.split(' '));
function asm(t){let code=t,cm='',q=null;for(let k=0;k<t.length;k++){const ch=t[k];if(q){if(ch===q)q=null;}else if(ch==="'"||ch==='"')q=ch;else if(ch===';'){code=t.slice(0,k);cm=t.slice(k);break;}}
  const toks=code.match(/'[^']*'?|"[^"]*"?|[A-Za-z_@.$?][\w@.$?]*:?|\d[0-9A-Fa-f]*[hHbBdD]?|\s+|./g)||[];let out='',seenOp=false;
  const named=/^\s*[A-Za-z_@$?][\w@.$?]*\s+(DB|DW|DD|DQ|DT|EQU|PROC|ENDP|LABEL)\b/i.test(code);let nameDone=!named;
  toks.forEach(tk=>{const u=tk.toUpperCase();let c=null;
    if(/^['"]/.test(tk))c='s';
    else if(/^[A-Za-z_@.$?][\w@.$?]*:$/.test(tk)&&!seenOp)c='lb';
    else if(/^\d/.test(tk))c='n';
    else if(/^[A-Za-z_@.$?]/.test(tk)&&!nameDone){c='lb';nameDone=true;}
    else if(/^[A-Za-z_@.$?]/.test(tk)){if(KW.has(u))c='k';else if(REGS.has(u))c='rgn';else if(!seenOp){c='k';seenOp=true;}}
    if(c==='k')seenOp=true;
    out+=c?`<span class="${c}">${esc(tk)}</span>`:esc(tk);});
  return out+(cm?`<span class="cm">${esc(cm)}</span>`:'');}

/* ================= scene: diagram (SVG) ================= */
let UID=0;
SC.dg=(root,cfg)=>{const uid=++UID,Wd=cfg.w||1000,Ht=cfg.h||520;const wrap=el('div',{class:'scroll-x'});
  const s=sv('svg',{viewBox:`0 0 ${Wd} ${Ht}`,class:'dg',role:'img'});
  const mkr=(id,on)=>sv('marker',{id:id+uid,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:4.2,markerHeight:4.2,orient:'auto-start-reverse'},sv('path',{d:'M0,0 L10,5 L0,10 z',class:'mk'+(on?' on':'')}));
  s.append(sv('defs',null,mkr('ah',0),mkr('ahOn',1)));
  const N={};cfg.nodes.forEach(n=>N[n.id]=n);
  const anchor=spec=>{const p=spec.split(':');const n=N[p[0]];const side=p[1]||'r';const f=p[2]==null?.5:+p[2];
    if(side==='l')return[n.x,n.y+n.h*f,'h'];if(side==='r')return[n.x+n.w,n.y+n.h*f,'h'];if(side==='t')return[n.x+n.w*f,n.y,'v'];return[n.x+n.w*f,n.y+n.h,'v'];};
  const pathOf=e=>{const A=anchor(e.a),B=anchor(e.b);let pts=[[A[0],A[1]]];
    if(e.via)pts=pts.concat(e.via);
    else if(A[0]!==B[0]&&A[1]!==B[1]){
      if(A[2]==='h'&&B[2]==='h'){const mx=e.mx!=null?e.mx:(A[0]+B[0])/2;pts.push([mx,A[1]],[mx,B[1]]);}
      else if(A[2]==='v'&&B[2]==='v'){const my=e.my!=null?e.my:(A[1]+B[1])/2;pts.push([A[0],my],[B[0],my]);}
      else if(A[2]==='h')pts.push([B[0],A[1]]);else pts.push([A[0],B[1]]);}
    pts.push([B[0],B[1]]);return pts;};
  const gE=sv('g'),gN=sv('g');const E={};
  (cfg.edges||[]).forEach(e=>{const pts=pathOf(e);const d='M'+pts.map(p=>p.join(',')).join(' L');const g=sv('g',{class:'edge'+(e.dash?' dash':'')});
    const p=sv('path',{d,class:'ep'});g.append(p,sv('path',{d,class:'ef'}));let am=null;
    if(!RM){const dot=sv('circle',{r:7,class:'dot'});am=sv('animateMotion',{dur:(e.dur||1.5)+'s',repeatCount:'indefinite',path:d});dot.append(am);g.append(dot);}
    if(e.l){const m=Math.floor((pts.length-1)/2);const[x1,y1]=pts[m],[x2,y2]=pts[m+1];const lx=e.lx!=null?e.lx:(x1+x2)/2,ly=e.ly!=null?e.ly:(y1+y2)/2-10;
      g.append(sv('text',{x:lx,y:ly,class:'el','text-anchor':'middle'},L(e.l)));}
    gE.append(g);E[e.id]={g,p,am,e};});

  jump:{en:'CMP → which jumps are taken?',bn:'CMP → কোন জাম্প কাজ করবে?'},muldiv:{en:'MUL / IMUL / DIV / IDIV lab',bn:'গুণ-ভাগ ল্যাব'}};
const parseNum=(s,base)=>{s=String(s).trim().replace(/[hH]$/,'').replace(/^0x/i,'');if(!s)return NaN;const re=base===2?/^[01]+$/:base===16?/^[0-9a-fA-F]+$/:/^-?\d+$/;return re.test(s)?parseInt(s,base):NaN;};
const grp4=b=>b.replace(/(.{4})(?=.)/g,'$1 ');

TOOLS.conv=root=>{root.append(el('p',{class:'help',text:L({en:'Type a number, pick its base. See it in every form, with the hand-method steps.',bn:'একটি সংখ্যা লিখুন, তার বেস বেছে নিন। সব রূপ আর হাতে করার ধাপগুলো দেখুন।'})}));
  const inp=el('input',{id:'cv-in',value:'95','aria-label':'Number'});const bs=el('select',{id:'cv-b','aria-label':'Base'},el('option',{value:'10',text:'decimal'}),el('option',{value:'2',text:'binary'}),el('option',{value:'16',text:'hex'}));
  const out=el('div',{class:'out'});root.append(el('div',{class:'row'},inp,bs),out);
  const run=()=>{const b=+bs.value;let v=parseNum(inp.value,b);if(isNaN(v)){out.innerHTML=L({en:'Not a valid number in this base.',bn:'এই বেসে সংখ্যাটি সঠিক নয়।'});return;}
    if(v<0)v=(v+65536)&0xFFFF;if(v>0xFFFF){out.innerHTML=L({en:'Keep it within 16 bits (0 – 65535).',bn:'১৬ বিটের মধ্যে রাখুন (0 – 65535)।'});return;}
    const w=v>255?16:8;let s=`<b>binary</b>  ${grp4(BN(v,w))}b\n<b>hex</b>     ${HX(v,w/4)}h\n<b>decimal</b> ${v} unsigned · ${sgn(v,w)} signed (${w}-bit two's complement)\n`;
    if(v>=32&&v<127)s+=`<b>ASCII</b>   '${esc(String.fromCharCode(v))}'\n`;
    s+='\n<i>'+L({en:'Decimal → binary by repeated ÷2 (read remainders bottom → top):',bn:'বারবার ২ দিয়ে ভাগ (ভাগশেষ নিচ থেকে উপরে পড়ুন):'})+'</i>\n';
    let x=v;if(x===0)s+='0\n';const lines=[];while(x>0){lines.push(`${x} ÷ 2 = ${Math.floor(x/2)}  r ${x%2}`);x=Math.floor(x/2);}s+=lines.slice(0,17).join('\n');
    s+='\n\n<i>'+L({en:'Decimal → hex by repeated ÷16:',bn:'বারবার ১৬ দিয়ে ভাগ:'})+'</i>\n';x=v;const l2=[];if(x===0)l2.push('0');while(x>0){l2.push(`${x} ÷ 16 = ${Math.floor(x/16)}  r ${x%16}${x%16>9?' ('+(x%16).toString(16).toUpperCase()+')':''}`);x=Math.floor(x/16);}s+=l2.join('\n');
    if(v<128||w===8){const n=v&0xFF;s+='\n\n<i>'+L({en:"Two's complement of the byte (= −x):",bn:'বাইটের টু’স কমপ্লিমেন্ট (= −x):'})+`</i>\n${BN(n,8)} → flip → ${BN(~n&0xFF,8)} → +1 → ${BN((-n)&0xFF,8)} = ${HX((-n)&0xFF,2)}h`;}
    out.innerHTML=s;};
  inp.addEventListener('input',run);bs.addEventListener('change',run);run();};

TOOLS.seg=root=>{root.append(el('p',{class:'help',text:L({en:'physical = segment × 10h + offset. Fill segment and offset, or fill physical and segment to find the offset.',bn:'ফিজিক্যাল = সেগমেন্ট × 10h + অফসেট। সেগমেন্ট আর অফসেট দিন, অথবা ফিজিক্যাল আর সেগমেন্ট দিয়ে অফসেট বের করুন।'})}));
  const sI=el('input',{id:'sg-s',value:'A4FB'}),oI=el('input',{id:'sg-o',value:'4872'}),pI=el('input',{id:'sg-p',value:'','placeholder':'e.g. 1256A'});const out=el('div',{class:'out'});
  root.append(el('div',{class:'row'},el('span',{class:'lab',text:'segment'}),sI,el('span',{class:'lab',text:'offset'}),oI),el('div',{class:'row'},el('span',{class:'lab',text:'physical (optional)'}),pI),out);
  const run=()=>{const s=parseNum(sI.value,16),o=parseNum(oI.value,16),p=parseNum(pI.value,16);
    if(!isNaN(p)&&!isNaN(s)){const off=p-s*16;out.innerHTML=(off<0||off>0xFFFF)?L({en:`${HX(p,5)}h is not inside segment ${HX(s,4)}h (offset would be out of 0–FFFFh).`,bn:`${HX(p,5)}h ঠিকানাটি সেগমেন্ট ${HX(s,4)}h-এর ভেতরে নেই।`}):
      `  ${HX(p,5)}h  physical\n− ${HX(s*16,5)}h  segment × 10h\n= <b>${HX(off,4)}h</b>   offset\n\n<i>${HX(s,4)}:${HX(off,4)}</i>`;return;}
    if(isNaN(s)||isNaN(o)||s>0xFFFF||o>0xFFFF){out.textContent=L({en:'Enter 4-digit hex values (0000–FFFF).',bn:'৪ অঙ্কের হেক্স মান দিন (0000–FFFF)।'});return;}
    out.innerHTML=`  ${HX(s,4)}0h   segment shifted left 4 bits\n+  ${HX(o,4)}h   offset\n= <b>${HX((s*16+o)&0xFFFFF,5)}h</b>   physical address${s*16+o>0xFFFFF?'  (wraps past FFFFFh)':''}`;};
  [sI,oI,pI].forEach(e=>e.addEventListener('input',run));run();};

TOOLS.alu=root=>{root.append(el('p',{class:'help',text:L({en:'Choose an instruction and operands (hex). The ALU shows the result and every status flag.',bn:'একটি ইনস্ট্রাকশন আর অপারেন্ড (হেক্স) দিন। এএলইউ ফলাফল আর প্রতিটি স্ট্যাটাস ফ্ল্যাগ দেখাবে।'})}));
  const op=el('select',{id:'al-op'},...['ADD','SUB','CMP','INC','DEC','NEG','AND','OR','XOR','MOV'].map(x=>el('option',{value:x,text:x})));
  const w=el('select',{id:'al-w'},el('option',{value:'16',text:'word (16-bit)'}),el('option',{value:'8',text:'byte (8-bit)'}));
  const a=el('input',{id:'al-a',value:'7FFF'}),b=el('input',{id:'al-b',value:'7FFF'});const st=el('div',{class:'mini-stage'});const out=el('div',{class:'out'});
  root.append(el('div',{class:'row'},op,w),el('div',{class:'row'},el('span',{class:'lab',text:'dest'}),a,el('span',{class:'lab',text:'source'}),b),st,out);
  const run=()=>{const W=+w.value,A=parseNum(a.value,16),B=UNARY.has(op.value)?0:parseNum(b.value,16);b.disabled=UNARY.has(op.value);
    if(isNaN(A)||isNaN(B)){out.textContent=L({en:'Use hex digits only.',bn:'শুধু হেক্স অঙ্ক ব্যবহার করুন।'});return;}
    const R=aluView(st,{op:op.value,a:HX(A,4),b:HX(B,4),w:W,ph:3});if(R.none){out.textContent='';return;}const M=W===8?0xFF:0xFFFF;const ua=A&M,ub=B&M;
    let t='';if(op.value==='ADD'){t+=L({en:'unsigned: ',bn:'আনসাইনড: '})+`${ua} + ${ub} = ${ua+ub}${ua+ub>M?' → does not fit → CF = 1':' → fits'}\n`;t+=L({en:'signed:   ',bn:'সাইনড:   '})+`${sgn(ua,W)} + ${sgn(ub,W)} = ${sgn(ua,W)+sgn(ub,W)}${R.of?' → out of range → OF = 1':' → fits'}`;}
    else if(op.value==='SUB'||op.value==='CMP'){t+=`unsigned: ${ua} − ${ub} = ${ua-ub}${ua<ub?' → borrow → CF = 1':''}\nsigned:   ${sgn(ua,W)} − ${sgn(ub,W)} = ${sgn(ua,W)-sgn(ub,W)}${R.of?' → out of range → OF = 1':''}`;}
    out.textContent=t;};
  [op,w].forEach(e=>e.addEventListener('change',run));[a,b].forEach(e=>e.addEventListener('input',run));run();};

TOOLS.shift=root=>{root.append(el('p',{class:'help',text:L({en:'Click bits (or CF) to flip them, then press an instruction. Each press is one shift or rotate by 1.',bn:'বিট বা CF-এ ক্লিক করে বদলান, তারপর ইনস্ট্রাকশন চাপুন। প্রতিবার ১ ঘর শিফট বা রোটেট হবে।'})}));
  const host=el('div',{class:'mini-stage'});root.append(host);const sc=SC.bits(host,{rows:[{id:'x',label:'AL',n:8,idx:true,show:'hus'}],cf:true});

  const cur=()=>{let st='10001010',cf='1';steps.forEach(p=>{const s=p.s;if(s.rows)st=s.rows.x;if(s.cf!=null)cf=s.cf;if(s.op){const r=doOp(st,cf,s.op.t);st=r[0];cf=r[1];}});return{st,cf};};
  host.addEventListener('click',e=>{const c=e.target.closest('.cell');if(!c)return;const S=cur();const box=c.closest('.cfbox');
    if(box){steps=[{s:{rows:{x:S.st},cf:S.cf==='1'?'0':'1'}}];}else{const cells=[...host.querySelectorAll('.bbox .cell')];const k=cells.indexOf(c);if(k<0)return;const b=S.st.split('');b[k]=b[k]==='1'?'0':'1';steps=[{s:{rows:{x:b.join('')},cf:S.cf}}];}draw(0);});
  const bar=el('div',{class:'row'});['SHL','SHR','SAR','ROL','ROR','RCL','RCR'].forEach(t=>bar.append(el('button',{class:'tb',text:t,onclick:()=>{if(steps.length>40){const S=cur();steps=[{s:{rows:{x:S.st},cf:S.cf}}];}steps.push({s:{op:{id:'x',t}}});draw(1);}})));
  root.append(bar);setTimeout(()=>draw(0),0);};

TOOLS.jump=root=>{root.append(el('p',{class:'help',text:L({en:'CMP AX,BX computes AX − BX and sets the flags. Then each conditional jump reads those flags.',bn:'CMP AX,BX হিসাব করে AX − BX এবং ফ্ল্যাগ সেট করে। তারপর প্রতিটি কন্ডিশনাল জাম্প সেই ফ্ল্যাগ পড়ে।'})}));
  const a=el('input',{id:'jp-a',value:'7FFF'}),b=el('input',{id:'jp-b',value:'8000'});const out=el('div',{class:'out'});const tb=el('table',{class:'jt'});
  root.append(el('div',{class:'row'},el('span',{class:'lab',text:'AX'}),a,el('span',{class:'lab',text:'BX'}),b),out,tb);
  const J=[['JE / JZ','ZF=1',f=>f.zf],['JNE / JNZ','ZF=0',f=>!f.zf],['JG / JNLE','ZF=0 and SF=OF',f=>!f.zf&&f.sf===f.of,'signed'],['JGE / JNL','SF=OF',f=>f.sf===f.of,'signed'],['JL / JNGE','SF≠OF',f=>f.sf!==f.of,'signed'],['JLE / JNG','ZF=1 or SF≠OF',f=>f.zf||f.sf!==f.of,'signed'],
    ['JA / JNBE','CF=0 and ZF=0',f=>!f.cf&&!f.zf,'unsigned'],['JAE / JNB','CF=0',f=>!f.cf,'unsigned'],['JB / JNAE','CF=1',f=>f.cf,'unsigned'],['JBE / JNA','CF=1 or ZF=1',f=>f.cf||f.zf,'unsigned'],['JC','CF=1',f=>f.cf],['JO','OF=1',f=>f.of],['JS','SF=1',f=>f.sf],['JP / JPE','PF=1',f=>f.pf]];
  const run=()=>{const A=parseNum(a.value,16),B=parseNum(b.value,16);if(isNaN(A)||isNaN(B)){out.textContent='hex only';return;}const f=aluCalc('CMP',A,B,16);
    out.innerHTML=`AX = ${HX(A,4)}h  (u ${A&0xFFFF}, s ${sgn(A&0xFFFF,16)})\nBX = ${HX(B,4)}h  (u ${B&0xFFFF}, s ${sgn(B&0xFFFF,16)})\nAX − BX = ${HX(f.r,4)}h → <b>ZF=${f.zf} SF=${f.sf} OF=${f.of} CF=${f.cf} PF=${f.pf}</b>`;
    tb.innerHTML='';J.forEach(([n,c,fn,k])=>{const y=!!fn(f);tb.append(el('tr',null,el('td',{text:n}),el('td',{class:'n',text:c}),el('td',{class:'n',text:k||'flag'}),el('td',{class:y?'y':'n',text:y?L({en:'jumps',bn:'জাম্প করবে'}):L({en:'falls through',bn:'জাম্প করবে না'})})));});};
  [a,b].forEach(e=>e.addEventListener('input',run));run();};

TOOLS.muldiv=root=>{root.append(el('p',{class:'help',text:L({en:'Byte form uses AL / AX; word form uses AX / DX:AX. Values in hex.',bn:'বাইট ফর্মে AL / AX, ওয়ার্ড ফর্মে AX / DX:AX ব্যবহার হয়। মান হেক্সে দিন।'})}));
  const op=el('select',{id:'md-op'},...['MUL','IMUL','DIV','IDIV'].map(x=>el('option',{value:x,text:x})));const w=el('select',{id:'md-w'},el('option',{value:'8',text:'byte'}),el('option',{value:'16',text:'word'}));
  const d=el('input',{id:'md-d',value:'80'}),s=el('input',{id:'md-s',value:'FF'});const lab=el('span',{class:'lab'});const out=el('div',{class:'out'});
  root.append(el('div',{class:'row'},op,w),el('div',{class:'row'},lab,d,el('span',{class:'lab',text:'source'}),s),out);
  const run=()=>{const O=op.value,W=+w.value;const isDiv=O.includes('DIV');lab.textContent=isDiv?(W===8?'AX (dividend)':'DX:AX (8 hex digits)'):(W===8?'AL':'AX');
    const D=parseNum(d.value,16),S=parseNum(s.value,16);if(isNaN(D)||isNaN(S)){out.textContent='hex only';return;}const M=W===8?0xFF:0xFFFF;const sv_=S&M;let t='';
    if(!isDiv){const a=D&M;if(O==='MUL'){const p=a*sv_;const hi=Math.floor(p/(M+1)),lo=p%(M+1);t=W===8?`AX = ${HX(p,4)}h  (${a} × ${sv_} = ${p})\nAH = ${HX(hi,2)}h → CF = OF = ${hi?1:0}`:`DX:AX = ${HX(hi,4)}:${HX(lo,4)}h  (${a} × ${sv_} = ${p})\nCF = OF = ${hi?1:0}`;t+=hi?'\n<b>upper half is not 0 — product does not fit in the lower half</b>':'\nupper half is 0 — product fits in '+(W===8?'AL':'AX');}
      else{const pa=sgn(a,W),ps=sgn(sv_,W),p=pa*ps;const R=W===8?(p&0xFFFF):((p%4294967296)+4294967296)%4294967296;const hi=Math.floor(R/(M+1)),lo=R%(M+1);const fits=p>=-(M+1)/2&&p<(M+1)/2;
        t=(W===8?`AX = ${HX(R,4)}h`:`DX:AX = ${HX(hi,4)}:${HX(lo,4)}h`)+`  (${pa} × ${ps} = ${p})\nCF = OF = ${fits?0:1}`+(fits?'\nupper half is just the sign extension of the lower half':'\n<b>upper half is not a sign extension — signed result needs the full width</b>');}}
    else{if(sv_===0){out.innerHTML='<b>DIVIDE OVERFLOW</b> — division by zero';return;}
      if(O==='DIV'){const dd=W===8?(D&0xFFFF):D>>>0;const q=Math.floor(dd/sv_),r=dd%sv_;t=q>M?`<b>DIVIDE OVERFLOW</b> — quotient ${q} does not fit in ${W===8?'AL':'AX'}`:`${dd} ÷ ${sv_}\nquotient  → ${W===8?'AL':'AX'} = ${HX(q,W/4)}h (${q})\nremainder → ${W===8?'AH':'DX'} = ${HX(r,W/4)}h (${r})`;}
      else{const dd=W===8?sgn(D&0xFFFF,16):(D|0);const dv=sgn(sv_,W);const q=Math.trunc(dd/dv),r=dd-q*dv;const lim=(M+1)/2;t=(q<-lim||q>=lim)?`<b>DIVIDE OVERFLOW</b> — quotient ${q} does not fit in ${W===8?'AL':'AX'}`:`${dd} ÷ ${dv}\nquotient  → ${W===8?'AL':'AX'} = ${HX(q&M,W/4)}h (${q})\nremainder → ${W===8?'AH':'DX'} = ${HX(r&M,W/4)}h (${r}, sign of the dividend)`;}}

  [op,w].forEach(e=>e.addEventListener('change',run));[d,s].forEach(e=>e.addEventListener('input',run));run();};

<script>
"use strict";
const CH=[];
const st=(en,bn,s)=>({en,bn,s:s||{}});
const T=(en,bn,sc,steps,tool)=>({t:{en,bn},sc,steps,tool});
const b2=(s)=>s.replace(/\s/g,'');

/* ===================== CHAPTER 1 ===================== */
CH.push({n:1,t:{en:'Microcomputer Systems',bn:'মাইক্রোকম্পিউটার সিস্টেম'},topics:[

T('The physical system','ফিজিক্যাল সিস্টেম',
 {type:'dg',h:500,nodes:[
  {id:'unit',x:370,y:150,w:260,h:150,l:'System Unit',s:'circuit boards inside'},
  {id:'kb',x:40,y:40,w:220,h:90,l:'Keyboard',s:'input'},
  {id:'disp',x:740,y:40,w:220,h:90,l:'Display',s:'output'},
  {id:'disk',x:740,y:290,w:220,h:90,l:'Disk drives',s:'permanent storage'},
  {id:'chip',x:40,y:290,w:220,h:90,l:'IC chips',s:'thousands of transistors'},
  {id:'bits',x:310,y:390,w:380,h:80,l:'0 1 1 0 0 0 0 1',s:'a bit string (one byte)',mono:true,fs:30}],
  edges:[{id:'e1',a:'kb:r',b:'unit:l:.25'},{id:'e2',a:'unit:r:.25',b:'disp:l'},{id:'e3',a:'unit:r:.75',b:'disk:l',bi:true},{id:'e4',a:'chip:r',b:'unit:l:.75',dash:true,dir:'none'},{id:'e5',a:'unit:b',b:'bits:t'}]},
 [st('A microcomputer system starts with the system unit. It holds the circuit boards, and most people simply call it the computer.',
     'মাইক্রোকম্পিউটার সিস্টেমের কেন্দ্রে থাকে সিস্টেম ইউনিট। এর ভেতরে সার্কিট বোর্ডগুলো থাকে, আর সাধারণত একেই আমরা কম্পিউটার বলি।',{hl:['unit']}),
  st('Peripherals such as the keyboard, the display screen and the disk drives connect to the system unit. They carry out input and output for it.',
     'কিবোর্ড, ডিসপ্লে স্ক্রিন আর ডিস্ক ড্রাইভের মতো পেরিফেরাল ডিভাইসগুলো সিস্টেম ইউনিটের সাথে যুক্ত থাকে। এরা কম্পিউটারের হয়ে ইনপুট আর আউটপুটের কাজ করে।',{hl:['kb','disp','disk'],on:['e1','e2','e3']}),
  st('Inside the unit, circuits are built from integrated circuit chips. A single chip can hold thousands of transistors.',
     'সিস্টেম ইউনিটের ভেতরের সার্কিটগুলো তৈরি হয় আইসি বা ইন্টিগ্রেটেড সার্কিট চিপ দিয়ে। একটি চিপে হাজার হাজার ট্রানজিস্টর থাকতে পারে।',{hl:['chip','unit'],on:['e4']}),
  st('These are digital circuits. They use only two voltage levels: a high voltage, written as 1, and a low voltage, written as 0.',
     'এগুলোকে ডিজিটাল সার্কিট বলে, কারণ এরা মাত্র দুটি ভোল্টেজ লেভেলে কাজ করে। হাই ভোল্টেজকে আমরা লিখি ১, আর লো ভোল্টেজকে লিখি ০।',{hl:['chip','bits'],on:['e5'],note:'High voltage → 1     Low voltage → 0'}),
  st('The symbols 0 and 1 are binary digits, or bits. Every number, letter, instruction and image is stored as a string of bits like this one.',
     '০ আর ১ এই প্রতীকগুলোকে বলে বাইনারি ডিজিট বা বিট। প্রতিটি সংখ্যা, অক্ষর, ইনস্ট্রাকশন বা ছবি কম্পিউটারে এভাবে বিটের সারি হিসেবে জমা থাকে।',{hl:['bits'],note:'01100001 = one byte = 8 bits'})]),

 [st('A microcomputer has three functional parts. The first is the CPU, the brain of the computer. In a microcomputer the whole CPU is a single chip called the microprocessor.',
     'একটি মাইক্রোকম্পিউটারের তিনটি কার্যকরী অংশ। প্রথমটি সিপিইউ, যাকে কম্পিউটারের মস্তিষ্ক বলা হয়। মাইক্রোকম্পিউটারে পুরো সিপিইউ একটি চিপেই থাকে, একে বলে মাইক্রোপ্রসেসর।',{hl:['cpu']}),
  st('The second part is memory. It stores the instructions and the data that the CPU is using right now.',

  st('The third part is the I/O circuits. They let the CPU talk to peripherals through I/O ports, and they usually sit on add-in cards.',
     'তৃতীয় অংশ আই/ও সার্কিট। এর মাধ্যমে সিপিইউ আই/ও পোর্ট দিয়ে পেরিফেরাল ডিভাইসের সাথে যোগাযোগ করে। এগুলো সাধারণত অ্যাড-ইন কার্ডে বসানো থাকে।',{hl:['io','per'],on:['e2','e3']}),
  st('The system board, also called the motherboard, holds the microprocessor and the memory circuits, plus expansion slots for the add-in cards.',
     'সিস্টেম বোর্ড বা মাদারবোর্ডে মাইক্রোপ্রসেসর আর মেমোরি সার্কিট থাকে, সাথে থাকে অ্যাড-ইন কার্ড লাগানোর জন্য এক্সপ্যানশন স্লট।',{hl:['mb','cpu','mem','io']})]),

T('Bits, bytes and words','বিট, বাইট ও ওয়ার্ড',
 {type:'bits',rows:[{id:'w',label:'word',n:16,idx:true,nib:true,show:'h'}]},
 [st('A bit is a single binary digit, either 0 or 1. The highlighted cell is one bit.',
     'বিট হলো একটি বাইনারি ডিজিট, হয় ০, নয় ১। হাইলাইট করা ঘরটি একটি বিট।',{rows:{w:'0001001000110100'},hl:{w:[0]}}),
  st('A group of eight bits is a byte. In memory, every byte has its own unique address.',
     'আটটি বিট মিলে হয় এক বাইট। মেমোরিতে প্রতিটি বাইটের আলাদা, নিজস্ব অ্যাড্রেস থাকে।',{hl:{w:range(0,7)},note:'1 byte = 8 bits'}),
  st('Two successive bytes form a word. On the IBM PC a word is 16 bits, numbered from bit 0 on the right to bit 15 on the left.',
     'পরপর দুটি বাইট মিলে হয় একটি ওয়ার্ড। আইবিএম পিসিতে ওয়ার্ড ১৬ বিটের, ডান দিকের বিট ০ থেকে বাম দিকের বিট ১৫ পর্যন্ত নম্বর দেওয়া।',{hl:{w:'all'},note:'1 word = 2 bytes = 16 bits'}),
  st('Bits 8 to 15 form the high byte. Here the high byte is 12 hex.',
     'বিট ৮ থেকে ১৫ মিলে হাই বাইট। এখানে হাই বাইটের মান 12h।',{hl:{w:range(8,15)},note:'high byte = 12h'}),
  st('Bits 0 to 7 form the low byte, here 34 hex. A word is addressed by the address of its low byte.',
     'বিট ০ থেকে ৭ মিলে লো বাইট, এখানে 34h। একটি ওয়ার্ডের অ্যাড্রেস হলো তার লো বাইটের অ্যাড্রেস।',{hl:{w:range(0,7)},note:'low byte = 34h'}),
  st('The number of address bits decides how much memory a CPU can reach. The 8086 has 20 address bits, so it can address 2 to the power 20 bytes, which is one megabyte.',
     'অ্যাড্রেস বিটের সংখ্যা ঠিক করে সিপিইউ কতটা মেমোরি ব্যবহার করতে পারবে। ৮০৮৬ এ ২০টি অ্যাড্রেস বিট আছে, তাই এটি ২ এর ঘাত ২০ বাইট, অর্থাৎ এক মেগাবাইট মেমোরি অ্যাড্রেস করতে পারে।',{note:'20 address bits → 2²⁰ = 1,048,576 bytes = 1 MB'})]),

T('Address vs. contents','অ্যাড্রেস বনাম কনটেন্ট',
 {type:'mem',cols:[{id:'m',title:'address · contents',rows:[
   {a:'7',v:'00101101'},{a:'6',v:'11001110'},{a:'5',v:'00001101'},{a:'4',v:'11101101'},{a:'3',v:'00000000'},{a:'2',v:'11111111'},{a:'1',v:'01011110'},{a:'0',v:'01100001'}]}]},
 [st('Memory is a long row of bytes. Each byte has an address, shown on the left, and contents, shown in the box.',
     'মেমোরি হলো বাইটের একটি লম্বা সারি। প্রতিটি বাইটের একটি অ্যাড্রেস থাকে, বাম পাশে দেখানো, আর একটি কনটেন্ট বা মান থাকে, বাক্সের ভেতরে।',{}),
  st('The address is fixed and unique, like the street address of a house. Address 3 always means this same byte.',
     'অ্যাড্রেস স্থির এবং অনন্য, ঠিক বাড়ির ঠিকানার মতো। অ্যাড্রেস ৩ সবসময় এই একই বাইটকে বোঝায়।',{hl:['m:4'],ptr:{'addr 3':'m:4'}}),
  st('The contents are the data stored there, and they can change. A program has just written a new value into address 3.',
     'কনটেন্ট হলো সেখানে রাখা ডেটা, এবং এটি বদলাতে পারে। এইমাত্র একটি প্রোগ্রাম অ্যাড্রেস ৩-এ নতুন একটি মান লিখেছে।',{hl:['m:4'],set:{'m:4':'10101100'}}),
  st('Example 1.1. If a processor uses 20 bits for an address, it has 2 to the power 20 distinct addresses. That is 1,048,576 bytes, or one megabyte.',
     'উদাহরণ ১.১। কোনো প্রসেসর যদি অ্যাড্রেসের জন্য ২০ বিট ব্যবহার করে, তাহলে মোট ২ এর ঘাত ২০টি আলাদা অ্যাড্রেস পাওয়া যায়। অর্থাৎ ১০ লক্ষ ৪৮ হাজার ৫৭৬ বাইট, বা এক মেগাবাইট।',{ptr:{'addr 3':null},note:'20 bits → 2²⁰ = 1,048,576 bytes = 1 MB'})]),

T('RAM vs. ROM','র‍্যাম বনাম রম',
 {type:'cards',min:260,items:[
  {tag:'RAM',h:'Random Access Memory',b:{en:['Can be read and written','Holds the programs and data in use','Volatile: contents are lost when power goes off','So valuable work must be saved to disk first'],bn:['পড়া ও লেখা দুটোই যায়','চলমান প্রোগ্রাম ও ডেটা রাখে','ভোলাটাইল: বিদ্যুৎ চলে গেলে তথ্য মুছে যায়','তাই গুরুত্বপূর্ণ কাজ আগে ডিস্কে সেভ করতে হয়']}},
  {tag:'ROM',h:'Read-Only Memory',b:{en:['Can only be read, not written','Contents set when it is manufactured','Non-volatile: keeps its values with power off','Stores firmware: boot and self-test routines'],bn:['শুধু পড়া যায়, লেখা যায় না','তৈরির সময়েই মান বসানো থাকে','নন-ভোলাটাইল: বিদ্যুৎ না থাকলেও তথ্য থাকে','ফার্মওয়্যার রাখে: বুট ও সেলফ-টেস্ট রুটিন']}}]},
 [st('Memory chips come in two kinds. RAM, random access memory, can be both read and written. It holds the programs and data in use.',
     'মেমোরি চিপ দুই ধরনের। র‍্যাম বা র‍্যান্ডম অ্যাক্সেস মেমোরি পড়া ও লেখা দুটোই যায়। চলমান প্রোগ্রাম আর ডেটা এখানে থাকে।',{hl:[0]}),
  st('RAM is volatile. When the power goes off, its contents are lost, so anything valuable must be saved to a disk first.',
     'র‍্যাম ভোলাটাইল। বিদ্যুৎ চলে গেলে এর সব তথ্য মুছে যায়, তাই গুরুত্বপূর্ণ কিছু আগে ডিস্কে সেভ করে রাখতে হয়।',{hl:[0]}),
  st('ROM, read-only memory, can only be read. Its contents are set at the factory and stay permanently, even with the power off.',
     'রম বা রিড-অনলি মেমোরি শুধু পড়া যায়। কারখানায় তৈরির সময়েই এর মান বসানো হয়, এবং বিদ্যুৎ না থাকলেও তা স্থায়ীভাবে থেকে যায়।',{hl:[1]}),
  st('That is why ROM stores firmware, such as the routines that test the machine and start it up when you switch it on.',
     'এই কারণেই রমে ফার্মওয়্যার রাখা হয়, যেমন কম্পিউটার চালু করার সময় মেশিন পরীক্ষা করার আর বুট করার রুটিনগুলো।',{hl:[1]})]),

T('Buses: address, data and control','বাস: অ্যাড্রেস, ডেটা ও কন্ট্রোল',
 {type:'dg',h:520,nodes:[
  {id:'cpu',x:30,y:170,w:200,h:180,l:'CPU'},
  {id:'mem',x:770,y:40,w:200,h:140,l:'Memory'},
  {id:'io',x:770,y:340,w:200,h:140,l:'I/O circuits'},
  {id:'ab',x:300,y:140,w:400,h:30,shape:'bar',l:'ADDRESS BUS'},
  {id:'db',x:300,y:245,w:400,h:30,shape:'bar',l:'DATA BUS'},
  {id:'cb',x:300,y:350,w:400,h:30,shape:'bar',l:'CONTROL BUS'}],
  edges:[{id:'a1',a:'cpu:r:.15',b:'ab:l'},{id:'a2',a:'ab:r',b:'mem:l:.25'},{id:'a3',a:'ab:r',b:'io:l:.25',mx:735},
   {id:'d1',a:'db:l',b:'cpu:r:.5',bi:true},{id:'d2',a:'mem:l:.6',b:'db:r',bi:true,mx:745},{id:'d3',a:'io:l:.55',b:'db:r',bi:true,mx:745},
   {id:'c1',a:'cpu:r:.85',b:'cb:l'},{id:'c2',a:'cb:r',b:'mem:l:.9',mx:755},{id:'c3',a:'cb:r',b:'io:l:.85'}]},
 [st('A bus is a set of wires connecting the CPU, memory and I/O circuits. There are three buses, and each carries one kind of signal.',
     'বাস হলো কতগুলো তারের সমষ্টি, যা সিপিইউ, মেমোরি আর আই/ও সার্কিটকে যুক্ত করে। তিন ধরনের বাস আছে, প্রতিটি এক ধরনের সিগন্যাল বহন করে।',{hl:['ab','db','cb']}),
  st('To read a memory location, the CPU first places its address on the address bus. Addresses only travel out of the CPU.',
     'মেমোরি থেকে কিছু পড়তে হলে সিপিইউ প্রথমে সেই লোকেশনের অ্যাড্রেস অ্যাড্রেস বাসে দেয়। অ্যাড্রেস শুধু সিপিইউ থেকে বাইরের দিকে যায়।',{hl:['cpu','ab','mem'],on:['a1','a2'],note:'step 1 · CPU → address bus'}),
  st('Next, the CPU sends a read signal on the control bus. Control signals such as read and write also travel out of the CPU.',
     'এরপর সিপিইউ কন্ট্রোল বাসে রিড সিগন্যাল পাঠায়। রিড, রাইটের মতো কন্ট্রোল সিগন্যালও সিপিইউ থেকে বাইরে যায়।',{hl:['cpu','cb','mem'],on:['c1','c2'],note:'step 2 · CPU → control bus: "read"'}),
  st('Memory responds by putting the requested data on the data bus, and the CPU takes it in.',
     'মেমোরি তখন চাওয়া ডেটাটি ডেটা বাসে দেয়, আর সিপিইউ সেটি গ্রহণ করে।',{hl:['mem','db','cpu'],on:['d2','d1'],note:'step 3 · memory → data bus → CPU'}),
  st('The data bus is two-way. On a read, data comes into the CPU. On a write, data goes out of the CPU to memory or I/O.',
     'ডেটা বাস দুই দিকেই কাজ করে। রিডের সময় ডেটা সিপিইউতে আসে, আর রাইটের সময় ডেটা সিপিইউ থেকে মেমোরি বা আই/ও-তে যায়।',{hl:['db'],on:['d1','d2','d3'],rev:['d1','d2','d3'],note:'write: CPU → data bus → memory / I/O'})]),

T('Inside the 8086: EU and BIU','৮০৮৬-এর ভেতরে: ইইউ ও বিআইইউ',
 {type:'fig16'},
 [st('This is Figure 1.6 from the textbook: the organization of the Intel 8086. A dashed line splits the chip into two units that work side by side: the Execution Unit, or EU, on the left and the Bus Interface Unit, or BIU, on the right.',
     'এটি পাঠ্যবইয়ের চিত্র ১.৬: ইন্টেল ৮০৮৬-এর গঠন। একটি ড্যাশ দাগ চিপটিকে দুটি ইউনিটে ভাগ করেছে, যারা পাশাপাশি কাজ করে: বাম দিকে এক্সিকিউশন ইউনিট বা ইইউ, আর ডান দিকে বাস ইন্টারফেস ইউনিট বা বিআইইউ।',{hl:['eu','biu']}),
  st('Start in the EU. The general registers AX, BX, CX, DX, SP, BP, SI and DI hold the data and addresses the EU is working with right now.',
     'শুরু করি ইইউ থেকে। জেনারেল রেজিস্টার AX, BX, CX, DX, SP, BP, SI ও DI-তে সেই ডেটা ও অ্যাড্রেস থাকে, যা নিয়ে ইইউ এই মুহূর্তে কাজ করছে।',{hl:['gr'],on:['p_gr'],dim:true}),
  st('The internal bus is the fast path inside the chip. It links the registers, the temporary registers and the ALU, and it even crosses the dashed line to reach the BIU.',
     'ইন্টারনাল বাস হলো চিপের ভেতরের দ্রুত পথ। এটি রেজিস্টার, টেম্পোরারি রেজিস্টার আর এএলইউ-কে যুক্ত করে, এমনকি ড্যাশ দাগ পেরিয়ে বিআইইউ পর্যন্ত পৌঁছায়।',{hl:['ibus'],on:['p_gr','p_t1','p_t2','p_si'],dim:true}),
  st('The temporary registers are hidden from the programmer. They hold the two operands on their way into the ALU.',
     'টেম্পোরারি রেজিস্টারগুলো প্রোগ্রামার দেখতে পায় না। দুটি অপারেন্ড এএলইউ-তে ঢোকার পথে এগুলোতে সাময়িকভাবে থাকে।',{hl:['tmp','alu'],on:['p_t1','p_t2','p_a1','p_a2'],dim:true}),
  st('The ALU does the arithmetic and the logic: add, subtract, multiply, divide, AND, OR and NOT. Its result goes back onto the internal bus.',
     'এএলইউ গাণিতিক ও লজিক্যাল কাজ করে: যোগ, বিয়োগ, গুণ, ভাগ, AND, OR ও NOT। এর ফলাফল আবার ইন্টারনাল বাসে ফিরে যায়।',{hl:['alu','ibus'],on:['p_a1','p_a2','p_ar'],dim:true}),
  st('After every operation the ALU updates the Flags register, which records the status of the result. The flags can also be read over the internal bus.',
     'প্রতিটি অপারেশনের পর এএলইউ ফ্ল্যাগ রেজিস্টার আপডেট করে, যাতে ফলাফলের অবস্থা লেখা থাকে। ইন্টারনাল বাস দিয়ে ফ্ল্যাগগুলোও পড়া যায়।',{hl:['alu','flg'],on:['p_af','p_fr'],dim:true}),
  st('Now the BIU. Its segment registers CS, DS, SS and ES, together with the instruction pointer IP, tell where the code, data, stack and next instruction are in memory.',
     'এবার বিআইইউ। এর সেগমেন্ট রেজিস্টার CS, DS, SS ও ES, আর ইনস্ট্রাকশন পয়েন্টার IP মিলে বলে দেয় মেমোরিতে কোড, ডেটা, স্ট্যাক আর পরের ইনস্ট্রাকশন কোথায় আছে।',{hl:['seg','biu'],on:['p_si'],dim:true}),
  st('The bus control logic turns a segment and an offset into a twenty-bit physical address, and it generates the control signals for every memory or I/O access over the external bus.',
     'বাস কন্ট্রোল লজিক সেগমেন্ট আর অফসেট থেকে বিশ বিটের ফিজিক্যাল অ্যাড্রেস তৈরি করে, এবং এক্সটার্নাল বাস দিয়ে প্রতিটি মেমোরি বা আই/ও অ্যাক্সেসের কন্ট্রোল সিগন্যাল তৈরি করে।',{hl:['bcl','ext','seg'],on:['p_sb','p_ex'],dim:true}),
  st('While the EU is busy, the BIU fetches the next instruction bytes from memory ahead of time and keeps up to six of them in the instruction queue.',
     'ইইউ যখন ব্যস্ত, তখন বিআইইউ আগেভাগেই মেমোরি থেকে পরের ইনস্ট্রাকশনের বাইটগুলো এনে ইনস্ট্রাকশন কিউতে সর্বোচ্চ ছয়টি পর্যন্ত জমা রাখে।',{hl:['q','bcl','ext'],on:['p_ex','p_bq'],rev:['p_ex'],dim:true}),
  st('The EU takes its next instruction straight from the queue, so it rarely waits for memory. Fetching and executing overlap instead of happening one after another. This is pipelining, and it is what makes the 8086 fast.',
     'ইইউ পরের ইনস্ট্রাকশন সরাসরি কিউ থেকে নেয়, তাই তাকে মেমোরির জন্য খুব কমই অপেক্ষা করতে হয়। ফেচ আর এক্সিকিউট একটির পর একটি না হয়ে একসাথে চলে। একেই পাইপলাইনিং বলে, আর এটাই ৮০৮৬-কে দ্রুত করে।',{hl:['q','alu','tmp','bcl'],on:['p_ex','p_bq','p_qe','p_qi','p_a1','p_a2'],rev:['p_ex'],note:{en:'BIU fetches while EU executes = pipelining',bn:'বিআইইউ ফেচ করে, ইইউ একই সময়ে এক্সিকিউট করে = পাইপলাইনিং'}})]),

T('The 8086 registers','৮০৮৬-এর রেজিস্টারসমূহ',
 {type:'regs',dimGroups:true,init:{AX:'0000',BX:'0000',CX:'0000',DX:'0000',SP:'0100',BP:'0000',SI:'0000',DI:'0000',CS:'0B3C',DS:'0B4C',SS:'0B4E',ES:'0B2C',IP:'0000',FLAGS:'0202'}},
 [st('The 8086 has fourteen 16-bit registers. AX, BX, CX and DX are the data registers, used for arithmetic and moving data. Each one splits into a high byte and a low byte.',
     '৮০৮৬-এ মোট চৌদ্দটি ১৬ বিটের রেজিস্টার আছে। AX, BX, CX, DX হলো ডেটা রেজিস্টার, যেগুলো গণনা আর ডেটা আদান-প্রদানে ব্যবহৃত হয়। প্রতিটিকে আবার হাই বাইট আর লো বাইটে ভাগ করা যায়।',{grp:'data'}),
  st('SP, BP, SI and DI are the pointer and index registers. They hold offsets used to address the stack and arrays.',
     'SP, BP, SI, DI হলো পয়েন্টার ও ইনডেক্স রেজিস্টার। স্ট্যাক আর অ্যারে অ্যাক্সেস করার জন্য এরা অফসেট অ্যাড্রেস ধরে রাখে।',{grp:'ptr'}),
  st('CS, DS, SS and ES are the segment registers. Each one holds the start of a 64-kilobyte segment: code, data, stack, or an extra segment.',
     'CS, DS, SS, ES হলো সেগমেন্ট রেজিস্টার। প্রত্যেকে একটি ৬৪ কিলোবাইট সেগমেন্টের শুরু ধরে রাখে: কোড, ডেটা, স্ট্যাক অথবা একটি অতিরিক্ত সেগমেন্ট।',{grp:'seg'}),
  st('IP, the instruction pointer, works together with CS to point at the next instruction to be executed.',
     'IP বা ইনস্ট্রাকশন পয়েন্টার, CS এর সাথে মিলে পরবর্তী যে ইনস্ট্রাকশন এক্সিকিউট হবে তার দিকে নির্দেশ করে।',{grp:'ctl',hl:['IP','CS']}),
  st('Finally, the FLAGS register records the status of the last ALU operation, using one bit for each condition.',
     'সবশেষে ফ্ল্যাগ রেজিস্টার, যা শেষ এএলইউ অপারেশনের অবস্থা লিখে রাখে, প্রতিটি অবস্থার জন্য একটি করে বিট।',{grp:'ctl',hl:['FLAGS']})]),

T('I/O ports: serial vs. parallel','আই/ও পোর্ট: সিরিয়াল বনাম প্যারালাল',
 {type:'dg',h:500,nodes:[
  {id:'cpu',x:30,y:150,w:200,h:200,l:'CPU'},
  {id:'sp',x:330,y:60,w:220,h:100,l:'Serial port',s:'1 bit at a time'},
  {id:'pp',x:330,y:300,w:220,h:150,l:'Parallel port',s:'8 or 16 bits at a time'},
  {id:'kb',x:740,y:60,w:220,h:100,l:'Keyboard',s:'slow device'},
  {id:'dk',x:740,y:300,w:220,h:150,l:'Disk drive',s:'fast device'}],
  edges:[{id:'s0',a:'cpu:r:.2',b:'sp:l'},{id:'p0',a:'cpu:r:.8',b:'pp:l'},{id:'s1',a:'sp:r',b:'kb:l',bi:true,dur:2.6},
   ...[.12,.23,.34,.45,.56,.67,.78,.89].map((f,k)=>({id:'p'+(k+1),a:'pp:r:'+f,b:'dk:l:'+f,dir:'none',dur:1.1}))]},
 [st('I/O devices connect through I/O circuits that contain registers called I/O ports. Ports have their own I/O addresses, separate from memory addresses.',
     'আই/ও ডিভাইসগুলো আই/ও সার্কিটের মাধ্যমে যুক্ত হয়, যার ভেতরে আই/ও পোর্ট নামের রেজিস্টার থাকে। পোর্টগুলোর নিজস্ব আই/ও অ্যাড্রেস আছে, যা মেমোরি অ্যাড্রেস থেকে আলাদা।',{hl:['sp','pp'],on:['s0','p0']}),
  st('A serial port sends one bit at a time over few wires. It is slower, so it suits slow devices such as the keyboard.',
     'সিরিয়াল পোর্ট কম তার ব্যবহার করে একবারে একটি করে বিট পাঠায়। এটি ধীর, তাই কিবোর্ডের মতো ধীর ডিভাইসের জন্য উপযুক্ত।',{hl:['sp','kb'],on:['s1']}),
  st('A parallel port sends 8 or 16 bits at once over many wires. It is faster, so it suits fast devices such as a disk drive.',
     'প্যারালাল পোর্ট অনেক তার দিয়ে একসাথে ৮ বা ১৬ বিট পাঠায়। এটি দ্রুত, তাই ডিস্ক ড্রাইভের মতো দ্রুত ডিভাইসের জন্য উপযুক্ত।',{hl:['pp','dk'],on:['p1','p2','p3','p4','p5','p6','p7','p8']}),
  st('Some devices, such as printers, can connect to either a serial or a parallel port.',
     'কিছু ডিভাইস, যেমন প্রিন্টার, সিরিয়াল বা প্যারালাল যেকোনো পোর্টেই যুক্ত হতে পারে।',{hl:['sp','pp'],on:['s1','p1','p2','p3','p4','p5','p6','p7','p8'],note:'printer: serial or parallel'})]),

T('The fetch–execute cycle','ফেচ–এক্সিকিউট সাইকেল',
 {type:'dg',h:480,nodes:[
  {id:'f',x:30,y:60,w:270,h:120,l:'1 · Fetch',s:'instruction from CS:IP'},
  {id:'d',x:365,y:60,w:270,h:120,l:'2 · Decode',s:'which operation?'},
  {id:'o',x:700,y:60,w:270,h:120,l:'3 · Fetch data',s:'get operands'},
  {id:'x',x:700,y:300,w:270,h:120,l:'4 · Execute',s:'in the ALU'},
  {id:'w',x:365,y:300,w:270,h:120,l:'5 · Store',s:'write result back'}],
  edges:[{id:'e1',a:'f:r',b:'d:l'},{id:'e2',a:'d:r',b:'o:l'},{id:'e3',a:'o:b',b:'x:t'},{id:'e4',a:'x:l',b:'w:r'},{id:'e5',a:'w:l',b:'f:b',l:'next instruction'}]},
 [st('Every instruction runs through the same cycle. Step one, fetch: the CPU reads the instruction from memory at CS colon IP, and IP moves on to the next one.',
     'প্রতিটি ইনস্ট্রাকশন একই চক্রের মধ্য দিয়ে চলে। প্রথম ধাপ ফেচ: সিপিইউ CS:IP অ্যাড্রেস থেকে ইনস্ট্রাকশনটি পড়ে, আর IP পরের ইনস্ট্রাকশনের দিকে এগিয়ে যায়।',{hl:['f']}),
  st('Step two, decode: the CPU works out which operation the bits describe.',
     'দ্বিতীয় ধাপ ডিকোড: বিটগুলো কোন অপারেশন বোঝাচ্ছে, সিপিইউ তা বের করে।',{hl:['d'],on:['e1']}),
  st('Step three, fetch data: if the instruction needs operands from memory, they are read now.',
     'তৃতীয় ধাপ ডেটা ফেচ: ইনস্ট্রাকশনের জন্য মেমোরি থেকে অপারেন্ড লাগলে এখন সেগুলো পড়া হয়।',{hl:['o'],on:['e2']}),
  st('Step four, execute: the ALU performs the operation.',
     'চতুর্থ ধাপ এক্সিকিউট: এএলইউ অপারেশনটি সম্পন্ন করে।',{hl:['x'],on:['e3']}),
  st('Step five, store: if needed, the result is written back. Then the cycle starts again with the next instruction.',
     'পঞ্চম ধাপ স্টোর: প্রয়োজন হলে ফলাফল আবার লেখা হয়। তারপর পরের ইনস্ট্রাকশন দিয়ে চক্রটি আবার শুরু হয়।',{hl:['w'],on:['e4','e5']}),
  st('Worked example: add AX to memory word 0. Fetch the instruction, decode it as add, read word 0, add AX to it in the ALU, and store the sum back in word 0.',
     'উদাহরণ: AX কে মেমোরির ওয়ার্ড ০ এর সাথে যোগ করা। ইনস্ট্রাকশন ফেচ, ডিকোড করে বোঝা যে এটি যোগ, ওয়ার্ড ০ পড়া, এএলইউ-তে AX যোগ করা, তারপর যোগফল আবার ওয়ার্ড ০-তে লেখা।',{hl:['f','d','o','x','w'],on:['e1','e2','e3','e4','e5'],note:'ADD [0],AX : fetch → decode → read word 0 → AX + word0 → store'})]),

T('Clock and timing','ক্লক ও টাইমিং',
 {type:'clock'},
 [st('A clock circuit sends a steady train of pulses. The CPU circuits act only on a pulse, so the clock paces everything the processor does.',
     'ক্লক সার্কিট একটানা পালস পাঠাতে থাকে। সিপিইউ-এর সার্কিট শুধু পালস এলেই কাজ করে, তাই ক্লক প্রসেসরের সব কাজের গতি ঠিক করে।',{mark:''}),
  st('The clock period is the time between two pulses. The clock rate is pulses per second, measured in megahertz. The original IBM PC ran at 4.77 megahertz, about 210 nanoseconds per period.',
     'দুটি পালসের মাঝের সময়কে বলে ক্লক পিরিয়ড। প্রতি সেকেন্ডে পালসের সংখ্যা হলো ক্লক রেট, যা মেগাহার্টজে মাপা হয়। আসল আইবিএম পিসি চলত ৪.৭৭ মেগাহার্টজে, অর্থাৎ প্রতি পিরিয়ড প্রায় ২১০ ন্যানোসেকেন্ড।',{mark:'period'}),
  st('Each step of an instruction takes one or more clock periods. On the 8086, a memory read takes four clock periods.',
     'একটি ইনস্ট্রাকশনের প্রতিটি ধাপে এক বা একাধিক ক্লক পিরিয়ড লাগে। ৮০৮৬-এ মেমোরি থেকে একবার পড়তে চারটি ক্লক পিরিয়ড লাগে।',{mark:'read'}),
  st('Some instructions take far longer. A multiply can take seventy or more clock periods.',
     'কিছু ইনস্ট্রাকশনে অনেক বেশি সময় লাগে। একটি গুণ করতে সত্তর বা তারও বেশি ক্লক পিরিয়ড লাগতে পারে।',{mark:'mul'}),
  st('A faster clock speeds up the processor, up to its rated maximum. The later PS/2 model ran at 33 megahertz, roughly seven times faster.',
     'ক্লক দ্রুত হলে প্রসেসরও দ্রুত হয়, তবে তার নির্ধারিত সর্বোচ্চ সীমা পর্যন্ত। পরের PS/2 মডেল চলত ৩৩ মেগাহার্টজে, প্রায় সাত গুণ দ্রুত।',{mark:'fast'})]),

T('Three levels of programming language','প্রোগ্রামিং ভাষার তিনটি স্তর',
 {type:'cards',min:240,items:[
  {tag:'MACHINE LANGUAGE',h:{en:'Raw bit strings',bn:'শুধু বিটের সারি'},c:'10100001 00000000 00000000',b:{en:'Executed directly by the CPU. Each CPU has its own instruction set. Tedious and error-prone to write.',bn:'সিপিইউ সরাসরি এক্সিকিউট করে। প্রতিটি সিপিইউর নিজস্ব ইনস্ট্রাকশন সেট। লেখা কষ্টকর ও ভুলপ্রবণ।'}},
  {tag:'ASSEMBLY LANGUAGE',h:{en:'Symbolic names',bn:'প্রতীকী নাম'},c:'MOV AX, A',b:{en:'Names for operations, registers and memory. The assembler turns each line into one machine instruction. Still machine-specific.',bn:'অপারেশন, রেজিস্টার আর মেমোরির জন্য নাম। অ্যাসেম্বলার প্রতিটি লাইনকে একটি মেশিন ইনস্ট্রাকশনে রূপান্তর করে। তবুও মেশিন-নির্ভর।'}},
  {tag:'HIGH-LEVEL LANGUAGE',h:{en:'Reads like natural language',bn:'স্বাভাবিক ভাষার মতো'},c:'SUM := A + B;',b:{en:'A compiler turns one statement into many machine instructions. Portable across machines.',bn:'কম্পাইলার একটি স্টেটমেন্টকে অনেকগুলো মেশিন ইনস্ট্রাকশনে রূপান্তর করে। বিভিন্ন মেশিনে চালানো যায়।'}},
  {tag:'TRADE-OFFS',h:{en:'Assembly vs. high-level',bn:'অ্যাসেম্বলি বনাম হাই-লেভেল'},b:{en:['Speed and efficiency: assembly wins','Portability: high-level wins','Ease of reading and writing: high-level wins','Program length: high-level is shorter'],bn:['গতি ও দক্ষতা: অ্যাসেম্বলি এগিয়ে','পোর্টেবিলিটি: হাই-লেভেল এগিয়ে','পড়া ও লেখার সহজতা: হাই-লেভেল এগিয়ে','প্রোগ্রামের দৈর্ঘ্য: হাই-লেভেল ছোট']}}]},
 [st('Machine language is the raw bit strings the CPU executes directly. Every CPU has its own instruction set, and writing in bits is slow and error-prone.',
