  if(o.scroll!==false&&window.innerWidth<980){try{$('player').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});}catch(e){}}
  if(o.autoplay)setTimeout(play,350);}
const ICO_VON='<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/>',ICO_VOFF='<path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/>';
function updVoice(){const b=$('bVoice');b.setAttribute('aria-pressed',String(APP.voice));b.setAttribute('aria-label',U(APP.voice?'vOn':'vOff'));b.title=U(APP.voice?'vOn':'vOff');$('voiceIco').innerHTML=APP.voice?ICO_VON:ICO_VOFF;}
function toggleVoice(){APP.voice=!APP.voice;store.set('voice',APP.voice);updVoice();stopSpeech();if(APP.playing)speakStep();}
function updPlay(){$('playIco').innerHTML=APP.playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';$('bPlay').setAttribute('aria-label',APP.playing?U('pause'):U('play'));$('player').classList.toggle('playing',APP.playing);}
function play(){if(APP.playing)return;APP.playing=true;updPlay();if(APP.i===TOPIC.steps.length-1&&APP.ended){APP.ended=false;goStep(0,0);}speakStep();}
function stop(){APP.playing=false;stopSpeech();updPlay();}
function speakStep(){const my=SPK;speak(TOPIC.steps[APP.i][LANG],()=>{if(my!==SPK||!APP.playing)return;
  if(APP.i<TOPIC.steps.length-1){goStep(APP.i+1,1);setTimeout(()=>{if(my===SPK&&APP.playing)speakStep();},450);}
  else{APP.playing=false;APP.ended=true;updPlay();markDone();if(APP.auto){const ch=CH[APP.c];if(APP.t<ch.topics.length-1)loadTopic(APP.c,APP.t+1,{autoplay:true,scroll:false});else if(APP.c<CH.length-1)loadTopic(APP.c+1,0,{autoplay:true,scroll:false});}
    else{$('nextT').classList.add('glow');if(QZ[tid(APP.c,APP.t)])$('quiz').classList.add('glow');}}});}
function step(d){const j=APP.i+d;if(j<0||j>=TOPIC.steps.length)return;const was=APP.playing;stop();goStep(j,d===1?1:0);if(was)play();}
function setLang(l){if(l===LANG)return;const was=APP.playing;stop();LANG=l;store.set('lang',l);renderStatic();fillVoices();renderRail();renderHead();
  $('stLabel').textContent=`${CH[APP.c].n}.${APP.t+1} · ${L(TOPIC.t)}`;buildScene();renderTranscript();renderTool();renderQuiz(false);renderNav();goStep(APP.i,0);if(was)play();}

/* ---------- boot ---------- */
function boot(){STAGE=$('stage');LANG=store.get('lang','en')==='bn'?'bn':'en';APP.rate=+store.get('rate',1)||1;APP.auto=!!store.get('auto',false);APP.voice=store.get('voice',true)!==false;const tn=store.get('tone',null);if(tn&&typeof tn==='object')APP.tone=Object.assign({en:'n',bn:'n'},tn);
  $('selRate').value=String(APP.rate);$('chkAuto').checked=APP.auto;
  $('lgEn').onclick=()=>setLang('en');$('lgBn').onclick=()=>setLang('bn');
  $('bPlay').onclick=()=>APP.playing?stop():play();$('bVoice').onclick=toggleVoice;$('bPrev').onclick=()=>step(-1);$('bNext').onclick=()=>step(1);$('bRestart').onclick=()=>{const was=APP.playing;stop();goStep(0,0);if(was)play();};
  $('selRate').onchange=e=>{APP.rate=+e.target.value;store.set('rate',APP.rate);if(APP.playing){stop();play();}};
  $('chkAuto').onchange=e=>{APP.auto=e.target.checked;store.set('auto',APP.auto);};
  const onVoice=lang=>e=>{SP.pick[lang]=e.target.value;store.set('voice',SP.pick);if(APP.playing&&lang===LANG){stop();play();}};
  $('selVoiceEn').onchange=onVoice('en');$('selVoiceBn').onchange=onVoice('bn');
  $('tEn').onclick=()=>testVoice('en');$('tBn').onclick=()=>testVoice('bn');
  const onTone=lang=>e=>{APP.tone[lang]=e.target.value;store.set('tone',APP.tone);if(APP.playing&&lang===LANG){stop();play();}};
  $('toneEn').onchange=onTone('en');$('toneBn').onchange=onTone('bn');
  $('bOpts').onclick=()=>{const o=$('player').classList.toggle('opts-open');$('bOpts').setAttribute('aria-expanded',String(o));};
  $('railTog').onclick=()=>{const o=$('railNav').classList.toggle('open');$('railTog').setAttribute('aria-expanded',String(o));};
  document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||'')))return;if(e.key===' '){e.preventDefault();APP.playing?stop():play();}else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);});
  let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(SCENE&&TOPIC&&!APP.animating)try{SCENE.go(APP.i,TOPIC.steps,0);}catch(e){}},250);});
  if(SP.ok){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}setTimeout(loadVoices,700);}
  renderStatic();fillVoices();
  let c=0,t=0;const m=(location.hash||'').match(/^#c(\d+)(?:t(\d+))?$/);
  if(m){const ci=CH.findIndex(x=>x.n===+m[1]);if(ci>=0){c=ci;t=m[2]?Math.min(+m[2]-1,CH[ci].topics.length-1):0;}}
  else{const p=store.get('pos',null);if(p&&CH[p[0]]&&CH[p[0]].topics[p[1]]){c=p[0];t=p[1];}}
  loadTopic(c,t,{scroll:false});}
boot();
