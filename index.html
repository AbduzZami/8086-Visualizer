     'প্রতিটি বিট উল্টে দিই। একে বলে ওয়ান’স কমপ্লিমেন্ট।',{rows:{w:'1111111111111010'},hl:{w:'all'},note:"one's complement"}),
  st('Add 1. The result, FFFB hex, is minus 5 in two\'s complement.',
     '১ যোগ করি। ফলাফল FFFB হেক্স, যা টু’স কমপ্লিমেন্টে −৫।',{rows:{w:'1111111111111011'},hl:{w:[0]},note:"two's complement: 5 → FFFBh = −5"}),
  st('Example 2.9: represent minus 97 in a byte. 97 is 61 hex, which is 0110 0001.',
     'উদাহরণ ২.৯: −৯৭ কে একটি বাইটে প্রকাশ করা। ৯৭ = 61h = 0110 0001।',{rows:{b:'01100001'}}),
  st('Flip the bits to get 1001 1110, then add 1 to get 1001 1111. That is 9F hex, which is minus 97.',
     'বিট উল্টে পাই 1001 1110, তারপর ১ যোগ করে পাই 1001 1111। এটি 9F হেক্স, অর্থাৎ −৯৭।',{rows:{b:'10011111'},hl:{b:'all'},note:'97 = 61h → 9Eh → 9Fh = −97'})],'conv'),

T('ASCII: characters as codes','ASCII: অক্ষরের কোড',
 {type:'mem',cols:[{id:'s',title:'string "RG 2z" · hex · dec',rows:[
   {sym:"'R'",a:'0200h',v:'52h · 82'},{sym:"'G'",a:'0201h',v:'47h · 71'},{sym:'space',a:'0202h',v:'20h · 32'},{sym:"'2'",a:'0203h',v:'32h · 50'},{sym:"'z'",a:'0204h',v:'7Ah · 122'}]},
  {id:'t',title:'selected ASCII codes · hex · dec',rows:[{sym:"'A'",v:'41h · 65'},{sym:"'Z'",v:'5Ah · 90'},{sym:"'a'",v:'61h · 97'},{sym:"'z'",v:'7Ah · 122'},{sym:"'0'",v:'30h · 48'},{sym:"'9'",v:'39h · 57'},{sym:'CR',v:'0Dh · 13'}]}]},
 [st('Text is stored as numbers too. ASCII uses 7 bits per character, giving 128 codes. Each code fits in a byte with the top bit set to 0.',
     'লেখাও সংখ্যা হিসেবে জমা থাকে। ASCII প্রতিটি অক্ষরের জন্য ৭ বিট ব্যবহার করে, ফলে মোট ১২৮টি কোড। প্রতিটি কোড একটি বাইটে এঁটে যায়, যার সবচেয়ে উপরের বিট ০।',{note:'7 bits → 2⁷ = 128 codes'}),
  st('Codes 32 to 126 are printable characters. Codes 0 to 31 and 127 are control characters, such as carriage return, line feed, backspace and bell.',
     '৩২ থেকে ১২৬ পর্যন্ত কোডগুলো প্রিন্ট করা যায় এমন অক্ষর। ০ থেকে ৩১ আর ১২৭ হলো কন্ট্রোল ক্যারেক্টার, যেমন ক্যারেজ রিটার্ন, লাইন ফিড, ব্যাকস্পেস আর বেল।',{hl:['t:6'],note:'printable: 32–126 · control: 0–31, 127'}),
  st('A string is stored as consecutive bytes. "RG 2z" becomes 52, 47, 20, 32 and 7A hex, which are 82, 71, 32, 50 and 122 in decimal. Even the space and the digit 2 have their own codes.',
     'একটি স্ট্রিং পরপর বাইটে জমা থাকে। "RG 2z" হয় 52, 47, 20, 32 আর 7A হেক্স, দশমিকে যা ৮২, ৭১, ৩২, ৫০ আর ১২২। এমনকি স্পেস আর অঙ্ক ২ এরও নিজস্ব কোড আছে।',{hl:['s:0','s:1','s:2','s:3','s:4']}),
  st('Two patterns are worth remembering. Lowercase letters are exactly 20 hex above uppercase, and the digits 0 to 9 are 30 to 39 hex. You do not need to memorize the rest; EMU8086 lists them all.',
     'দুটি নিয়ম মনে রাখা দরকার। ছোট হাতের অক্ষর বড় হাতের অক্ষরের চেয়ে ঠিক 20h বেশি, আর ০ থেকে ৯ অঙ্কের কোড 30h থেকে 39h। বাকিগুলো মুখস্থ করার দরকার নেই, EMU8086 এ সব দেখা যায়।',{hl:['t:0','t:2','t:4','t:5'],note:"'a' − 'A' = 20h   ·   '0' = 30h"})],'conv')
]});
</script>
<script>
"use strict";
const FLAGNAMES=['','','','','OF','DF','IF','TF','SF','ZF','','AF','','PF','','CF'];
/* ===================== CHAPTER 3 ===================== */
CH.push({n:3,t:{en:'Organization of the IBM PC',bn:'আইবিএম পিসির সংগঠন'},topics:[

T('Registers: three kinds','রেজিস্টার: তিন প্রকার',
 {type:'regs',dimGroups:true,groups:[{id:'data',t:'Data registers',r:['AX','BX','CX','DX']},{id:'seg',t:'Address · segment',r:['CS','DS','SS','ES']},{id:'ptr',t:'Address · pointer & index',r:['SP','BP','SI','DI','IP']},{id:'st',t:'Status',r:['FLAGS']}],
  init:{SP:'0100',CS:'0B3C',DS:'0B4C',SS:'0B4E',ES:'0B2C',FLAGS:'0202'}},
 [st('Information inside the 8086 is stored in registers, and registers are classified by the job they do. Data registers hold data for an operation: AX, BX, CX and DX.',
     '৮০৮৬-এর ভেতরে তথ্য রাখা হয় রেজিস্টারে, আর রেজিস্টারগুলোকে তাদের কাজ অনুযায়ী ভাগ করা হয়। ডেটা রেজিস্টার কোনো অপারেশনের ডেটা ধরে রাখে: AX, BX, CX আর DX।',{grp:'data'}),
  st('Address registers hold the address of an instruction or of data. They are the segment registers CS, DS, SS and ES, and the pointer and index registers SP, BP, SI, DI and IP.',
     'অ্যাড্রেস রেজিস্টার কোনো ইনস্ট্রাকশন বা ডেটার অ্যাড্রেস ধরে রাখে। এগুলো হলো সেগমেন্ট রেজিস্টার CS, DS, SS, ES এবং পয়েন্টার ও ইনডেক্স রেজিস্টার SP, BP, SI, DI আর IP।',{grp:['seg','ptr']}),
  st('The status register keeps the current status of the processor. It is called the FLAGS register.',
     'স্ট্যাটাস রেজিস্টার প্রসেসরের বর্তমান অবস্থা ধরে রাখে। একে বলা হয় ফ্ল্যাগ রেজিস্টার।',{grp:'st'}),
  st('That makes fourteen 16-bit registers in total. Several of them work in pairs: CS with IP for instructions, DS with SI for data, and SS with SP for the stack.',
     'সব মিলিয়ে চৌদ্দটি ১৬ বিটের রেজিস্টার। এদের কয়েকটি জোড়ায় কাজ করে: ইনস্ট্রাকশনের জন্য CS আর IP, ডেটার জন্য DS আর SI, এবং স্ট্যাকের জন্য SS আর SP।',{hl:['CS','IP','DS','SI','SS','SP'],note:'CS:IP   DS:SI   SS:SP'})]),

T('Data registers: AX = AH : AL','ডেটা রেজিস্টার: AX = AH : AL',
 {type:'regs',groups:[{id:'d',t:'Data registers — 16-bit, or two 8-bit halves',r:['AX','BX','CX','DX']}]},
 [st('AX, BX, CX and DX are free for the programmer to use. Here AX holds 1234 hex. AH is its upper 8 bits, 12, and AL is its lower 8 bits, 34.',
     'AX, BX, CX, DX প্রোগ্রামার নিজের প্রয়োজনে ব্যবহার করতে পারে। এখানে AX এ আছে 1234h। AH হলো এর উপরের ৮ বিট, 12, আর AL নিচের ৮ বিট, 34।',{ins:'MOV AX,1234h',set:{AX:'1234'},hl:['AH','AL']}),
  st('Writing to AL changes only the low byte. AH is not disturbed, so AX becomes 12FF.',
     'AL এ লিখলে শুধু লো বাইট বদলায়। AH অপরিবর্তিত থাকে, তাই AX হয়ে যায় 12FF।',{ins:'MOV AL,0FFh',set:{AL:'FF'},hl:['AL']}),
  st('Because each half has its own name, we get eight byte registers when working with byte-size data: AH, AL, BH, BL, CH, CL, DH and DL.',
     'প্রতিটি অর্ধেকের আলাদা নাম থাকায় বাইট আকারের ডেটার জন্য আটটি বাইট রেজিস্টার পাওয়া যায়: AH, AL, BH, BL, CH, CL, DH আর DL।',{ins:'MOV BH,AL',fly:{from:'AL',to:'BH',v:'FF'},set:{BH:'FF'},hl:['BH']}),
  st('The processor can work on data in memory, but the same instruction is faster with data in registers, because it needs fewer clock cycles.',
     'প্রসেসর মেমোরির ডেটা নিয়েও কাজ করতে পারে, কিন্তু ডেটা রেজিস্টারে থাকলে একই ইনস্ট্রাকশন দ্রুত হয়, কারণ তাতে কম ক্লক সাইকেল লাগে।',{ins:'',note:'register operands → fewer clock cycles'})]),

T('Special jobs of AX, BX, CX, DX','AX, BX, CX, DX এর বিশেষ কাজ',
 {type:'cards',min:220,items:[
  {tag:'AX · Accumulator',h:{en:'Arithmetic, logic, I/O',bn:'গণনা, লজিক, ইনপুট-আউটপুট'},b:{en:['Shortest machine code for arithmetic and data transfer','MUL and DIV need one operand in AX or AL','IN and OUT use AL or AX'],bn:['গণনা ও ডেটা আদান-প্রদানে সবচেয়ে ছোট মেশিন কোড','MUL ও DIV এ একটি সংখ্যা AX বা AL এ থাকতে হয়','IN ও OUT এ AL বা AX লাগে']}},
  {tag:'BX · Base',h:{en:'Also an address register',bn:'অ্যাড্রেস রেজিস্টার হিসেবেও'},b:{en:['Holds the address of a table','XLAT uses BX as the table address'],bn:['একটি টেবিলের অ্যাড্রেস ধরে রাখে','XLAT ইনস্ট্রাকশন BX কে টেবিলের অ্যাড্রেস হিসেবে নেয়']}},
  {tag:'CX · Count',h:{en:'Loop counter',bn:'লুপ কাউন্টার'},b:{en:['LOOP counts down in CX','REP repeats string operations CX times','CL holds the count for shifts and rotates'],bn:['LOOP ইনস্ট্রাকশন CX এ গণনা কমায়','REP স্ট্রিং অপারেশন CX বার চালায়','শিফট ও রোটেটের সংখ্যা CL এ থাকে']}},
  {tag:'DX · Data',h:{en:'Multiply, divide, I/O',bn:'গুণ, ভাগ, ইনপুট-আউটপুট'},b:{en:['Pairs with AX in MUL and DIV (DX:AX)','Holds the port address in I/O'],bn:['MUL ও DIV এ AX এর সাথে জোড়া বাঁধে (DX:AX)','আই/ও তে পোর্টের অ্যাড্রেস রাখে']}}]},
 [st('Besides being general purpose, each data register has special jobs. AX, the accumulator, is preferred for arithmetic because it gives the shortest machine code. Multiply, divide and I/O also need AL or AX.',
     'সাধারণ কাজের পাশাপাশি প্রতিটি ডেটা রেজিস্টারের কিছু বিশেষ কাজ আছে। AX বা অ্যাকুমুলেটর গণনায় বেশি ব্যবহার হয়, কারণ এতে সবচেয়ে ছোট মেশিন কোড তৈরি হয়। গুণ, ভাগ আর আই/ও তেও AL বা AX লাগে।',{hl:[0]}),
  st('BX, the base register, also works as an address register. For example, the table look-up instruction XLAT uses BX to hold the address of the table.',
     'BX বা বেস রেজিস্টার অ্যাড্রেস রেজিস্টার হিসেবেও কাজ করে। যেমন, টেবিল থেকে মান খোঁজার ইনস্ট্রাকশন XLAT টেবিলের অ্যাড্রেস BX এ রাখে।',{hl:[1]}),
  st('CX, the count register, is the loop counter. LOOP and REP count down in CX, and CL gives the count for shift and rotate instructions.',
     'CX বা কাউন্ট রেজিস্টার হলো লুপ কাউন্টার। LOOP আর REP ইনস্ট্রাকশন CX এ গণনা কমায়, আর শিফট ও রোটেট কতবার হবে তা CL এ থাকে।',{hl:[2]}),
  st('DX, the data register, pairs with AX in multiply and divide, and it holds the port address in I/O operations.',
     'DX বা ডেটা রেজিস্টার গুণ ও ভাগে AX এর সাথে জোড়া বাঁধে, আর আই/ও অপারেশনে পোর্টের অ্যাড্রেস রাখে।',{hl:[3]})]),

T('20-bit addresses and segments','২০ বিটের অ্যাড্রেস ও সেগমেন্ট',
 {type:'seg'},
 [st('Memory is a collection of bytes, each with an address starting from 0. The 8086 gives every location a 20-bit physical address, from 00000 to FFFFF hex. That is one megabyte.',
     'মেমোরি হলো বাইটের সমষ্টি, প্রতিটির অ্যাড্রেস ০ থেকে শুরু। ৮০৮৬ প্রতিটি লোকেশনকে ২০ বিটের ফিজিক্যাল অ্যাড্রেস দেয়, 00000h থেকে FFFFFh পর্যন্ত। অর্থাৎ এক মেগাবাইট।',{segs:[],calc:'none',note:'00000h … FFFFFh = 2²⁰ bytes = 1 MB'}),
  st('Here is the problem. A 20-bit address is too big for a 16-bit register. The 8086 solves this by dividing memory into segments.',
     'সমস্যা হলো, ২০ বিটের অ্যাড্রেস ১৬ বিটের রেজিস্টারে আঁটে না। ৮০৮৬ এর সমাধান করে মেমোরিকে সেগমেন্টে ভাগ করে।',{note:'20 bits do not fit in a 16-bit register'}),
  st('A segment is a block of 64 kilobytes of consecutive memory. Each segment is identified by a 16-bit segment number, from 0 up to FFFF.',
     'সেগমেন্ট হলো পরপর ৬৪ কিলোবাইট মেমোরির একটি ব্লক। প্রতিটি সেগমেন্টকে একটি ১৬ বিটের সেগমেন্ট নম্বর দিয়ে চেনা যায়, ০ থেকে FFFF পর্যন্ত।',{segs:[{s:'1000'}],calc:'list'}),
  st('Inside a segment, a location is given by its offset: the number of bytes from the start of the segment. Offsets run from 0 to FFFF, so they also fit in 16 bits.',
     'সেগমেন্টের ভেতরে একটি লোকেশন বোঝানো হয় অফসেট দিয়ে: সেগমেন্টের শুরু থেকে কত বাইট দূরে। অফসেট ০ থেকে FFFF পর্যন্ত, তাই এটিও ১৬ বিটে আঁটে।',{segs:[{s:'1000',o:'8000'}],calc:'fwd',ph:9,note:'segment 1000h, offset 8000h'})],'seg'),

T('segment:offset → physical address','সেগমেন্ট:অফসেট → ফিজিক্যাল অ্যাড্রেস',
 {type:'seg'},
 [st('A location can be written as segment colon offset. This is called a logical address. A4FB colon 4872 means offset 4872 inside segment A4FB.',
     'একটি লোকেশন সেগমেন্ট:অফসেট আকারে লেখা যায়। একে বলে লজিক্যাল অ্যাড্রেস। A4FB:4872 মানে সেগমেন্ট A4FB এর ভেতরে অফসেট 4872।',{segs:[{s:'A4FB',o:'4872'}],calc:'fwd',ph:1}),
  st('To form the physical address, first shift the segment number left by 4 bits. That is the same as multiplying by 10 hex, so A4FB becomes A4FB0.',
     'ফিজিক্যাল অ্যাড্রেস বানাতে প্রথমে সেগমেন্ট নম্বরকে ৪ বিট বামে সরাই। এটা 10h দিয়ে গুণ করার সমান, তাই A4FB হয়ে যায় A4FB0।',{ph:2}),
  st('Then add the offset, 4872.',
     'তারপর অফসেট 4872 যোগ করি।',{ph:3}),
  st('The result is the 20-bit physical address A9822. Physical address equals segment times 10 hex plus offset.',
     'ফলাফল ২০ বিটের ফিজিক্যাল অ্যাড্রেস A9822। ফিজিক্যাল অ্যাড্রেস = সেগমেন্ট × 10h + অফসেট।',{ph:4,note:'physical = segment × 10h + offset'}),
  st('One more: segment 1234 and offset 0002. Shift 1234 to 12340, add 2, and you get 12342.',
     'আরেকটি: সেগমেন্ট 1234 আর অফসেট 0002। 1234 কে সরিয়ে 12340, তার সাথে ২ যোগ করলে পাই 12342।',{segs:[{s:'1234',o:'0002'}],ph:4})],'seg'),

T('Overlapping segments and paragraphs','ওভারল্যাপিং সেগমেন্ট ও প্যারাগ্রাফ',
 {type:'seg'},
 [st('Segment 0 starts at address 0. Segment 1 starts at 10 hex, only 16 bytes later. Segment 2 starts at 20 hex. So segments overlap heavily.',
     'সেগমেন্ট ০ শুরু হয় অ্যাড্রেস ০ থেকে। সেগমেন্ট ১ শুরু হয় 10h থেকে, মাত্র ১৬ বাইট পরে। সেগমেন্ট ২ শুরু 20h থেকে। তাই সেগমেন্টগুলো অনেকখানি একটির উপর আরেকটি পড়ে।',{segs:[{s:'0000'},{s:'0001'},{s:'0002'}],calc:'list',zoom:['00000','00040']}),
  st('Sixteen bytes is called a paragraph. A segment always starts on a paragraph boundary: an address that ends in the hex digit 0.',

  st('Example 3.1: physical address 1256A, in segments 1256 and 1240. In segment 1256, the offset is 1256A minus 12560, which is A. In segment 1240, it is 1256A minus 12400, which is 16A.',

 [st('A machine-language program has instructions, which are the code, and data. It also uses a structure called the stack to implement procedure calls.',

  st('A program segment need not fill all 64 kilobytes, and because segments overlap, small segments can sit close together. At any moment only the four segments named in the registers are reachable, but a program can change a register to reach a different segment.',

 [st('SP, BP, SI and DI normally hold offset addresses of memory locations. Unlike segment registers, they can also be used in arithmetic. SP, the stack pointer, works with SS and always points to the top of the stack.',
     'SP, BP, SI, DI সাধারণত মেমোরি লোকেশনের অফসেট অ্যাড্রেস ধরে রাখে। সেগমেন্ট রেজিস্টারের মতো নয়, এগুলো দিয়ে গণনাও করা যায়। SP বা স্ট্যাক পয়েন্টার SS এর সাথে কাজ করে এবং সবসময় স্ট্যাকের চূড়ার দিকে নির্দেশ করে।',{hl:[0]}),
  st('BP, the base pointer, is mainly used to reach data on the stack. Unlike SP, it can also reach data in other segments.',
     'BP বা বেস পয়েন্টার মূলত স্ট্যাকের ডেটা অ্যাক্সেস করতে ব্যবহার হয়। SP এর মতো নয়, এটি অন্য সেগমেন্টের ডেটাও অ্যাক্সেস করতে পারে।',{hl:[1]}),
  st('SI, the source index, points into the data segment. Adding one to SI steps through consecutive memory locations, which is perfect for arrays and strings.',

  st('DI, the destination index, does the same jobs as SI. String operations use DI to reach locations in the extra segment, addressed by ES.',

T('The instruction pointer: CS:IP','ইনস্ট্রাকশন পয়েন্টার: CS:IP',
 {type:'code',lines:['0000  MOV AX,@DATA','0003  MOV DS,AX','0005  MOV AH,9','0007  LEA DX,MSG','000B  INT 21H','000D  MOV AH,4CH','000F  INT 21H'],regs:['CS','IP'],init:{CS:'0B3C'}},
 [st('To fetch instructions, the 8086 uses the pair CS and IP. CS holds the segment number of the code, and IP holds the offset of the next instruction.',
     'ইনস্ট্রাকশন আনতে ৮০৮৬ CS আর IP জোড়া ব্যবহার করে। CS এ থাকে কোডের সেগমেন্ট নম্বর, আর IP তে থাকে পরবর্তী ইনস্ট্রাকশনের অফসেট।',{ln:1,regs:{IP:'0000'}}),
  st('Each time an instruction is executed, IP is updated so that it always points to the next one. This MOV is 3 bytes long, so IP moves from 0 to 3.',
     'প্রতিটি ইনস্ট্রাকশন এক্সিকিউট হওয়ার পর IP আপডেট হয়, যাতে এটি সবসময় পরেরটির দিকে নির্দেশ করে। এই MOV টি ৩ বাইট লম্বা, তাই IP ০ থেকে ৩ এ যায়।',{ln:2,regs:{IP:'0003'}}),
  st('The next instruction is 2 bytes, so IP becomes 5, then 7, and so on. IP grows by the length of each instruction.',
     'পরের ইনস্ট্রাকশনটি ২ বাইট, তাই IP হয় ৫, তারপর ৭, এভাবে চলতে থাকে। প্রতিটি ইনস্ট্রাকশনের দৈর্ঘ্য অনুযায়ী IP বাড়ে।',{ln:3,regs:{IP:'0005'}}),
  st('LEA is 4 bytes long, so after it IP jumps from 7 to B.',
     'LEA ৪ বাইট লম্বা, তাই এর পরে IP ৭ থেকে B তে যায়।',{ln:5,regs:{IP:'000B'}}),
  st('Unlike the other registers, IP cannot be an operand of an instruction. To go somewhere else, a program uses jump, call and return instructions, which update CS and IP for you.',
     'অন্য রেজিস্টারের মতো IP কোনো ইনস্ট্রাকশনের অপারেন্ড হতে পারে না। অন্য কোথাও যেতে হলে প্রোগ্রাম জাম্প, কল আর রিটার্ন ইনস্ট্রাকশন ব্যবহার করে, যেগুলো CS আর IP আপডেট করে দেয়।',{ln:5,rhl:['IP'],note:'MOV IP,AX ✗ — use JMP / CALL / RET'})]),

T('FLAGS: status and control','ফ্ল্যাগ: স্ট্যাটাস ও কন্ট্রোল',

 [st('The FLAGS register shows the status of the processor by setting individual bits, called flags. There are two kinds.',
     'ফ্ল্যাগ রেজিস্টার আলাদা আলাদা বিট সেট করে প্রসেসরের অবস্থা দেখায়, এই বিটগুলোকে বলে ফ্ল্যাগ। ফ্ল্যাগ দুই ধরনের।',{}),
  st('Status flags reflect the result of an instruction: carry, parity, auxiliary carry, zero, sign and overflow. The processor sets them for you to read.',
     'স্ট্যাটাস ফ্ল্যাগ একটি ইনস্ট্রাকশনের ফলাফল দেখায়: ক্যারি, প্যারিটি, অক্সিলিয়ারি ক্যারি, জিরো, সাইন আর ওভারফ্লো। প্রসেসর এগুলো সেট করে, আমরা পড়ি।',{hl:{f:[0,2,4,6,7,11]},note:'status: CF PF AF ZF SF OF'}),
  st('For example, when a subtraction gives zero, the zero flag ZF becomes 1. A following instruction can test ZF and jump to code that handles a zero result.',
     'যেমন, কোনো বিয়োগের ফল শূন্য হলে জিরো ফ্ল্যাগ ZF হয়ে যায় ১। পরের ইনস্ট্রাকশন ZF পরীক্ষা করে শূন্য ফলাফলের জন্য লেখা কোডে জাম্প করতে পারে।',{rows:{f:'0000000001000000'},hl:{f:[6]},note:'SUB AX,AX → result 0 → ZF = 1'}),
  st('Control flags enable or disable certain operations of the processor: trap, interrupt and direction. For example, if the interrupt flag is cleared, keyboard input is ignored.',
     'কন্ট্রোল ফ্ল্যাগ প্রসেসরের কিছু কাজ চালু বা বন্ধ করে: ট্র্যাপ, ইন্টারাপ্ট আর ডিরেকশন। যেমন, ইন্টারাপ্ট ফ্ল্যাগ ক্লিয়ার করলে কিবোর্ডের ইনপুট উপেক্ষা করা হয়।',{hl:{f:[8,9,10]},note:'control: TF IF DF'}),
  st('One sentence separates them. Status flags are set by the processor for you to read. Control flags are set by you to change how the processor behaves.',
     'এক বাক্যে পার্থক্য: স্ট্যাটাস ফ্ল্যাগ প্রসেসর সেট করে, আমরা পড়ি। কন্ট্রোল ফ্ল্যাগ আমরা সেট করি, যাতে প্রসেসরের আচরণ বদলায়।',{note:'status: CPU → you   ·   control: you → CPU'})])
]});

  {t:'Rules: one statement per line · fields in this order · separated by at least one blank or tab · MASM is not case sensitive',c:'p'}]},
 [st('An assembly program is a series of statements, one per line. Each statement is either an instruction, which becomes machine code, or an assembler directive, which tells the assembler to do something.',
     'অ্যাসেম্বলি প্রোগ্রাম হলো কতগুলো স্টেটমেন্ট, প্রতি লাইনে একটি। প্রতিটি স্টেটমেন্ট হয় একটি ইনস্ট্রাকশন, যা মেশিন কোডে পরিণত হয়, অথবা একটি অ্যাসেম্বলার ডিরেক্টিভ, যা অ্যাসেম্বলারকে কিছু করতে বলে।',{}),
  st('A statement can have up to four fields. The name field holds a label, a procedure name or a variable name. Here START is the label, and MAIN is the name of a procedure.',
     'একটি স্টেটমেন্টে সর্বোচ্চ চারটি ফিল্ড থাকতে পারে। নেম ফিল্ডে থাকে লেবেল, প্রোসিডিউরের নাম বা ভেরিয়েবলের নাম। এখানে START হলো লেবেল, আর MAIN একটি প্রোসিডিউরের নাম।',{f:1}),
  st('The operation field holds the opcode of an instruction, such as MOV, or a pseudo-op of a directive, such as PROC. Pseudo-ops are not translated into machine code.',
     'অপারেশন ফিল্ডে থাকে ইনস্ট্রাকশনের অপকোড, যেমন MOV, অথবা ডিরেক্টিভের সিউডো-অপ, যেমন PROC। সিউডো-অপ মেশিন কোডে অনুবাদ হয় না।',{f:2}),
  st('The operand field gives the data to act on. An instruction can have zero, one or two operands. With two, the first is the destination, where the result goes, and the second is the source.',
     'অপারেন্ড ফিল্ডে থাকে যে ডেটা নিয়ে কাজ হবে। একটি ইনস্ট্রাকশনে শূন্য, এক বা দুটি অপারেন্ড থাকতে পারে। দুটি হলে প্রথমটি ডেস্টিনেশন, যেখানে ফলাফল জমা হয়, আর দ্বিতীয়টি সোর্স।',{f:3,note:'MOV destination, source'}),
  st('A semicolon starts the comment field, and the assembler ignores everything after it. Good comments give context, like "CX counts terms", not the obvious "move 0 to CX".',
     'সেমিকোলন দিয়ে কমেন্ট ফিল্ড শুরু হয়, আর অ্যাসেম্বলার এর পরের সবকিছু উপেক্ষা করে। ভালো কমেন্ট প্রসঙ্গ বোঝায়, যেমন "CX টার্ম গুনছে", স্পষ্ট জিনিস নয়, যেমন "CX এ ০ রাখো"।',{f:4})]),

T('Rules for names','নামের নিয়ম',
 {type:'cards',min:220,items:[
  {tag:'RULES',h:{en:'A legal name',bn:'বৈধ নাম'},b:{en:['1 to 31 characters','Letters, digits and ? . @ _ $ %','No blanks inside','A period may only be the first character','Cannot begin with a digit','Upper and lower case are the same'],bn:['১ থেকে ৩১ অক্ষর','অক্ষর, অঙ্ক এবং ? . @ _ $ %','মাঝে স্পেস চলবে না','পিরিয়ড শুধু প্রথম অক্ষর হতে পারে','অঙ্ক দিয়ে শুরু করা যাবে না','বড় ও ছোট হাতের অক্ষর একই']}},
  {tag:'LEGAL',good:true,h:{en:'These work',bn:'এগুলো বৈধ'},c:'COUNTER1\n@character\nSUM_OF_DIGITS\n$1000\nDONE?\n.TEST'},
  {tag:'ILLEGAL',bad:true,h:{en:'These fail',bn:'এগুলো অবৈধ'},b:{en:['TWO WORDS — contains a blank','2abc — begins with a digit','A45.28 — period not first','YOU&ME — illegal character &'],bn:['TWO WORDS — মাঝে স্পেস','2abc — অঙ্ক দিয়ে শুরু','A45.28 — পিরিয়ড প্রথমে নয়','YOU&ME — & চিহ্ন অবৈধ']}}]},
 [st('Names are used for labels, procedures and variables, and the assembler turns them into memory addresses. A name has 1 to 31 characters: letters, digits, and a few special characters.',
     'নাম ব্যবহার হয় লেবেল, প্রোসিডিউর আর ভেরিয়েবলের জন্য, আর অ্যাসেম্বলার এগুলোকে মেমোরি অ্যাড্রেসে রূপান্তর করে। নাম ১ থেকে ৩১ অক্ষরের হয়: অক্ষর, অঙ্ক আর কয়েকটি বিশেষ চিহ্ন।',{hl:[0]}),
  st('These names are all legal. Notice that a period is allowed only as the first character, as in dot TEST.',
     'এই নামগুলো সব বৈধ। লক্ষ করো, পিরিয়ড শুধু প্রথম অক্ষর হিসেবে চলে, যেমন .TEST।',{hl:[1]}),
  st('These fail. TWO WORDS has a blank. 2abc begins with a digit. A45.28 has a period that is not first. YOU and ME uses an illegal character.',
     'এগুলো অবৈধ। TWO WORDS এ স্পেস আছে। 2abc অঙ্ক দিয়ে শুরু। A45.28 এ পিরিয়ড প্রথমে নয়। YOU&ME এ অবৈধ চিহ্ন আছে।',{hl:[2]})]),

T('Program data and named constants','প্রোগ্রাম ডেটা ও নামযুক্ত ধ্রুবক',
 {type:'lines',lines:[
  {t:'numbers',c:'h'},
  '1010B        binary  — bit string ending in B',
  '64223        decimal — optional D:  -21843D',
  '0ABCH        hex     — must START with a digit and END with H',
  {t:'1,234 ✗ non-digit    1B4D ✗ no H    FFFFH ✗ starts with a letter → write 0FFFFH',c:'bad'},
  {t:'characters',c:'h'},
  "MOV AH,'A'   is identical to   MOV AH,41H",
  "'abc' → 61h 62h 63h    'ABC' → 41h 42h 43h",
  {t:'EQU: a name for a constant (no memory used)',c:'h'},
  'LF  EQU 0AH',
  'MOV DL,LF    assembles exactly like   MOV DL,0AH']},
 [st('The processor works only on binary, but in a program we can write numbers in binary, decimal or hex. A binary number ends with the letter B. A decimal number may end with D.',
     'প্রসেসর শুধু বাইনারি নিয়ে কাজ করে, কিন্তু প্রোগ্রামে আমরা সংখ্যা বাইনারি, দশমিক বা হেক্সে লিখতে পারি। বাইনারি সংখ্যার শেষে B থাকে। দশমিক সংখ্যার শেষে D থাকতে পারে।',{show:3,hl:[1,2]}),
  st('A hex number must begin with a decimal digit and end with H. Otherwise the assembler could not tell the hex number ABC from a variable named ABCH. So FFFF hex is written 0FFFFH.',
     'হেক্স সংখ্যা অবশ্যই একটি দশমিক অঙ্ক দিয়ে শুরু আর H দিয়ে শেষ হতে হবে। নাহলে অ্যাসেম্বলার হেক্স সংখ্যা ABC আর ABCH নামের ভেরিয়েবলের পার্থক্য করতে পারত না। তাই FFFF হেক্স লেখা হয় 0FFFFH।',{show:5,hl:[3,4]}),
  st('Characters go inside single or double quotes, and the assembler turns them into ASCII codes. So writing the letter A in quotes is exactly the same as writing 41 hex.',
     'অক্ষর সিঙ্গেল বা ডাবল কোটের ভেতরে লিখতে হয়, আর অ্যাসেম্বলার এগুলোকে ASCII কোডে রূপান্তর করে। তাই কোটের ভেতরে A লেখা আর 41h লেখা একই কথা।',{show:8,hl:[6,7]}),
  st('EQU gives a name to a constant, which makes code easier to read. No memory is allocated: the assembler simply substitutes the value wherever the name appears.',
     'EQU একটি ধ্রুবকের নাম দেয়, ফলে কোড পড়া সহজ হয়। এর জন্য কোনো মেমোরি বরাদ্দ হয় না: নামটি যেখানে আছে, অ্যাসেম্বলার সেখানে শুধু মানটি বসিয়ে দেয়।',{show:11,hl:[9,10]})],'conv'),

 {type:'mem',cols:[
  {id:'tbl',title:'Table 4.1 · data-defining pseudo-ops',rows:[{sym:'DB',a:'1 byte',v:'byte'},{sym:'DW',a:'2 bytes',v:'word'},{sym:'DD',a:'4 bytes',v:'doubleword'},{sym:'DQ',a:'8 bytes',v:'quadword'},{sym:'DT',a:'10 bytes',v:'tenbytes'}]},
  {id:'v',title:'variables in memory (bytes)',rows:[{sym:'ALPHA',a:'0200h',v:'04h'},{sym:'BYT',a:'0201h',v:'??'},{sym:'WRD',a:'0202h',v:'FEh'},{sym:'WRD+1',a:'0203h',v:'FFh'},{sym:'WORD1',a:'0204h',v:'??'},{sym:'WORD1+1',a:'0205h',v:'??'}]},
  {id:'b',title:'B_ARRAY DB 10H,20H,30H',rows:[{sym:'B_ARRAY',a:'0200h',v:'10h'},{sym:'B_ARRAY+1',a:'0201h',v:'20h'},{sym:'B_ARRAY+2',a:'0202h',v:'30h'}]},
  {id:'w',title:'W_ARRAY DW 1000,40,29887,329',rows:[{sym:'W_ARRAY',a:'0300h',v:'03E8h · 1000'},{sym:'W_ARRAY+2',a:'0302h',v:'0028h · 40'},{sym:'W_ARRAY+4',a:'0304h',v:'74BFh · 29887'},{sym:'W_ARRAY+6',a:'0306h',v:'0149h · 329'}]},

  {id:'x',title:'WORD1 DW 1234H',rows:[{sym:'WORD1',a:'0400h',v:'34h'},{sym:'WORD1+1',a:'0401h',v:'12h'}]},
  {id:'s',title:"LETTERS DB 'ABC' · MSG DB 'HELLO',0AH,0DH,'$'",rows:[{sym:"LETTERS 'A'",a:'0500h',v:'41h'},{sym:"'B'",a:'0501h',v:'42h'},{sym:"'C'",a:'0502h',v:'43h'},
    {sym:"MSG 'H'",a:'0503h',v:'48h'},{sym:"'E'",a:'0504h',v:'45h'},{sym:"'L'",a:'0505h',v:'4Ch'},{sym:"'L'",a:'0506h',v:'4Ch'},{sym:"'O'",a:'0507h',v:'4Fh'},{sym:'LF',a:'0508h',v:'0Ah'},{sym:'CR',a:'0509h',v:'0Dh'},{sym:"'$'",a:'050Ah',v:'24h'}]}]},
 [st('Variables play the same role as in high-level languages. Each variable has a data type and is given a memory address. Table 4.1 lists the five data-defining pseudo-ops. This chapter uses only DB, define byte, and DW, define word.',
     'হাই-লেভেল ল্যাঙ্গুয়েজের মতো অ্যাসেম্বলিতেও ভেরিয়েবলের একই ভূমিকা। প্রতিটি ভেরিয়েবলের একটি ডেটা টাইপ থাকে, আর একটি মেমোরি অ্যাড্রেস দেওয়া হয়। টেবিল ৪.১ এ পাঁচটি ডেটা ডিফাইনিং সিউডো-অপ আছে। এই অধ্যায়ে শুধু DB, অর্থাৎ ডিফাইন বাইট, আর DW, অর্থাৎ ডিফাইন ওয়ার্ড, ব্যবহার হবে।',{vis:['tbl'],hl:['tbl:0','tbl:1'],note:'name DB initial_value   ·   name DW initial_value'}),
  st('DD, DQ and DT define 4, 8 and 10 bytes. They are used later, in chapter 18, for multiple-precision and non-integer numbers.',
     'DD, DQ আর DT যথাক্রমে ৪, ৮ আর ১০ বাইট ডিফাইন করে। এগুলো পরে, অধ্যায় ১৮ তে, বড় সংখ্যা আর ভগ্নাংশের হিসাবে ব্যবহার হবে।',{vis:['tbl'],hl:['tbl:2','tbl:3','tbl:4']}),
  st('ALPHA DB 4 sets aside one byte holding 4. The name ALPHA becomes a symbolic address: the assembler replaces it with the offset 0200 hex.',
     'ALPHA DB 4 একটি বাইট আলাদা রাখে, যার মান ৪। ALPHA নামটি একটি প্রতীকী অ্যাড্রেস হয়ে যায়: অ্যাসেম্বলার এর জায়গায় অফসেট 0200h বসিয়ে দেয়।',{vis:['tbl','v'],hl:['tbl:0','v:0'],note:'ALPHA DB 4'}),
  st('A question mark instead of a value sets aside an uninitialized location. BYT DB question mark reserves one byte without giving it a value. A byte variable can start with minus 128 to 127 signed, or 0 to 255 unsigned.',
     'মানের বদলে প্রশ্নবোধক চিহ্ন দিলে লোকেশনটি অনির্ধারিত থাকে। BYT DB ? একটি বাইট রাখে, কিন্তু কোনো মান দেয় না। বাইট ভেরিয়েবলের শুরুর মান সাইনড হলে −১২৮ থেকে ১২৭, আনসাইনড হলে ০ থেকে ২৫৫।',{vis:['tbl','v'],hl:['v:1'],note:'BYT DB ?   ·   byte: −128…127 or 0…255'}),
  st('WRD DW minus 2 sets aside a word, two bytes. Minus 2 is FFFE hex, and it is stored low byte first: FE at WRD, FF at WRD plus 1. A word can hold minus 32,768 to 32,767, or 0 to 65,535.',
     'WRD DW -2 একটি ওয়ার্ড, অর্থাৎ দুই বাইট, আলাদা রাখে। −২ হলো FFFEh, আর এটি লো বাইট আগে রেখে জমা হয়: WRD এ FE, WRD+1 এ FF। ওয়ার্ডে রাখা যায় −৩২,৭৬৮ থেকে ৩২,৭৬৭, বা ০ থেকে ৬৫,৫৩৫।',{vis:['tbl','v'],hl:['tbl:1','v:2','v:3'],note:'WRD DW -2 → FFFEh   ·   word: −32768…32767 or 0…65535'}),
  st('WORD1 DW question mark reserves two bytes with no value. These ranges are exactly what fits in one byte and in one word; a value outside the range cannot be stored in that variable.',
     'WORD1 DW ? মান ছাড়াই দুই বাইট রাখে। এই পরিসরগুলো ঠিক ততটাই, যতটা এক বাইটে আর এক ওয়ার্ডে আঁটে; পরিসরের বাইরের মান সেই ভেরিয়েবলে রাখা যায় না।',{vis:['tbl','v'],hl:['v:4','v:5'],note:'WORD1 DW ?'}),
  st('An array is just a sequence of memory bytes or words. B_ARRAY DB 10 hex, 20 hex, 30 hex sets aside three bytes. Suppose the assembler gives B_ARRAY the offset 0200 hex.',
     'অ্যারে হলো পরপর কিছু মেমোরি বাইট বা ওয়ার্ড। B_ARRAY DB 10H,20H,30H তিনটি বাইট আলাদা রাখে। ধরি অ্যাসেম্বলার B_ARRAY কে অফসেট 0200h দিয়েছে।',{vis:['b'],hl:['b:0','b:1','b:2']}),
  st('B_ARRAY names only the first byte. The second byte is B_ARRAY plus 1, and the third is B_ARRAY plus 2. The array name is a symbolic address, and elements are reached by adding an offset to it.',
     'B_ARRAY শুধু প্রথম বাইটের নাম। দ্বিতীয় বাইট B_ARRAY+1, আর তৃতীয়টি B_ARRAY+2। অ্যারের নাম একটি প্রতীকী অ্যাড্রেস, আর এর সাথে অফসেট যোগ করে উপাদানগুলোতে পৌঁছানো যায়।',{vis:['b'],hl:['b:1'],ptr:{'B_ARRAY+1':'b:1'},note:'element = array name + offset'}),
  st('W_ARRAY DW 1000, 40, 29887, 329 sets aside four words. Consecutive words are two bytes apart, so the elements are W_ARRAY, W_ARRAY plus 2, plus 4 and plus 6.',
     'W_ARRAY DW 1000,40,29887,329 চারটি ওয়ার্ড আলাদা রাখে। পরপর দুটি ওয়ার্ড দুই বাইট দূরে থাকে, তাই উপাদানগুলো W_ARRAY, W_ARRAY+2, +4 আর +6।',{vis:['w','wb'],ptr:{'B_ARRAY+1':null},hl:['w:0','w:1','w:2','w:3'],note:'offsets go up by 2, not 1'}),
  st('Look at the bytes. 1000 is 03E8 hex. Its low byte, E8, is at 0300, and its high byte, 03, is at 0301. Every word is stored this way, low byte first.',
     'বাইটগুলো দেখি। ১০০০ = 03E8h। এর লো বাইট E8 থাকে 0300 এ, আর হাই বাইট 03 থাকে 0301 এ। প্রতিটি ওয়ার্ড এভাবেই জমা থাকে, লো বাইট আগে।',{vis:['w','wb'],hl:['w:0','wb:0','wb:1']}),
  st('29887 is 74BF hex: BF at 0304, then 74 at 0305.',
     '২৯৮৮৭ = 74BFh: 0304 এ BF, তারপর 0305 এ 74।',{vis:['w','wb'],hl:['w:2','wb:4','wb:5']}),
  st('So for WORD1 DW 1234 hex, the low byte 34 sits at WORD1 itself, and the high byte 12 sits at WORD1 plus 1. The low byte carries the symbolic address of the variable.',
     'তাই WORD1 DW 1234H হলে লো বাইট 34 থাকে WORD1 এই, আর হাই বাইট 12 থাকে WORD1+1 এ। লো বাইটই ভেরিয়েবলের প্রতীকী অ্যাড্রেস বহন করে।',{vis:['x','wb'],hl:['x:0','x:1'],note:'low byte at WORD1 · high byte at WORD1+1'}),
  st("An array of ASCII codes can be written as a string. LETTERS DB 'ABC' is exactly the same as LETTERS DB 41 hex, 42 hex, 43 hex. Inside a string, case matters: 'abc' would be 61, 62, 63.",
     "ASCII কোডের অ্যারে স্ট্রিং আকারে লেখা যায়। LETTERS DB 'ABC' আর LETTERS DB 41H,42H,43H হুবহু একই। স্ট্রিংয়ের ভেতরে বড়-ছোট হাতের পার্থক্য আছে: 'abc' হতো 61, 62, 63।",{vis:['s'],hl:['s:0','s:1','s:2'],note:"'ABC' = 41h 42h 43h · 'abc' = 61h 62h 63h"}),
  st("Characters and numbers can be mixed. MSG DB 'HELLO', 0A hex, 0D hex, dollar sign stores the five letters, then line feed and carriage return, then the dollar sign that will end the string for INT 21h function 9.",
     "অক্ষর আর সংখ্যা মেশানো যায়। MSG DB 'HELLO',0AH,0DH,'$' পাঁচটি অক্ষর রাখে, তারপর লাইন ফিড আর ক্যারেজ রিটার্ন, তারপর ডলার চিহ্ন, যা INT 21h ফাংশন ৯ এর জন্য স্ট্রিংয়ের শেষ নির্দেশ করবে।",{vis:['s'],hl:['s:3','s:4','s:5','s:6','s:7','s:8','s:9','s:10'],note:'MSG DB 48H,45H,4CH,4CH,4FH,0AH,0DH,24H'})]),

T('MOV and XCHG','MOV ও XCHG',
 {type:'regs',groups:[{id:'r',t:'Registers',r:['AX','BX']},{id:'m',t:'Memory variable',r:['WORD1']}],vars:['WORD1'],descs:{WORD1:'a word in memory'},init:{AX:'0006',BX:'0005',WORD1:'0008'}},
 [st('MOV destination, source copies data. It works between registers, between a register and memory, or moves a number into a register or memory. Here WORD1 holds 8.',
     'MOV ডেস্টিনেশন, সোর্স ডেটা কপি করে। এটি দুই রেজিস্টারের মধ্যে, রেজিস্টার আর মেমোরির মধ্যে কাজ করে, অথবা একটি সংখ্যা রেজিস্টার বা মেমোরিতে রাখে। এখানে WORD1 এ আছে ৮।',{ins:'MOV AX,WORD1',hl:['WORD1']}),
  st('MOV AX, WORD1 sends a copy of WORD1 into AX. AX is replaced by 8, and WORD1 keeps its value.',
     'MOV AX,WORD1 এর ফলে WORD1 এর একটি কপি AX এ যায়। AX এর মান হয় ৮, আর WORD1 এর মান অপরিবর্তিত থাকে।',{ins:'MOV AX,WORD1',fly:{from:'WORD1',to:'AX',v:'0008'},set:{AX:'0008'},hl:['AX']}),
  st('MOV AX, BX copies BX into AX. BX is unchanged.',
     'MOV AX,BX এর ফলে BX এর মান AX এ কপি হয়। BX অপরিবর্তিত থাকে।',{ins:'MOV AX,BX',fly:{from:'BX',to:'AX',v:'0005'},set:{AX:'0005'},hl:['AX']}),
  st("MOV AH, the letter A, moves 41 hex, the ASCII code of A, into AH. The old value of AH is overwritten.",
     "MOV AH,'A' এর ফলে A এর ASCII কোড 41h AH এ যায়। AH এর আগের মান মুছে যায়।",{ins:"MOV AH,'A'",set:{AH:'41'},hl:['AH']}),
  st('XCHG swaps two operands. Before: AH is 1A and BL is 05. After XCHG AH, BL, AH holds 05 and BL holds 1A. AL and BH are untouched.',
     'XCHG দুটি অপারেন্ডের মান অদলবদল করে। আগে: AH = 1A, BL = 05। XCHG AH,BL এর পরে AH = 05 আর BL = 1A। AL আর BH অপরিবর্তিত থাকে।',{ins:'XCHG AH,BL',pre:{AH:'1A',BL:'05'},fly:[{from:'AH',to:'BL',v:'1A'},{from:'BL',to:'AH',v:'05'}],set:{AH:'05',BL:'1A'},hl:['AH','BL']}),
  st('One important rule: MOV and XCHG cannot have both operands in memory. To copy WORD2 into WORD1, go through a register: MOV AX, WORD2, then MOV WORD1, AX.',
     'একটি গুরুত্বপূর্ণ নিয়ম: MOV আর XCHG এর দুটি অপারেন্ডই মেমোরিতে হতে পারে না। WORD2 কে WORD1 এ কপি করতে রেজিস্টারের মধ্য দিয়ে যেতে হয়: MOV AX,WORD2, তারপর MOV WORD1,AX।',{ins:'MOV WORD1,WORD2  ✗',note:'no memory-to-memory: MOV AX,WORD2 → MOV WORD1,AX'})]),

T('ADD, SUB, INC, DEC and NEG','ADD, SUB, INC, DEC ও NEG',
 {type:'regs',groups:[{id:'r',t:'Registers',r:['AX','BX','DX']},{id:'m',t:'Memory variables',r:['WORD1','BYTE1']}],vars:['WORD1','BYTE1'],descs:{WORD1:'word variable',BYTE1:'byte variable'},init:{AX:'01BC',BX:'0002',DX:'0001',WORD1:'0523',BYTE1:'FF'}},
 [st('ADD destination, source adds the source to the destination and stores the sum in the destination. ADD WORD1, AX adds AX to WORD1. AX is unchanged.',
     'ADD ডেস্টিনেশন, সোর্স সোর্সকে ডেস্টিনেশনের সাথে যোগ করে, আর যোগফল ডেস্টিনেশনে রাখে। ADD WORD1,AX এর ফলে AX যোগ হয় WORD1 এর সাথে। AX অপরিবর্তিত।',{ins:'ADD WORD1,AX',fly:{from:'AX',to:'WORD1',v:'+ 01BC'},set:{WORD1:'06DF'},hl:['WORD1']}),
  st('SUB AX, DX subtracts DX from AX and stores the difference in AX. With AX equal to 0 and DX equal to 1, AX becomes FFFF, which is minus 1.',
     'SUB AX,DX এর ফলে AX থেকে DX বিয়োগ হয়ে ফল AX এ থাকে। AX = ০ আর DX = ১ হলে AX হয় FFFF, অর্থাৎ −১।',{ins:'SUB AX,DX',pre:{AX:'0000'},fly:{from:'DX',to:'AX',v:'− 0001'},set:{AX:'FFFF'},hl:['AX']}),
  st('INC adds 1 to a register or memory location. INC WORD1 turns 2 into 3. INC and DEC are shorter and faster than adding or subtracting 1.',
     'INC কোনো রেজিস্টার বা মেমোরি লোকেশনে ১ যোগ করে। INC WORD1 এর ফলে ২ হয় ৩। ১ যোগ বা বিয়োগ করার চেয়ে INC আর DEC ছোট এবং দ্রুত।',{ins:'INC WORD1',pre:{WORD1:'0002'},fly:{from:'WORD1',to:'WORD1',v:'+1'},set:{WORD1:'0003'},hl:['WORD1']}),
  st('DEC subtracts 1. DEC BYTE1 turns FF into FE.',
     'DEC ১ বিয়োগ করে। DEC BYTE1 এর ফলে FF হয় FE।',{ins:'DEC BYTE1',fly:{from:'BYTE1',to:'BYTE1',v:'−1'},set:{BYTE1:'FE'},hl:['BYTE1']}),
  st("NEG replaces the destination with its two's complement, which negates it. NEG BX turns 2 into FFFE, which is minus 2.",
     'NEG ডেস্টিনেশনকে তার টু’স কমপ্লিমেন্ট দিয়ে প্রতিস্থাপন করে, অর্থাৎ চিহ্ন উল্টে দেয়। NEG BX এর ফলে ২ হয় FFFE, অর্থাৎ −২।',{ins:'NEG BX',fly:{from:'BX',to:'BX',v:'NEG'},set:{BX:'FFFE'},hl:['BX'],note:'FFFEh = 65534 unsigned = −2 signed'}),
  st('In every two-operand case, the result goes to the destination, the first operand, and the source keeps its value.',
     'দুই অপারেন্ডের প্রতিটি ক্ষেত্রে ফলাফল যায় ডেস্টিনেশনে, অর্থাৎ প্রথম অপারেন্ডে, আর সোর্সের মান অপরিবর্তিত থাকে।',{ins:'ADD BL,5',fly:{from:'BX',to:'BX',v:'+5'},set:{BL:'03'},hl:['BL'],note:'result → destination (first operand)'})]),

T('Program structure: the SMALL model','প্রোগ্রামের কাঠামো: SMALL মডেল',
 {type:'swap',first:'prog',views:{models:{type:'models'},prog:{type:'split',
  a:{type:'code',lines:['.MODEL SMALL','.STACK 100H','.DATA','WORD1  DW 2','WORD2  DW 5',"MSG    DB 'THIS IS A MESSAGE$'",'MASK   EQU 10010010B','.CODE','MAIN PROC','    MOV AX,@DATA    ;get data segment no.','    MOV DS,AX       ;initialize DS','    MOV AX,WORD1    ;AX = 2','    ADD AX,WORD2    ;AX = 7','    MOV AH,4CH','    INT 21H         ;return to DOS','MAIN ENDP',';other procedures go here','    END MAIN']},
  b:{type:'dg',w:600,h:520,nodes:[
   {id:'mem',x:220,y:8,w:370,h:504,shape:'frame',l:'Memory'},
   {id:'psp',x:250,y:50,w:310,h:70,l:'PSP',s:'256 bytes, built by DOS',fs:21},
   {id:'code',x:250,y:140,w:310,h:100,l:'Code segment',s:'.CODE → instructions',fs:21},
   {id:'data',x:250,y:260,w:310,h:90,l:'Data segment',s:'.DATA → variables',fs:21},
   {id:'stk',x:250,y:370,w:310,h:120,l:'Stack segment',s:'.STACK 100H → 256 bytes',fs:21},
   {id:'cs',x:15,y:160,w:130,h:60,l:'CS',mono:true},
   {id:'ds',x:15,y:275,w:130,h:60,l:'DS',mono:true},
   {id:'ss',x:15,y:400,w:130,h:60,l:'SS',mono:true}],
   edges:[{id:'ec',a:'cs:r',b:'code:l'},{id:'ed',a:'ds:r',b:'data:l'},{id:'es',a:'ss:r',b:'stk:l'},{id:'ep',a:'ds:t',b:'psp:l',dash:true,l:'at load',lx:120,ly:110}]}}}},
 [st('Like a machine-language program, an assembly program is made of code, data and a stack. The assembler translates each program segment into its own memory segment.',
     'মেশিন ল্যাঙ্গুয়েজ প্রোগ্রামের মতো অ্যাসেম্বলি প্রোগ্রামও কোড, ডেটা আর স্ট্যাক দিয়ে তৈরি। অ্যাসেম্বলার প্রতিটি প্রোগ্রাম সেগমেন্টকে আলাদা একটি মেমোরি সেগমেন্টে রূপান্তর করে।',{hl:['code','data','stk']}),
  st('Dot MODEL comes first, before any segment is defined. It is followed by a memory model, here SMALL.',
     '.MODEL সবার আগে আসে, কোনো সেগমেন্ট ডিফাইন করার আগেই। এর পরে থাকে একটি মেমোরি মডেল, এখানে SMALL।',{ln:1,hl:['code','data'],view:'prog',note:'.MODEL memory_model — before any segment'}),
  st('Before going on, let us see what a memory model is. It tells the assembler how much code and how much data the program may have. Here is Table 4.4. Each block stands for one 64-kilobyte segment.',
     'এগোনোর আগে দেখি মেমোরি মডেল কী। এটি অ্যাসেম্বলারকে জানায় প্রোগ্রামে কতটা কোড আর কতটা ডেটা থাকতে পারবে। এই হলো টেবিল ৪.৪। প্রতিটি ব্লক একটি ৬৪ কিলোবাইটের সেগমেন্ট বোঝায়।',{view:'models',m:null,note:'Table 4.4 · memory models'}),
  st('SMALL: code in one segment and data in one segment. The instructions must fit in 64 kilobytes, and so must the variables.',
     'SMALL: কোড একটি সেগমেন্টে, ডেটা একটি সেগমেন্টে। সব ইনস্ট্রাকশন ৬৪ কিলোবাইটে আঁটতে হবে, সব ভেরিয়েবলও তাই।',{view:'models',m:'SMALL',note:'code ≤ 64 KB · data ≤ 64 KB'}),
  st('MEDIUM: code in more than one segment, but data in one segment. It suits a long program that works on a small amount of data.',
     'MEDIUM: কোড একাধিক সেগমেন্টে, কিন্তু ডেটা একটি সেগমেন্টে। লম্বা প্রোগ্রাম, কিন্তু অল্প ডেটা, এমন ক্ষেত্রে উপযুক্ত।',{view:'models',m:'MEDIUM',note:'more code · data ≤ 64 KB'}),
  st('COMPACT is the opposite: code in one segment, data in more than one segment. It suits a short program that handles a lot of data.',
     'COMPACT ঠিক উল্টো: কোড একটি সেগমেন্টে, ডেটা একাধিক সেগমেন্টে। ছোট প্রোগ্রাম, কিন্তু অনেক ডেটা, এমন ক্ষেত্রে উপযুক্ত।',{view:'models',m:'COMPACT',note:'code ≤ 64 KB · more data'}),
  st('LARGE: both code and data may use more than one segment. But a single array must still fit inside one segment, so no array can be larger than 64 kilobytes.',
     'LARGE: কোড আর ডেটা দুটোই একাধিক সেগমেন্ট ব্যবহার করতে পারে। তবে একটি অ্যারে অবশ্যই একটি সেগমেন্টের ভেতরে আঁটতে হবে, তাই কোনো অ্যারে ৬৪ কিলোবাইটের বড় হতে পারে না।',{view:'models',m:'LARGE',note:'one array ≤ 64 KB'}),
  st('HUGE: like LARGE, except that an array may be larger than 64 kilobytes. Such an array stretches across several segments.',
     'HUGE: LARGE এর মতোই, তবে এখানে একটি অ্যারে ৬৪ কিলোবাইটের বড় হতে পারে। এমন অ্যারে কয়েকটি সেগমেন্ট জুড়ে বিস্তৃত থাকে।',{view:'models',m:'HUGE',note:'one array > 64 KB, across segments'}),
  st('Unless a program has a lot of code or data, SMALL is the right choice, and every program in this course uses it. Back to our program: dot MODEL SMALL, so one code segment and one data segment.',
     'প্রোগ্রামে অনেক কোড বা ডেটা না থাকলে SMALL ই সঠিক, আর এই কোর্সের সব প্রোগ্রামে এটিই ব্যবহার হয়। আবার আমাদের প্রোগ্রামে ফিরি: .MODEL SMALL, অর্থাৎ একটি কোড সেগমেন্ট আর একটি ডেটা সেগমেন্ট।',{view:'prog',ln:1,hl:['code','data'],note:'.MODEL SMALL → code 1 · data 1'}),
  st('Dot STACK sets aside a block of memory for the stack. 100 hex means 256 bytes, enough for most programs. If the size is left out, 1 kilobyte is reserved. The block must be big enough for the stack at its largest.',
     '.STACK স্ট্যাকের জন্য একটি মেমোরি ব্লক আলাদা রাখে। 100H মানে ২৫৬ বাইট, যা বেশিরভাগ প্রোগ্রামের জন্য যথেষ্ট। আকার না দিলে ১ কিলোবাইট রাখা হয়। স্ট্যাক সবচেয়ে বড় হলে যতটা লাগে, ব্লকটি অন্তত ততটা হতে হবে।',{ln:2,hl:['stk','ss'],on:['es']}),
  st('Dot DATA starts the data segment, which holds every variable definition. Here WORD1 and WORD2 are words, and MSG is a string ending with a dollar sign.',
     '.DATA দিয়ে ডেটা সেগমেন্ট শুরু হয়, যেখানে সব ভেরিয়েবলের সংজ্ঞা থাকে। এখানে WORD1 আর WORD2 ওয়ার্ড, আর MSG হলো ডলার চিহ্নে শেষ হওয়া একটি স্ট্রিং।',{ln:[3,6],hl:['data']}),
  st('EQU constants are often placed in the data segment too. MASK takes no memory, because EQU is only a substitution done by the assembler.',
     'EQU ধ্রুবকগুলোও প্রায়ই ডেটা সেগমেন্টে রাখা হয়। MASK এর জন্য কোনো মেমোরি লাগে না, কারণ EQU শুধু অ্যাসেম্বলারের করা একটি প্রতিস্থাপন।',{ln:7,hl:['data'],note:'EQU → no memory allocated'}),
  st('Dot CODE starts the code segment, where the instructions live. A name after dot CODE is optional; in a SMALL program, giving one causes an error.',
     '.CODE দিয়ে কোড সেগমেন্ট শুরু হয়, যেখানে ইনস্ট্রাকশনগুলো থাকে। .CODE এর পরে নাম দেওয়া ঐচ্ছিক; SMALL প্রোগ্রামে নাম দিলে এরর হয়।',{ln:8,hl:['code','cs'],on:['ec']}),
  st('Inside the code segment, instructions are organized as procedures. PROC starts one and ENDP ends it. MAIN is the main procedure, and other procedures can follow it.',
     'কোড সেগমেন্টের ভেতরে ইনস্ট্রাকশনগুলো প্রোসিডিউরে সাজানো থাকে। PROC দিয়ে শুরু, ENDP দিয়ে শেষ। MAIN হলো মূল প্রোসিডিউর, আর এর পরে অন্য প্রোসিডিউর থাকতে পারে।',{ln:[9,17],hl:['code']}),
  st('When DOS loads the program, it puts a 256-byte program segment prefix in front of it, and sets DS and ES to the PSP. So at the start, DS does not point at our data.',
     'ডস প্রোগ্রাম লোড করার সময় এর সামনে ২৫৬ বাইটের প্রোগ্রাম সেগমেন্ট প্রিফিক্স বা PSP বসায়, আর DS ও ES কে PSP তে সেট করে। তাই শুরুতে DS আমাদের ডেটার দিকে নির্দেশ করে না।',{ln:9,hl:['psp','ds'],on:['ep'],note:'at load: DS = ES = PSP'}),
  st('MOV AX, @DATA and MOV DS, AX fix this. @DATA is the number of the data segment. It goes through AX because a number cannot be moved straight into a segment register.',
     'MOV AX,@DATA আর MOV DS,AX এটি ঠিক করে। @DATA হলো ডেটা সেগমেন্টের নম্বর। এটি AX এর মধ্য দিয়ে যায়, কারণ সেগমেন্ট রেজিস্টারে সরাসরি কোনো সংখ্যা রাখা যায় না।',{ln:[10,11],hl:['ds','data'],on:['ed'],note:'MOV DS,@DATA ✗ → via AX'}),
  st('Now the instructions can use the variables. AX gets WORD1, 2, then WORD2 is added, so AX holds 7.',
     'এখন ইনস্ট্রাকশনগুলো ভেরিয়েবল ব্যবহার করতে পারে। AX পায় WORD1, অর্থাৎ ২, তারপর WORD2 যোগ হয়, তাই AX এ থাকে ৭।',{ln:[12,13],hl:['code','data'],on:['ec','ed']}),
  st('Function 4C hex of INT 21h returns control to DOS. Every program must end this way.',
     'INT 21h এর ফাংশন 4Ch নিয়ন্ত্রণ ডসের কাছে ফিরিয়ে দেয়। প্রতিটি প্রোগ্রাম এভাবেই শেষ করতে হয়।',{ln:[14,15],hl:['code']}),
  st('The last line is END followed by the name of the main procedure. ENDP closes a procedure, END closes the whole source file, and the name after END tells DOS where execution starts.',
     'শেষ লাইন হলো END, তারপর মূল প্রোসিডিউরের নাম। ENDP একটি প্রোসিডিউর শেষ করে, END পুরো সোর্স ফাইল শেষ করে, আর END এর পরের নামটি জানায় এক্সিকিউশন কোথা থেকে শুরু হবে।',{ln:18,hl:['code','cs'],on:['ec'],note:'END MAIN → execution starts at MAIN'})]),

T('Input and output with INT 21h','INT 21h দিয়ে ইনপুট ও আউটপুট',
 {type:'cards',min:220,items:[
  {tag:'FUNCTION 1',h:{en:'Read one key',bn:'একটি কী পড়া'},c:'MOV AH,1\nINT 21H     ;AL = ASCII code',b:{en:['Waits for a key and echoes it','AL = 0 for keys like F1 or arrows','Gives no prompt by itself'],bn:['কী চাপার জন্য অপেক্ষা করে ও স্ক্রিনে দেখায়','F1 বা অ্যারো কী চাপলে AL = 0','নিজে থেকে কোনো প্রম্পট দেখায় না']}},
  {tag:'FUNCTION 2',h:{en:'Display one character',bn:'একটি অক্ষর দেখানো'},c:"MOV AH,2\nMOV DL,'?'\nINT 21H",b:{en:['DL = character to show','Cursor moves to the next position','Warning: changes AL'],bn:['DL = যে অক্ষর দেখাবে','কার্সর পরের ঘরে যায়','সতর্কতা: AL বদলে যায়']}},
  {tag:'FUNCTION 9',h:{en:'Display a string',bn:'একটি স্ট্রিং দেখানো'},c:'LEA DX,MSG\nMOV AH,9\nINT 21H',b:{en:['DX = offset of the string','String must end with $','The $ itself is not shown'],bn:['DX = স্ট্রিংয়ের অফসেট','স্ট্রিং $ দিয়ে শেষ হতে হবে','$ নিজে দেখানো হয় না']}},
  {tag:'FUNCTION 4Ch',h:{en:'Return to DOS',bn:'ডসে ফিরে যাওয়া'},c:'MOV AH,4CH\nINT 21H',b:{en:['Every program must end this way','Forgetting it leaves the machine in an unpredictable state'],bn:['প্রতিটি প্রোগ্রাম এভাবেই শেষ করতে হয়','ভুলে গেলে মেশিন অনিশ্চিত অবস্থায় পড়ে']}}]},
 [st('Assembly instructions are so basic that I O is hard to do directly. Instead we call DOS service routines with the INT instruction. INT 21h offers many functions; we put the function number in AH first.',
     'অ্যাসেম্বলি ইনস্ট্রাকশন এতটাই মৌলিক যে সরাসরি ইনপুট-আউটপুট করা কঠিন। তাই INT ইনস্ট্রাকশন দিয়ে ডসের সার্ভিস রুটিন ডাকি। INT 21h এ অনেকগুলো ফাংশন আছে, ফাংশনের নম্বর আগে AH এ রাখতে হয়।',{note:'function number → AH, then INT 21H'}),
  st('Function 1 reads a single key. The character arrives in AL and is echoed on the screen. It does not print a prompt, so the program should print one first.',
     'ফাংশন ১ একটি কী পড়ে। অক্ষরটি AL এ আসে এবং স্ক্রিনে দেখা যায়। এটি নিজে প্রম্পট দেখায় না, তাই প্রোগ্রামকে আগে একটি প্রম্পট দেখাতে হয়।',{hl:[0]}),
  st('Function 2 displays the character whose code is in DL. Be careful: it changes AL, so save any input character elsewhere first.',
     'ফাংশন ২ DL এ থাকা কোডের অক্ষরটি দেখায়। সাবধান: এটি AL বদলে দেয়, তাই ইনপুটের অক্ষর আগে অন্য কোথাও সংরক্ষণ করতে হয়।',{hl:[1]}),
  st('Function 9 displays a whole string. DX must hold the offset of the string, and the string must end with a dollar sign, which is not displayed.',
     'ফাংশন ৯ পুরো একটি স্ট্রিং দেখায়। DX এ স্ট্রিংয়ের অফসেট থাকতে হবে, আর স্ট্রিংটি ডলার চিহ্ন দিয়ে শেষ হতে হবে, যা দেখানো হয় না।',{hl:[2]}),
  st('Function 4C hex returns control to DOS. Every program must end with these two lines.',
     'ফাংশন 4Ch নিয়ন্ত্রণ ডসের কাছে ফিরিয়ে দেয়। প্রতিটি প্রোগ্রাম এই দুই লাইন দিয়ে শেষ করতে হয়।',{hl:[3]})]),

T('A first program: echo','প্রথম প্রোগ্রাম: ইকো',
 {type:'code',lines:ECHO,regs:['AH','AL','BL','DL'],out:true},
 [st('The echo program reads a character from the keyboard and displays it at the start of the next line. It uses no variables, so there is no dot DATA segment.',
     'ইকো প্রোগ্রাম কিবোর্ড থেকে একটি অক্ষর পড়ে, আর পরের লাইনের শুরুতে সেটি দেখায়। এতে কোনো ভেরিয়েবল নেই, তাই .DATA সেগমেন্ট নেই।',{ln:[1,5]}),
  st('First, display a question mark as the prompt. AH equals 2 selects the display function, and DL holds 3F hex, the code of the question mark.',
     'প্রথমে প্রম্পট হিসেবে একটি প্রশ্নবোধক চিহ্ন দেখাই। AH = ২ দিয়ে ডিসপ্লে ফাংশন বাছাই করি, আর DL এ রাখি 3Fh, প্রশ্নবোধক চিহ্নের কোড।',{ln:[7,9],regs:{AH:'02',DL:'3F',AL:'3F'},out:'?'}),
  st('Next, read one character. AH equals 1 selects keyboard input. The user types A, so AL receives 41 hex, and A is echoed on the screen.',
     'এরপর একটি অক্ষর পড়ি। AH = ১ দিয়ে কিবোর্ড ইনপুট বাছাই করি। ব্যবহারকারী A টাইপ করে, তাই AL এ আসে 41h, আর স্ক্রিনে A দেখা যায়।',{ln:[11,12],regs:{AH:'01',AL:'41'},out:'?A'}),
  st('Save the character in BL. This matters, because function 2 is about to overwrite AL.',
     'অক্ষরটি BL এ সংরক্ষণ করি। এটি জরুরি, কারণ ফাংশন ২ এখনই AL মুছে ফেলবে।',{ln:13,regs:{BL:'41'},rhl:['BL']}),
  st('Move to a new line by displaying a carriage return, 0D hex, and a line feed, 0A hex. Notice that AL has changed, exactly as warned.',
     'ক্যারেজ রিটার্ন 0Dh আর লাইন ফিড 0Ah দেখিয়ে নতুন লাইনে যাই। লক্ষ করো, আগের সতর্কতা অনুযায়ী AL বদলে গেছে।',{ln:[15,19],regs:{AH:'02',DL:'0A',AL:'0A'},rhl:['AL'],out:'?A\n'}),
  st('Put the saved character back in DL and display it. The A appears at the start of the new line.',
     'সংরক্ষিত অক্ষরটি আবার DL এ রেখে দেখাই। নতুন লাইনের শুরুতে A দেখা যায়।',{ln:[21,22],regs:{DL:'41',AL:'41'},out:'?A\nA'}),
  st('Finally, function 4C hex returns control to DOS. MAIN ENDP closes the procedure and END MAIN closes the program.',
     'সবশেষে ফাংশন 4Ch নিয়ন্ত্রণ ডসের কাছে ফিরিয়ে দেয়। MAIN ENDP প্রোসিডিউর শেষ করে, আর END MAIN প্রোগ্রাম শেষ করে।',{ln:[24,27],regs:{AH:'4C'}})]),

T('Displaying a string: LEA and DS','স্ট্রিং দেখানো: LEA ও DS',
 {type:'code',lines:PRINTS,regs:['AX','DS','DX','AH'],init:{AX:'0000',DS:'0B2C',DX:'0000',AH:'00'},out:true},
 [st("This program has a data segment. MSG is defined as the bytes of HELLO followed by a dollar sign, which marks the end of the string for function 9.",
     'এই প্রোগ্রামে একটি ডেটা সেগমেন্ট আছে। MSG হলো HELLO! এর বাইটগুলো, শেষে একটি ডলার চিহ্ন, যা ফাংশন ৯ এর জন্য স্ট্রিংয়ের শেষ নির্দেশ করে।',{ln:[4,5]}),
  st('When DOS loads a program, it puts the segment of the program segment prefix, not your data segment, in DS. So DS must be initialized. @DATA is the data segment number.',
     'ডস প্রোগ্রাম লোড করার সময় DS এ রাখে প্রোগ্রাম সেগমেন্ট প্রিফিক্সের সেগমেন্ট, আমাদের ডেটা সেগমেন্ট নয়। তাই DS ইনিশিয়ালাইজ করতে হয়। @DATA হলো ডেটা সেগমেন্টের নম্বর।',{ln:9,regs:{AX:'0B4D'},rhl:['DS'],note:'DS still points at the PSP'}),
  st('A number cannot be moved straight into a segment register, so it goes through AX first. Now DS points at our data.',
     'সেগমেন্ট রেজিস্টারে সরাসরি কোনো সংখ্যা রাখা যায় না, তাই আগে AX এর মধ্য দিয়ে যায়। এখন DS আমাদের ডেটার দিকে নির্দেশ করছে।',{ln:10,regs:{DS:'0B4D'},rhl:['DS']}),
  st('LEA, load effective address, puts the offset of MSG into DX. MOV would copy the contents; LEA copies the address, which is exactly what function 9 wants.',
     'LEA, অর্থাৎ লোড ইফেক্টিভ অ্যাড্রেস, MSG এর অফসেট DX এ রাখে। MOV কনটেন্ট কপি করত; LEA কপি করে অ্যাড্রেস, যা ফাংশন ৯ এর ঠিক দরকার।',{ln:12,regs:{DX:'0000'},rhl:['DX'],note:'MOV → contents · LEA → address'}),
  st('AH equals 9 selects the string function, and INT 21h prints HELLO. The dollar sign is consumed as the terminator and never appears.',
     'AH = ৯ দিয়ে স্ট্রিং ফাংশন বাছাই করি, আর INT 21h HELLO! দেখায়। ডলার চিহ্নটি শেষ নির্দেশক হিসেবে ব্যবহৃত হয়, স্ক্রিনে আসে না।',{ln:[13,14],regs:{AH:'09',AX:'0924'},out:'HELLO!'}),
  st('Then the program returns to DOS. Every program with a data segment begins with these two DS lines.',
     'তারপর প্রোগ্রাম ডসে ফিরে যায়। ডেটা সেগমেন্ট আছে এমন প্রতিটি প্রোগ্রাম এই দুই লাইনের DS ইনিশিয়ালাইজেশন দিয়ে শুরু হয়।',{ln:[16,17],regs:{AH:'4C',AX:'4C24'}})]),

T('Case conversion program','কেস কনভার্শন প্রোগ্রাম',
 {type:'code',lines:CASEC,regs:['AH','AL','DX','CHAR'],init:{CHAR:'?'},out:true},
 [st('This program combines nearly everything in the chapter. It asks for a lowercase letter and displays it in uppercase on the next line. CR and LF are EQU names, so they use no memory.',
     'এই প্রোগ্রামে অধ্যায়ের প্রায় সবকিছু একসাথে আছে। এটি একটি ছোট হাতের অক্ষর চায়, আর পরের লাইনে সেটি বড় হাতের অক্ষরে দেখায়। CR আর LF হলো EQU নাম, তাই এদের জন্য কোনো মেমোরি লাগে না।',{ln:[4,9]}),
  st('A helpful trick: MSG2 starts with CR and LF, so printing it also moves to a new line. And MSG2 has no dollar sign, so printing runs straight on into CHAR, which supplies the dollar.',
     'একটি কৌশল: MSG2 শুরু হয় CR আর LF দিয়ে, তাই এটি প্রিন্ট করলে নতুন লাইনেও যাওয়া হয়। আর MSG2 এর শেষে ডলার নেই, তাই প্রিন্ট চলতে চলতে CHAR পর্যন্ত যায়, আর CHAR এর পরে ডলার আছে।',{ln:[8,9]}),
  st('The program initializes DS, then prints the first message with function 9.',
     'প্রোগ্রাম DS ইনিশিয়ালাইজ করে, তারপর ফাংশন ৯ দিয়ে প্রথম বার্তাটি দেখায়।',{ln:[12,17],regs:{AH:'09',DX:'0000'},out:'ENTER A LOWER CASE LETTER: '}),
  st('Function 1 reads a letter. The user types a, so AL holds 61 hex.',
     'ফাংশন ১ একটি অক্ষর পড়ে। ব্যবহারকারী a টাইপ করে, তাই AL এ আসে 61h।',{ln:[19,20],regs:{AH:'01',AL:'61'},out:'ENTER A LOWER CASE LETTER: a'}),
  st('Lowercase letters start at 61 hex and uppercase at 41 hex, so subtracting 20 hex converts the letter. AL becomes 41, the code of capital A.',
     'ছোট হাতের অক্ষর শুরু 61h থেকে, আর বড় হাতের 41h থেকে, তাই 20h বিয়োগ করলেই রূপান্তর হয়। AL হয় 41, বড় হাতের A এর কোড।',{ln:21,regs:{AL:'41'},rhl:['AL'],note:"'a' 61h − 20h = 41h 'A'"}),
  st('The converted letter is stored in CHAR.',
     'রূপান্তরিত অক্ষরটি CHAR এ রাখা হয়।',{ln:22,regs:{CHAR:"'A'"},rhl:['CHAR']}),
  st('Printing MSG2 moves to the next line, shows the message, and runs on into CHAR, so the letter appears right after it. Note there is no error checking: an uppercase letter or digit would give a wrong result.',
     'MSG2 প্রিন্ট করলে পরের লাইনে গিয়ে বার্তা দেখায়, আর চলতে চলতে CHAR পর্যন্ত যায়, তাই অক্ষরটি ঠিক পরেই দেখা যায়। লক্ষ করো, কোনো ভুল যাচাই নেই: বড় হাতের অক্ষর বা অঙ্ক দিলে ভুল ফল আসবে।',{ln:[24,26],regs:{AH:'09',DX:'001C'},out:'ENTER A LOWER CASE LETTER: a\nIN UPPER CASE IT IS: A'}),
  st('Finally the program exits to DOS with function 4C hex.',
     'সবশেষে ফাংশন 4Ch দিয়ে প্রোগ্রাম ডসে ফিরে যায়।',{ln:[28,29],regs:{AH:'4C'}})]),

T('Creating and running a program','প্রোগ্রাম তৈরি ও চালানো',
 {type:'dg',h:440,nodes:[
  {id:'ed',x:20,y:50,w:210,h:100,l:'1 · Editor',s:'type the source'},
  {id:'as',x:270,y:50,w:210,h:100,l:'2 · Assemble',s:'MASM'},
  {id:'lk',x:520,y:50,w:210,h:100,l:'3 · Link',s:'LINK'},
  {id:'rn',x:770,y:50,w:210,h:100,l:'4 · Run',s:'type the name'},
  {id:'f1',x:150,y:270,w:200,h:80,l:'PGM4_1.ASM',s:'source file',mono:true,fs:20},
  {id:'f2',x:400,y:270,w:200,h:80,l:'PGM4_1.OBJ',s:'object file',mono:true,fs:20},
  {id:'f3',x:650,y:270,w:200,h:80,l:'PGM4_1.EXE',s:'run file',mono:true,fs:20}],
  edges:[{id:'e1',a:'ed:b',b:'f1:t:.3'},{id:'e2',a:'f1:t:.7',b:'as:b'},{id:'e3',a:'as:b:.7',b:'f2:t:.6'},{id:'e4',a:'f2:t:.85',b:'lk:b:.3'},{id:'e5',a:'lk:b:.7',b:'f3:t:.5'},{id:'e6',a:'f3:t:.85',b:'rn:b:.3'}]},
 [st('Building a program takes four steps. First, create the source file in a text editor. The usual extension is dot ASM.',
     'একটি প্রোগ্রাম তৈরি করতে চারটি ধাপ লাগে। প্রথমে টেক্সট এডিটরে সোর্স ফাইল তৈরি করি। সাধারণ এক্সটেনশন .ASM।',{hl:['ed','f1'],on:['e1']}),
  st('Second, assemble it. MASM translates the source into a machine-language object file, PGM4_1 dot OBJ.',
     'দ্বিতীয়ত, অ্যাসেম্বল করি। MASM সোর্সকে মেশিন ল্যাঙ্গুয়েজ অবজেক্ট ফাইলে অনুবাদ করে, PGM4_1.OBJ।',{hl:['as','f2'],on:['e2','e3']}),
  st('Third, link it. LINK combines one or more object files into a single executable run file, PGM4_1 dot EXE.',
     'তৃতীয়ত, লিংক করি। LINK এক বা একাধিক অবজেক্ট ফাইল মিলিয়ে একটি চালানোর উপযোগী রান ফাইল তৈরি করে, PGM4_1.EXE।',{hl:['lk','f3'],on:['e4','e5']}),
  st('Fourth, run it by typing its name, with or without the dot EXE extension. In class, EMU8086 performs all of these steps for you.',
     'চতুর্থত, নাম টাইপ করে চালাই, .EXE সহ বা ছাড়া। ক্লাসে EMU8086 এই সব ধাপ আমাদের হয়ে করে দেয়।',{hl:['rn'],on:['e6']})])
]});

<script>
"use strict";
/* ===================== CHAPTER 5 ===================== */
CH.push({n:5,t:{en:'The Processor Status and the FLAGS Register',bn:'প্রসেসরের অবস্থা ও ফ্ল্যাগ রেজিস্টার'},topics:[

T('Why does a CPU need flags?','সিপিইউর ফ্ল্যাগ কেন দরকার?',
 {type:'cards',min:220,items:[
  {tag:'STATUS FLAGS',h:{en:'Describe the result',bn:'ফলাফলের বর্ণনা'},b:{en:'Was it zero? Negative? Did it overflow? Six of them: CF, PF, AF, ZF, SF, OF.',bn:'ফল কি শূন্য? ঋণাত্মক? ওভারফ্লো হয়েছে? মোট ছয়টি: CF, PF, AF, ZF, SF, OF।'}},
  {tag:'CONTROL FLAGS',h:{en:'Switch features on or off',bn:'কিছু বৈশিষ্ট্য চালু বা বন্ধ'},b:{en:'TF, IF and DF enable or disable certain operations. Covered in later chapters.',bn:'TF, IF আর DF প্রসেসরের কিছু কাজ চালু বা বন্ধ করে। পরের অধ্যায়ে আলোচনা।'}},
  {tag:'WHY IT MATTERS',h:{en:'Flags drive every decision',bn:'প্রতিটি সিদ্ধান্তের ভিত্তি'},b:{en:'Chapter 6\'s jump instructions read these flags to build IF statements, branches and loops. No flags, no decisions.',bn:'অধ্যায় ৬ এর জাম্প ইনস্ট্রাকশন এই ফ্ল্যাগগুলো পড়েই IF, ব্রাঞ্চ আর লুপ তৈরি করে। ফ্ল্যাগ না থাকলে কোনো সিদ্ধান্ত নেওয়া যেত না।'}}]},
 [st('What separates a computer from other machines is its ability to make decisions. The 8086 keeps its current state in nine individual bits called flags, and every decision it makes is based on them.',
     'অন্য মেশিন থেকে কম্পিউটারকে আলাদা করে তার সিদ্ধান্ত নেওয়ার ক্ষমতা। ৮০৮৬ তার বর্তমান অবস্থা নয়টি আলাদা বিটে রাখে, যাদের বলে ফ্ল্যাগ, আর এর প্রতিটি সিদ্ধান্ত এই ফ্ল্যাগের উপর নির্ভর করে।',{}),
  st('Six of them are status flags. They describe the result of the last computation: was it zero, was it negative, did it overflow?',
     'এদের ছয়টি হলো স্ট্যাটাস ফ্ল্যাগ। এরা শেষ গণনার ফলাফল বর্ণনা করে: ফল কি শূন্য, ঋণাত্মক, নাকি ওভারফ্লো হয়েছে?',{hl:[0]}),
  st('Three are control flags, which enable or disable certain operations of the processor.',
     'তিনটি হলো কন্ট্রোল ফ্ল্যাগ, যেগুলো প্রসেসরের কিছু কাজ চালু বা বন্ধ করে।',{hl:[1]}),
  st('This is why flags matter so much. The jump instructions in the next chapter read these flags to build IF statements and loops.',
     'এই কারণেই ফ্ল্যাগ এত গুরুত্বপূর্ণ। পরের অধ্যায়ের জাম্প ইনস্ট্রাকশনগুলো এই ফ্ল্যাগ পড়েই IF স্টেটমেন্ট আর লুপ তৈরি করে।',{hl:[2]})]),

T('The FLAGS register layout','ফ্ল্যাগ রেজিস্টারের বিন্যাস',
 {type:'bits',rows:[{id:'f',label:'FLAGS',n:16,idx:true,names:FLAGNAMES,v:'0000000000000000'}]},
 [st('FLAGS is a 16-bit register, but only nine of its bits mean anything. You do not need to memorize which bit is which; what matters is what each flag means and when it is set.',
     'ফ্ল্যাগ একটি ১৬ বিটের রেজিস্টার, কিন্তু এর মাত্র নয়টি বিট অর্থবহ। কোন বিট কোন ফ্ল্যাগ তা মুখস্থ করার দরকার নেই; জরুরি হলো প্রতিটি ফ্ল্যাগের অর্থ আর কখন সেট হয়।',{}),
  st('The status flags live in bits 0, 2, 4, 6, 7 and 11: carry, parity, auxiliary carry, zero, sign and overflow.',
     'স্ট্যাটাস ফ্ল্যাগগুলো থাকে বিট ০, ২, ৪, ৬, ৭ আর ১১ তে: ক্যারি, প্যারিটি, অক্সিলিয়ারি ক্যারি, জিরো, সাইন আর ওভারফ্লো।',{hl:{f:[0,2,4,6,7,11]},note:'CF=0 PF=2 AF=4 ZF=6 SF=7 OF=11'}),
  st('The control flags live in bits 8, 9 and 10: trap, interrupt and direction. Trap and interrupt come in chapter 11, direction in the string chapter.',
     'কন্ট্রোল ফ্ল্যাগগুলো থাকে বিট ৮, ৯ আর ১০ এ: ট্র্যাপ, ইন্টারাপ্ট আর ডিরেকশন। ট্র্যাপ আর ইন্টারাপ্ট পরের অধ্যায়ে, ডিরেকশন স্ট্রিংয়ের অধ্যায়ে।',{hl:{f:[8,9,10]},note:'TF=8 IF=9 DF=10'}),
  st('For example, SUB AX, AX gives a result of 0, so the zero flag becomes 1, telling the processor and us that a zero result was produced.',
     'যেমন, SUB AX,AX এর ফল ০, তাই জিরো ফ্ল্যাগ হয় ১, যা প্রসেসর আর আমাদের জানায় যে ফল শূন্য হয়েছে।',{rows:{f:'0000000001000100'},hl:{f:[6]},note:'SUB AX,AX → 0 → ZF = 1 (and PF = 1)'})]),

T('The six status flags','ছয়টি স্ট্যাটাস ফ্ল্যাগ',
 {type:'alu',op:'ADD',a:'FFFF',b:'FFFF',w:16},
 [st('Let\'s meet the status flags through one addition, Example 5.1: ADD AX, BX with both registers holding FFFF.',
     'একটি যোগের মাধ্যমে স্ট্যাটাস ফ্ল্যাগগুলো চিনি, উদাহরণ ৫.১: ADD AX,BX, যেখানে দুটি রেজিস্টারেই আছে FFFF।',{ph:0}),
  st('The sum is 1FFFE hex, but only 16 bits fit in AX, so AX holds FFFE.',
     'যোগফল 1FFFEh, কিন্তু AX এ মাত্র ১৬ বিট আঁটে, তাই AX এ থাকে FFFE।',{ph:1}),
  st('Carry flag, CF: set to 1 when there is a carry out of the most significant bit on addition, or a borrow into it on subtraction. Here a 1 was carried out, so CF is 1.',
     'ক্যারি ফ্ল্যাগ CF: যোগে সবচেয়ে বাম বিট থেকে ক্যারি বের হলে, বা বিয়োগে সেখানে ধার নিতে হলে ১ হয়। এখানে একটি ১ বেরিয়ে গেছে, তাই CF = ১।',{ph:3,fhl:['CF']}),
  st('Parity flag, PF: set when the low byte of the result has an even number of 1 bits. The low byte FE has seven 1s, which is odd, so PF is 0. Only the low byte counts.',
     'প্যারিটি ফ্ল্যাগ PF: ফলাফলের লো বাইটে ১ এর সংখ্যা জোড় হলে ১ হয়। লো বাইট FE এ সাতটি ১, যা বিজোড়, তাই PF = ০। শুধু লো বাইট গোনা হয়।',{ph:3,fhl:['PF']}),
  st('Zero flag, ZF: 1 for a zero result, 0 otherwise. The result is not zero, so ZF is 0. The auxiliary carry flag is used only for BCD arithmetic, so we ignore it here.',
     'জিরো ফ্ল্যাগ ZF: ফল শূন্য হলে ১, নাহলে ০। এখানে ফল শূন্য নয়, তাই ZF = ০। অক্সিলিয়ারি ক্যারি ফ্ল্যাগ শুধু BCD গণনায় লাগে, তাই এখানে বাদ দিচ্ছি।',{ph:3,fhl:['ZF']}),
  st('Sign flag, SF: simply a copy of the most significant bit of the result. The msb of FFFE is 1, so SF is 1: the result is negative in a signed reading.',
     'সাইন ফ্ল্যাগ SF: ফলাফলের সবচেয়ে বাম বিটের কপি মাত্র। FFFE এর এমএসবি ১, তাই SF = ১, অর্থাৎ সাইনড হিসেবে ফল ঋণাত্মক।',{ph:3,fhl:['SF']}),
  st('Overflow flag, OF: set when a signed result is too big to fit. Signed, this is minus 1 plus minus 1 equals minus 2, which is correct, so OF is 0.',
     'ওভারফ্লো ফ্ল্যাগ OF: সাইনড ফল জায়গায় না আঁটলে ১ হয়। সাইনড হিসেবে এটি −১ যোগ −১ = −২, যা সঠিক, তাই OF = ০।',{ph:3,fhl:['OF'],info:{en:'unsigned: 65535 + 65535 = 131070 → too big → [[CF = 1]] · signed: (−1) + (−1) = −2 → correct → [[OF = 0]]',bn:'আনসাইনড: 65535 + 65535 = 131070 → আঁটে না → [[CF = 1]] · সাইনড: (−1) + (−1) = −2 → সঠিক → [[OF = 0]]'}})],'alu'),

T('Overflow: signed vs. unsigned','ওভারফ্লো: সাইনড বনাম আনসাইনড',
 {type:'alu',op:'ADD',a:'FFFF',b:'0001',w:16,noaf:true},
 [st('The range of numbers a register can hold is limited. A byte holds minus 128 to 127 signed, or 0 to 255 unsigned. A word holds minus 32,768 to 32,767, or 0 to 65,535. A result outside the range overflows.',
     'একটি রেজিস্টারে রাখা সংখ্যার পরিসর সীমিত। বাইটে সাইনড −১২৮ থেকে ১২৭, বা আনসাইনড ০ থেকে ২৫৫। ওয়ার্ডে −৩২,৭৬৮ থেকে ৩২,৭৬৭, বা ০ থেকে ৬৫,৫৩৫। ফল এর বাইরে গেলে ওভারফ্লো হয়।',{ph:0}),
  st('First case: AX is FFFF and BX is 0001, then ADD AX, BX. A 1 is carried out of the msb and lost, leaving 0000 in AX.',
     'প্রথম ক্ষেত্র: AX = FFFF আর BX = 0001, তারপর ADD AX,BX। এমএসবি থেকে একটি ১ বেরিয়ে হারিয়ে যায়, AX এ থাকে 0000।',{ph:1}),
  st('Unsigned, the true answer is 65,536, which does not fit, so the stored 0 is wrong: CF is 1. Signed, it is minus 1 plus 1 equals 0, which is right: OF is 0.',
     'আনসাইনড হিসেবে সঠিক উত্তর ৬৫,৫৩৬, যা আঁটে না, তাই রাখা ০ ভুল: CF = ১। সাইনড হিসেবে −১ যোগ ১ = ০, যা সঠিক: OF = ০।',{ph:3,fhl:['CF','OF'],info:{en:'unsigned overflow [[CF = 1]] · no signed overflow [[OF = 0]]',bn:'আনসাইনড ওভারফ্লো [[CF = 1]] · সাইনড ওভারফ্লো নেই [[OF = 0]]'}}),
  st('Second case: AX and BX both hold 7FFF. The sum, FFFE, has its msb set, so it looks negative.',
     'দ্বিতীয় ক্ষেত্র: AX আর BX দুটিতেই 7FFF। যোগফল FFFE এর এমএসবি ১, তাই এটি ঋণাত্মক দেখায়।',{a:'7FFF',b:'7FFF',ph:1}),
  st('Signed, 32,767 plus 32,767 is 65,534, far out of range, and FFFE reads as minus 2: OF is 1. Unsigned, FFFE is 65,534, which is right: CF is 0. Same bits, two different verdicts.',
     'সাইনড হিসেবে ৩২,৭৬৭ যোগ ৩২,৭৬৭ = ৬৫,৫৩৪, যা পরিসরের অনেক বাইরে, আর FFFE পড়া হয় −২: OF = ১। আনসাইনড হিসেবে FFFE = ৬৫,৫৩৪, যা সঠিক: CF = ০। একই বিট, দুই রকম রায়।',{ph:3,fhl:['CF','OF'],info:{en:'signed overflow [[OF = 1]] · no unsigned overflow [[CF = 0]]',bn:'সাইনড ওভারফ্লো [[OF = 1]] · আনসাইনড ওভারফ্লো নেই [[CF = 0]]'}})],'alu'),

T('How the processor detects overflow','প্রসেসর কীভাবে ওভারফ্লো বোঝে',
 {type:'lines',lines:[
  {t:'the processor computes BOTH readings, every time',c:'h'},
  'CF = 1  →  UNSIGNED overflow',
  'OF = 1  →  SIGNED overflow',
  {t:'unsigned overflow',c:'h'},
  'addition:    carry OUT of the msb          → CF = 1',
  'subtraction: borrow INTO the msb           → CF = 1',
  {t:'signed overflow',c:'h'},
  'add two numbers of the SAME sign, result has the other sign  → OF = 1',
  'subtract numbers of DIFFERENT sign, result sign ≠ destination → OF = 1',
  'adding numbers of different sign can never overflow',
  {t:'shortcut: carry INTO msb ≠ carry OUT of msb  →  OF = 1',c:'res'},
  {t:'you choose the reading: signed → look at OF · unsigned → look at CF',c:'p'}]},
 [st('The processor does not know whether your data is signed or unsigned. It applies both readings to every operation and reports them separately: CF for unsigned overflow, OF for signed overflow.',
     'প্রসেসর জানে না তোমার ডেটা সাইনড নাকি আনসাইনড। এটি প্রতিটি অপারেশনে দুই রকম ব্যাখ্যাই প্রয়োগ করে আর আলাদাভাবে জানায়: আনসাইনড ওভারফ্লোর জন্য CF, সাইনড ওভারফ্লোর জন্য OF।',{show:3,hl:[1,2]}),
  st('Unsigned overflow is easy to spot. On addition, a carry out of the msb sets CF. On subtraction, a borrow into the msb sets CF.',
     'আনসাইনড ওভারফ্লো সহজেই ধরা যায়। যোগে এমএসবি থেকে ক্যারি বের হলে CF সেট হয়। বিয়োগে এমএসবিতে ধার নিতে হলে CF সেট হয়।',{show:6,hl:[4,5]}),
  st('Signed overflow happens when you add two numbers of the same sign and the result has the opposite sign. Adding numbers of different signs can never overflow.',
     'সাইনড ওভারফ্লো হয় যখন একই চিহ্নের দুটি সংখ্যা যোগ করে ফলের চিহ্ন উল্টে যায়। ভিন্ন চিহ্নের সংখ্যা যোগ করলে কখনো ওভারফ্লো হয় না।',{show:10,hl:[7,8,9]}),
  st('A handy shortcut: if the carry into the msb differs from the carry out of the msb, OF is 1.',
     'একটি সহজ উপায়: এমএসবিতে আসা ক্যারি আর এমএসবি থেকে বের হওয়া ক্যারি আলাদা হলে OF = ১।',{show:11,hl:[10]}),
  st('So it is the programmer who interprets. For a signed reading, only OF matters. For an unsigned reading, only CF matters. Check it right away, because a later instruction may change the flag.',
     'অর্থাৎ ব্যাখ্যা করে প্রোগ্রামার। সাইনড ব্যাখ্যায় শুধু OF গুরুত্বপূর্ণ, আনসাইনড ব্যাখ্যায় শুধু CF। সাথে সাথেই পরীক্ষা করতে হয়, কারণ পরের ইনস্ট্রাকশন ফ্ল্যাগ বদলে দিতে পারে।',{show:12,hl:[11]})],'alu'),

T('Which instructions affect which flags','কোন ইনস্ট্রাকশন কোন ফ্ল্যাগ বদলায়',
 {type:'cards',min:200,items:[
  {tag:'MOV / XCHG',h:{en:'No flags',bn:'কোনো ফ্ল্যাগ নয়'},b:{en:'They only copy data, so there is nothing to report.',bn:'শুধু ডেটা কপি করে, তাই জানানোর কিছু নেই।'}},
  {tag:'ADD / SUB',h:{en:'All status flags',bn:'সব স্ট্যাটাস ফ্ল্যাগ'},b:{en:'CF, PF, AF, ZF, SF and OF all reflect the result.',bn:'CF, PF, AF, ZF, SF, OF সবই ফলাফল দেখায়।'}},
  {tag:'INC / DEC',h:{en:'All except CF',bn:'CF ছাড়া সব'},b:{en:'CF is left exactly as it was, even if the operation carried out of the msb.',bn:'এমএসবি থেকে ক্যারি বের হলেও CF আগের মতোই থাকে।'}},
  {tag:'NEG',h:{en:'All, with special rules',bn:'সব, বিশেষ নিয়মে'},b:{en:['CF = 1 unless the result is 0','OF = 1 if the operand is 8000h (word) or 80h (byte)'],bn:['ফল ০ না হলে CF = 1','অপারেন্ড 8000h (ওয়ার্ড) বা 80h (বাইট) হলে OF = 1']}}]},
 [st('Each time an instruction runs, the flags are usually updated to reflect its result. But some instructions affect no flags, some affect only a few, and it is important to know which, because jumps depend on them.',
     'প্রতিটি ইনস্ট্রাকশন চলার পর সাধারণত ফ্ল্যাগগুলো ফলাফল অনুযায়ী বদলায়। কিন্তু কিছু ইনস্ট্রাকশন কোনো ফ্ল্যাগ বদলায় না, কিছু অল্প কয়েকটি বদলায়। কোনটি কী করে তা জানা জরুরি, কারণ জাম্প এর উপর নির্ভর করে।',{}),
  st('MOV and XCHG affect no flags. So you can safely place a MOV between a comparison and the jump that depends on it.',
     'MOV আর XCHG কোনো ফ্ল্যাগ বদলায় না। তাই তুলনা আর তার উপর নির্ভরশীল জাম্পের মাঝে নিশ্চিন্তে MOV রাখা যায়।',{hl:[0]}),
  st('ADD and SUB affect all the status flags.',
     'ADD আর SUB সব স্ট্যাটাস ফ্ল্যাগ বদলায়।',{hl:[1]}),
  st('INC and DEC affect all of them except CF. This is the one students most often get wrong: CF stays exactly as it was.',
     'INC আর DEC, CF ছাড়া বাকি সব বদলায়। শিক্ষার্থীরা এখানেই সবচেয়ে বেশি ভুল করে: CF ঠিক আগের মতোই থাকে।',{hl:[2]}),
  st('NEG affects all flags. CF is 1 unless the result is zero, and OF is 1 only for 8000 hex in a word or 80 hex in a byte, because those values have no positive partner.',
     'NEG সব ফ্ল্যাগ বদলায়। ফল শূন্য না হলে CF = ১, আর OF = ১ হয় শুধু ওয়ার্ডে 8000h বা বাইটে 80h এর জন্য, কারণ এদের কোনো ধনাত্মক জোড়া নেই।',{hl:[3]})]),

T('Worked examples: predict the flags','উদাহরণ: ফ্ল্যাগ অনুমান করো',
 {type:'alu',op:'ADD',a:'80',b:'80',w:8,noaf:true},

  st('ZF is 1 because the result is 0, PF is 1 because zero 1s is even, and CF is 1 for the carry. OF is 1 too: we added two negatives, minus 128 each, and got 0.',
     'ফল ০ বলে ZF = ১, শূন্যটি ১ জোড় সংখ্যা বলে PF = ১, আর ক্যারির জন্য CF = ১। OF ও ১: দুটি ঋণাত্মক সংখ্যা, প্রতিটি −১২৮, যোগ করে পেলাম ০।',{ph:3,fhl:['ZF','CF','OF']}),
  st('Example 5.3: SUB AX, BX with 8000 minus 0001 gives 7FFF. There is no borrow, so CF is 0. But signed, minus 32,768 minus 1 is out of range, and the result came out positive: OF is 1.',

  st('Example 5.4: INC AL with AL equal to FF gives 00. ZF is 1. Even though there was a carry out, CF is unchanged, because INC never touches CF.',
     'উদাহরণ ৫.৪: INC AL, AL = FF হলে ফল 00। ZF = ১। ক্যারি বের হলেও CF অপরিবর্তিত, কারণ INC কখনো CF ছোঁয় না।',{op:'INC',a:'FF',w:8,ph:3,fhl:['CF','ZF'],note:'Ex 5.4 · INC AL   AL=FFh'}),
  st('Example 5.5: MOV AX, minus 5 puts FFFB in AX. No arithmetic happens, so no flag changes.',
     'উদাহরণ ৫.৫: MOV AX,-5 এর ফলে AX এ FFFB আসে। কোনো গণনা হয় না, তাই কোনো ফ্ল্যাগ বদলায় না।',{op:'MOV',a:'0000',b:'FFFB',w:16,ph:3,note:'Ex 5.5 · MOV AX,-5'}),
  st('Example 5.6: NEG AX with AX equal to 8000. The two\'s complement of 8000 is 8000 again! CF is 1 and OF is 1, because plus 32,768 does not exist in a signed word.',

  st('Now fifteen more examples. Before the flags appear, try to predict each one yourself. Example 7: ADD AL, BL with AL equal to 7F and BL equal to 01. The sum is 80 hex. Two positives gave a negative, so OF is 1 and SF is 1. There is no carry out, so CF is 0. 80 hex has a single 1 bit, odd, so PF is 0.',
     'এবার আরও পনেরোটি উদাহরণ। ফ্ল্যাগ দেখানোর আগে প্রতিটি নিজে অনুমান করার চেষ্টা করো। উদাহরণ ৭: ADD AL,BL, AL = 7F আর BL = 01। যোগফল 80h। দুটি ধনাত্মক যোগ করে ঋণাত্মক এসেছে, তাই OF = ১ আর SF = ১। কোনো ক্যারি বের হয়নি, তাই CF = ০। 80h এ মাত্র একটি ১ বিট, বিজোড়, তাই PF = ০।',{op:'ADD',a:'7F',b:'01',w:8,ph:3,fhl:['OF','SF','CF'],note:'Ex 7 · ADD AL,BL   AL=7Fh BL=01h'}),
  st('Example 8: ADD AX, BX with both equal to 8000. The true sum, 10000 hex, loses its carry, leaving 0000. CF is 1, ZF is 1, and PF is 1. Two negatives gave zero, a non-negative result, so OF is 1 as well.',
     'উদাহরণ ৮: ADD AX,BX, দুটিই 8000। আসল যোগফল 10000h এর ক্যারি হারিয়ে যায়, থাকে 0000। CF = ১, ZF = ১, PF = ১। দুটি ঋণাত্মক যোগ করে শূন্য এসেছে, যা ঋণাত্মক নয়, তাই OF ও ১।',{op:'ADD',a:'8000',b:'8000',w:16,ph:3,fhl:['CF','ZF','OF'],note:'Ex 8 · ADD AX,BX   AX=8000h BX=8000h'}),
  st('Example 9: ADD AL, BL with both equal to FF. The result is FE with a carry out, so CF is 1. Signed, it is minus 1 plus minus 1 equals minus 2, which is correct, so OF is 0. SF is 1, and FE has seven 1 bits, so PF is 0.',
     'উদাহরণ ৯: ADD AL,BL, দুটিই FF। ফল FE, আর একটি ক্যারি বের হয়, তাই CF = ১। সাইনড হিসেবে −১ যোগ −১ = −২, যা সঠিক, তাই OF = ০। SF = ১, আর FE তে সাতটি ১ বিট, তাই PF = ০।',{op:'ADD',a:'FF',b:'FF',w:8,ph:3,fhl:['CF','OF','PF'],note:'Ex 9 · ADD AL,BL   AL=FFh BL=FFh'}),
  st('Example 10: SUB AX, BX with AX equal to 5 and BX equal to 7. Unsigned, a bigger number is taken from a smaller one, so there is a borrow: CF is 1. The result, FFFE, is minus 2, which is correct signed, so OF is 0, and SF is 1.',
     'উদাহরণ ১০: SUB AX,BX, AX = ৫ আর BX = ৭। আনসাইনড হিসেবে ছোট সংখ্যা থেকে বড় সংখ্যা বিয়োগ হচ্ছে, তাই ধার লাগে: CF = ১। ফল FFFE, অর্থাৎ −২, যা সাইনড হিসেবে সঠিক, তাই OF = ০, আর SF = ১।',{op:'SUB',a:'0005',b:'0007',w:16,ph:3,fhl:['CF','OF','SF'],note:'Ex 10 · SUB AX,BX   AX=0005h BX=0007h'}),
  st('Example 11: SUB AL, BL with AL equal to 80 and BL equal to 01. The result is 7F. No borrow, so CF is 0. But signed, minus 128 minus 1 is minus 129, out of range, and the result came out positive: OF is 1. This is the byte version of Example 5.3.',
     'উদাহরণ ১১: SUB AL,BL, AL = 80 আর BL = 01। ফল 7F। কোনো ধার নেই, তাই CF = ০। কিন্তু সাইনড হিসেবে −১২৮ − ১ = −১২৯, যা পরিসরের বাইরে, আর ফল ধনাত্মক এসেছে: OF = ১। এটি উদাহরণ ৫.৩ এর বাইট রূপ।',{op:'SUB',a:'80',b:'01',w:8,ph:3,fhl:['CF','OF'],note:'Ex 11 · SUB AL,BL   AL=80h BL=01h'}),
  st('Example 12: SUB AX, AX. Any number minus itself is 0. ZF and PF are 1, and CF, SF and OF are all 0. This is a common way to clear a register and the flags at the same time.',
     'উদাহরণ ১২: SUB AX,AX। যেকোনো সংখ্যা থেকে নিজেকে বিয়োগ করলে ০। ZF আর PF = ১, আর CF, SF, OF সবই ০। একটি রেজিস্টার আর ফ্ল্যাগ একসাথে শূন্য করার এটি একটি প্রচলিত উপায়।',{op:'SUB',a:'1234',b:'1234',w:16,ph:3,fhl:['ZF','PF'],note:'Ex 12 · SUB AX,AX   AX=1234h'}),
  st('Example 13: CMP AX, BX with AX equal to 10 hex and BX equal to 20 hex. CMP subtracts but does not store the result, so AX keeps 0010. The flags are those of FFF0: CF is 1, because 10 is below 20 unsigned, and SF is 1. F0 has four 1 bits, so PF is 1.',
     'উদাহরণ ১৩: CMP AX,BX, AX = 10h আর BX = 20h। CMP বিয়োগ করে কিন্তু ফল জমা রাখে না, তাই AX এ 0010 ই থাকে। ফ্ল্যাগগুলো হয় FFF0 এর মতো: CF = ১, কারণ আনসাইনড হিসেবে 10 ছোট 20 এর চেয়ে, আর SF = ১। F0 তে চারটি ১ বিট, তাই PF = ১।',{op:'CMP',a:'0010',b:'0020',w:16,ph:3,fhl:['CF','SF','PF'],note:'Ex 13 · CMP AX,BX   AX=0010h BX=0020h'}),
  st('Example 14: CMP AL, BL with both holding 41 hex, the letter A. The difference is 0, so ZF is 1. This is exactly what JE, jump if equal, tests in the next chapter.',
     'উদাহরণ ১৪: CMP AL,BL, দুটিতেই 41h, অর্থাৎ অক্ষর A। পার্থক্য ০, তাই ZF = ১। পরের অধ্যায়ে JE, অর্থাৎ সমান হলে জাম্প, ঠিক এটাই পরীক্ষা করে।',{op:'CMP',a:'41',b:'41',w:8,ph:3,fhl:['ZF'],note:"Ex 14 · CMP AL,BL   AL=BL='A' (41h)"}),
  st('Example 15: INC AX with AX equal to 7FFF. Adding 1 to the largest positive word gives 8000, which reads as minus 32,768. So OF is 1 and SF is 1. CF is unchanged, because INC never touches CF.',
     'উদাহরণ ১৫: INC AX, AX = 7FFF। সবচেয়ে বড় ধনাত্মক ওয়ার্ডে ১ যোগ করলে আসে 8000, যা পড়া হয় −৩২,৭৬৮। তাই OF = ১ আর SF = ১। CF অপরিবর্তিত, কারণ INC কখনো CF ছোঁয় না।',{op:'INC',a:'7FFF',w:16,ph:3,fhl:['OF','SF','CF'],note:'Ex 15 · INC AX   AX=7FFFh'}),
  st('Example 16: DEC AL with AL equal to 80. Subtracting 1 from minus 128 gives 7F, which is plus 127. The sign changed the wrong way, so OF is 1. CF is again unchanged.',
     'উদাহরণ ১৬: DEC AL, AL = 80। −১২৮ থেকে ১ বিয়োগ করলে আসে 7F, অর্থাৎ +১২৭। চিহ্ন ভুলভাবে বদলে গেছে, তাই OF = ১। CF আবারও অপরিবর্তিত।',{op:'DEC',a:'80',w:8,ph:3,fhl:['OF','CF'],note:'Ex 16 · DEC AL   AL=80h'}),
  st('Example 17: DEC AX with AX equal to 1. The result is 0, so ZF is 1 and PF is 1. This is the flag that ends loops built with DEC CX and JNZ.',
     'উদাহরণ ১৭: DEC AX, AX = ১। ফল ০, তাই ZF = ১ আর PF = ১। DEC CX আর JNZ দিয়ে বানানো লুপ এই ফ্ল্যাগ দেখেই শেষ হয়।',{op:'DEC',a:'0001',w:16,ph:3,fhl:['ZF'],note:'Ex 17 · DEC AX   AX=0001h'}),
  st('Example 18: NEG AL with AL equal to 1. The result is FF, which is minus 1. CF is 1, because for NEG, CF is 1 whenever the result is not zero. SF is 1, and FF has eight 1 bits, so PF is 1.',
     'উদাহরণ ১৮: NEG AL, AL = ১। ফল FF, অর্থাৎ −১। CF = ১, কারণ NEG এ ফল শূন্য না হলেই CF = ১। SF = ১, আর FF এ আটটি ১ বিট, তাই PF = ১।',{op:'NEG',a:'01',w:8,ph:3,fhl:['CF','SF','PF'],note:'Ex 18 · NEG AL   AL=01h'}),
  st('Example 19: NEG AX with AX equal to 0. Negating zero gives zero. This is the only case where NEG leaves CF equal to 0. ZF is 1.',
     'উদাহরণ ১৯: NEG AX, AX = ০। শূন্যের চিহ্ন উল্টালে শূন্যই থাকে। এটাই একমাত্র ক্ষেত্র যেখানে NEG এর পরে CF = ০। ZF = ১।',{op:'NEG',a:'0000',w:16,ph:3,fhl:['CF','ZF'],note:'Ex 19 · NEG AX   AX=0000h'}),
  st('Example 20: ADD AX, BX with 1234 plus 4321. The sum is 5555. Nothing unusual: no carry, no overflow, positive and nonzero. The low byte 55 has four 1 bits, so PF is 1.',
     'উদাহরণ ২০: ADD AX,BX, 1234 যোগ 4321। যোগফল 5555। অস্বাভাবিক কিছু নেই: ক্যারি নেই, ওভারফ্লো নেই, ধনাত্মক এবং শূন্য নয়। লো বাইট 55 এ চারটি ১ বিট, তাই PF = ১।',{op:'ADD',a:'1234',b:'4321',w:16,ph:3,fhl:['PF'],note:'Ex 20 · ADD AX,BX   AX=1234h BX=4321h'}),
  st('Example 21: ADD AL, BL with F0 plus E0, which is minus 16 plus minus 32. The result is D0, minus 48, which is correct, so OF is 0. Unsigned, 240 plus 224 does not fit in a byte, so CF is 1. Same bits, two readings: that is the whole lesson of this chapter.',
     'উদাহরণ ২১: ADD AL,BL, F0 যোগ E0, অর্থাৎ −১৬ যোগ −৩২। ফল D0, অর্থাৎ −৪৮, যা সঠিক, তাই OF = ০। আনসাইনড হিসেবে ২৪০ যোগ ২২৪ এক বাইটে আঁটে না, তাই CF = ১। একই বিট, দুই রকম ব্যাখ্যা: এটাই এই অধ্যায়ের মূল শিক্ষা।',{op:'ADD',a:'F0',b:'E0',w:8,ph:3,fhl:['CF','OF'],note:'Ex 21 · ADD AL,BL   AL=F0h BL=E0h'})],'alu')
]});

T('A first jump: display all 256 characters','প্রথম জাম্প: ২৫৬টি অক্ষর দেখানো',
 {type:'code',lines:PGM61,regs:['AH','CX','DL'],flags:['ZF'],out:true},
 [st('Our first jump builds a loop that displays the whole IBM character set of 256 characters. Before the loop, AH is 2 for the display function, CX is 256 as the counter, and DL starts at code 0.',
     'আমাদের প্রথম জাম্প একটি লুপ তৈরি করে, যা আইবিএমের পুরো ২৫৬টি অক্ষর দেখায়। লুপের আগে AH = ২ ডিসপ্লে ফাংশনের জন্য, CX = ২৫৬ কাউন্টার হিসেবে, আর DL শুরু হয় কোড ০ থেকে।',{ln:[6,8],regs:{AH:'02',CX:'0100',DL:'00'}}),
  st('PRINT_LOOP is our first statement label. Labels end with a colon and mark the instruction that follows. Inside the loop, INT 21h displays the character in DL.',
     'PRINT_LOOP হলো আমাদের প্রথম স্টেটমেন্ট লেবেল। লেবেলের শেষে কোলন থাকে, আর এটি পরের ইনস্ট্রাকশনটিকে চিহ্নিত করে। লুপের ভেতরে INT 21h DL এর অক্ষরটি দেখায়।',{ln:[9,10]}),
  st('INC DL moves to the next code, and DEC CX counts down. CX is now FF, not zero, so the zero flag is 0.',
     'INC DL পরের কোডে যায়, আর DEC CX গণনা কমায়। CX এখন FF, শূন্য নয়, তাই জিরো ফ্ল্যাগ ০।',{ln:[11,12],regs:{DL:'01',CX:'00FF'},flags:{ZF:'0'}}),
  st('JNZ means jump if not zero. It checks the zero flag set by DEC CX. ZF is 0, so control jumps back to PRINT_LOOP.',
     'JNZ মানে জিরো না হলে জাম্প করো। এটি DEC CX এর সেট করা জিরো ফ্ল্যাগ পরীক্ষা করে। ZF = ০, তাই নিয়ন্ত্রণ ফিরে যায় PRINT_LOOP এ।',{ln:13,fhl:['ZF'],note:'ZF = 0 → jump to PRINT_LOOP'}),
  st('The loop repeats. After 65 passes, DL reaches 41 hex, and the screen has shown the codes so far, including the letter A. Codes 32 to 127 are standard ASCII; the rest are graphics characters.',
     'লুপ চলতে থাকে। ৬৫ বার ঘোরার পর DL পৌঁছায় 41h এ, আর স্ক্রিনে এ পর্যন্ত সব কোড দেখা গেছে, A অক্ষরসহ। ৩২ থেকে ১২৭ পর্যন্ত সাধারণ ASCII, বাকিগুলো গ্রাফিক্স অক্ষর।',{ln:10,regs:{DL:'41',CX:'00BF'},out:'☺☻♥♦♣♠•◘○◙♂♀♪♫☼►◄↕‼¶§▬↨↑↓→←∟↔▲▼ !"#$%&\'()*+,-./0123456789:;<=>?@A'}),
  st('Finally DEC CX makes CX zero, so ZF becomes 1. JNZ does not jump, and control falls through to the DOS exit.',
