  st('MOV AH, 4C hex and INT 21h return control to DOS.',
     'MOV AH,4Ch আর INT 21h নিয়ন্ত্রণ ডসের কাছে ফিরিয়ে দেয়।',{ln:[15,16],regs:{AH:'4C'}})]),

T('Conditional jumps and CMP','কন্ডিশনাল জাম্প ও CMP',
 {type:'code',lines:['    CMP AX,BX       ;AX = 7FFFh, BX = 0001h','    JG  BELOW       ;jump if greater (signed)','    MOV CX,0        ;skipped when the jump is taken','    ...','BELOW:','    MOV DX,1'],regs:['AX','BX','IP'],flags:['ZF','SF','OF','CF'],init:{AX:'7FFF',BX:'0001',IP:'0100'}},
 [st('A conditional jump has the form J x x x, destination label. If the condition is true, the next instruction is the one at the label. If it is false, the next instruction in line runs.',
     'কন্ডিশনাল জাম্পের রূপ Jxxx লেবেল। শর্ত সত্য হলে পরের ইনস্ট্রাকশন হয় লেবেলের ইনস্ট্রাকশনটি। মিথ্যা হলে লাইনের পরের ইনস্ট্রাকশনটি চলে।',{ln:2}),
  st('The condition usually comes from CMP, placed just before the jump. CMP computes destination minus source but does not store the result. Only the flags change.',
     'শর্তটি সাধারণত আসে জাম্পের ঠিক আগে রাখা CMP থেকে। CMP ডেস্টিনেশন থেকে সোর্স বিয়োগ করে, কিন্তু ফল জমা রাখে না। শুধু ফ্ল্যাগ বদলায়।',{ln:1,regs:{IP:'0102'}}),
  st('7FFF minus 1 is 7FFE: not zero, positive, no overflow, no borrow. So ZF, SF, OF and CF are all 0.',
     '7FFF − 1 = 7FFE: শূন্য নয়, ধনাত্মক, ওভারফ্লো নেই, ধারও নেই। তাই ZF, SF, OF, CF সবই ০।',{ln:1,flags:{ZF:'0',SF:'0',OF:'0',CF:'0'},fhl:['ZF','SF','OF','CF'],note:'7FFFh − 0001h = 7FFEh (not stored)'}),
  st('JG, jump if greater, needs ZF equal to 0 and SF equal to OF. Both hold, so the CPU loads IP with the address of BELOW, and the instruction there runs next.',
     'JG, অর্থাৎ বড় হলে জাম্প, এর জন্য দরকার ZF = ০ এবং SF = OF। দুটোই সত্য, তাই সিপিইউ IP তে BELOW এর অ্যাড্রেস বসায়, আর সেখানকার ইনস্ট্রাকশন পরে চলে।',{ln:[5,6],regs:{IP:'010A'},rhl:['IP'],note:'JG: ZF = 0 and SF = OF → taken'}),
  st('You rarely need to think about the flags. Just read the mnemonic: JG means jump if greater. The jumps themselves never change the flags. One limit: the label must be within 126 bytes before or 127 bytes after the jump.',
     'সাধারণত ফ্ল্যাগ নিয়ে ভাবতে হয় না। শুধু নামটি পড়ো: JG মানে বড় হলে জাম্প। জাম্প নিজে কখনো ফ্ল্যাগ বদলায় না। একটি সীমা আছে: লেবেলটি জাম্পের ১২৬ বাইট আগে বা ১২৭ বাইট পরের মধ্যে থাকতে হবে।',{ln:2,note:'range: −126 … +127 bytes'})],'jump'),

 [st('Conditional jumps come in three groups. Signed jumps are for signed interpretations, and they test ZF, SF and OF. Greater and less are signed words.',

  st('Unsigned jumps test ZF and CF. Above and below are the unsigned words. Many jumps have two names, such as JG and JNLE, that produce exactly the same machine code.',

  st('Single-flag jumps test one flag. JE and JZ jump when ZF is 1; JC on carry, JO on overflow, JS on a negative sign, JP on even parity.',

     'এগুলো এক্সটেন্ডেড ASCII অক্ষর, কোড 80h থেকে FFh, তাই আনসাইনড জাম্প লাগবে। JNBE, অর্থাৎ ছোট বা সমান না হলে জাম্প, AL বড় হলে ELSE এ যায়।',{hl:['c','f'],on:['ef'],ln:4}),
  st('If AL is below or equal, we fall into the true branch and move AL into DL.',
     'AL ছোট বা সমান হলে আমরা ট্রু-ব্রাঞ্চে নামি, আর AL কে DL এ রাখি।',{hl:['t'],on:['et'],ln:6}),
  st('Unlike a high-level language, the false branch is not skipped automatically. We must add JMP DISPLAY at the end of the true branch.',
     'হাই-লেভেল ল্যাঙ্গুয়েজের মতো এখানে ফলস-ব্রাঞ্চ নিজে থেকে বাদ যায় না। ট্রু-ব্রাঞ্চের শেষে JMP DISPLAY যোগ করতে হয়।',{hl:['t','d'],on:['e1'],ln:7,note:'JMP skips the false branch'}),
  st('Both paths meet at DISPLAY. The label is ELSE with an underscore, because ELSE is a reserved word.',
     'দুটি পথই DISPLAY এ মিলিত হয়। লেবেলটি ELSE_ লেখা হয়েছে আন্ডারস্কোরসহ, কারণ ELSE একটি সংরক্ষিত শব্দ।',{hl:['f','d'],on:['e2','e1'],ln:[8,11]})]),

T('CASE: multiway branch','CASE: বহুমুখী শাখা',
 {type:'split',a:fl({nodes:[
   {id:'c',x:170,y:15,w:260,h:120,shape:'dia',l:'CMP AX,0',mono:true,fs:21},
   {id:'n',x:10,y:220,w:180,h:80,l:'BX = −1',mono:true},
   {id:'z',x:210,y:220,w:180,h:80,l:'BX = 0',mono:true},
   {id:'p',x:410,y:220,w:180,h:80,l:'BX = 1',mono:true},
   {id:'e',x:200,y:420,w:200,h:60,shape:'pill',l:'END_CASE',fs:20}],
   edges:[{id:'en',a:'c:l',b:'n:t',l:'< 0'},{id:'ez',a:'c:b',b:'z:t',l:'= 0',lx:330,ly:185},{id:'ep',a:'c:r',b:'p:t',l:'> 0'},{id:'x1',a:'n:b',b:'e:l'},{id:'x2',a:'z:b',b:'e:t'},{id:'x3',a:'p:b',b:'e:r'}]}),
  b:{type:'code',lines:[';case AX','    CMP AX,0        ;test AX','    JL  NEGATIVE    ;AX < 0','    JE  ZERO        ;AX = 0','    JG  POSITIVE    ;AX > 0','NEGATIVE:','    MOV BX,-1       ;put -1 in BX','    JMP END_CASE    ;and exit','ZERO:','    MOV BX,0        ;put 0 in BX','    JMP END_CASE    ;and exit','POSITIVE:','    MOV BX,1        ;put 1 in BX','END_CASE:']}},
 [st('A CASE tests a register or expression for particular values and branches to the matching statements. Example 6.4 puts the sign of AX into BX: minus 1, 0 or 1.',
     'CASE একটি রেজিস্টার বা এক্সপ্রেশনের নির্দিষ্ট মান পরীক্ষা করে, আর মিলে যাওয়া স্টেটমেন্টে যায়। উদাহরণ ৬.৪ AX এর চিহ্ন BX এ রাখে: −১, ০ অথবা ১।',{hl:['c'],ln:2}),
  st('Only one CMP is needed, because jump instructions do not change the flags. Three jumps read the same flags: JL, JE and JG.',
     'মাত্র একটি CMP যথেষ্ট, কারণ জাম্প ইনস্ট্রাকশন ফ্ল্যাগ বদলায় না। তিনটি জাম্প একই ফ্ল্যাগ পড়ে: JL, JE আর JG।',{hl:['c'],on:['en','ez','ep'],ln:[3,5]}),
  st('If AX is negative, we put minus 1 in BX, then JMP END_CASE so the following branches are skipped.',
     'AX ঋণাত্মক হলে BX এ −১ রাখি, তারপর JMP END_CASE, যাতে পরের শাখাগুলো বাদ যায়।',{hl:['n','e'],on:['en','x1'],ln:[6,8]}),
  st('The zero branch works the same way, and also ends with JMP END_CASE.',
     'জিরো শাখাও একইভাবে কাজ করে, আর শেষে JMP END_CASE থাকে।',{hl:['z','e'],on:['ez','x2'],ln:[9,11]}),
  st('The positive branch is last, so it needs no jump: it simply falls through to END_CASE.',
     'পজিটিভ শাখা সবার শেষে, তাই এর কোনো জাম্প লাগে না: এটি সোজা নিচে নেমে END_CASE এ পৌঁছায়।',{hl:['p','e'],on:['ep','x3'],ln:[12,14]})]),

T('Compound condition: AND','যৌগিক শর্ত: AND',
 {type:'split',a:fl({nodes:[
   {id:'c1',x:120,y:10,w:300,h:120,shape:'dia',l:"char >= 'A' ?",fs:21},
   {id:'c2',x:120,y:170,w:300,h:120,shape:'dia',l:"char <= 'Z' ?",fs:21},
   {id:'d',x:150,y:330,w:240,h:70,l:'display char'},
   {id:'e',x:170,y:445,w:200,h:56,shape:'pill',l:'END_IF',fs:20}],
   edges:[{id:'t1',a:'c1:b',b:'c2:t',l:'true',lx:300,ly:158},{id:'t2',a:'c2:b',b:'d:t',l:'true',lx:300,ly:318},{id:'d1',a:'d:b',b:'e:t'},
    {id:'f1',a:'c1:r',b:'e:r',via:[[540,70],[540,473]],l:'false',lx:560,ly:260},{id:'f2',a:'c2:r',b:'e:r',via:[[540,230],[540,473]]}]}),
  b:{type:'code',lines:[';read a character','    MOV AH,1        ;prepare to read','    INT 21H         ;char in AL',";if ('A' <= char) and (char <= 'Z')","    CMP AL,'A'      ;char >= 'A'?",'    JNGE END_IF     ;no, exit',"    CMP AL,'Z'      ;char <= 'Z'?",'    JNLE END_IF     ;no, exit',';then display char','    MOV DL,AL       ;get char','    MOV AH,2        ;prepare to display','    INT 21H         ;display char','END_IF:']}},
 [st('An AND condition is true only when both parts are true. Example 6.6 reads a character and displays it only if it is an uppercase letter, between A and Z.',
     'AND শর্ত সত্য হয় শুধু যখন দুটি অংশই সত্য। উদাহরণ ৬.৬ একটি অক্ষর পড়ে, আর সেটি বড় হাতের অক্ষর হলে, অর্থাৎ A থেকে Z এর মধ্যে হলে, দেখায়।',{ln:[1,4]}),
  st('First test whether the character is at least A. If not, the whole AND is already false, so jump out to END_IF.',
     'প্রথমে দেখি অক্ষরটি অন্তত A কিনা। না হলে পুরো AND ইতিমধ্যেই মিথ্যা, তাই END_IF এ বেরিয়ে যাই।',{hl:['c1','e'],on:['f1'],ln:[5,6]}),
  st('If it passes, we still must check that it is at most Z. Failing this also jumps out.',
     'প্রথম পরীক্ষায় পাস করলেও দেখতে হবে এটি Z এর বেশি নয়। এখানে ফেল করলেও বেরিয়ে যাই।',{hl:['c2','e'],on:['t1','f2'],ln:[7,8]}),
  st('Only when both tests pass do we reach the display code. JNGE and JNLE are signed jumps, which is safe here because standard ASCII codes are all below 80 hex.',
     'দুটি পরীক্ষাতেই পাস করলে তবেই আমরা ডিসপ্লে কোডে পৌঁছাই। JNGE আর JNLE সাইনড জাম্প, যা এখানে নিরাপদ, কারণ সাধারণ ASCII কোড সব 80h এর নিচে।',{hl:['d'],on:['t1','t2','d1'],ln:[10,12]}),
  st('Rule for AND: jump out of the structure as soon as any part fails.',
     'AND এর নিয়ম: যেকোনো অংশ ব্যর্থ হলেই সাথে সাথে কাঠামো থেকে বেরিয়ে যাও।',{hl:['c1','c2'],on:['f1','f2'],note:'AND: each failing test jumps OUT'})]),

T('Compound condition: OR','যৌগিক শর্ত: OR',
 {type:'split',a:fl({nodes:[
   {id:'c1',x:20,y:10,w:300,h:120,shape:'dia',l:"char = 'y' ?",fs:21},
   {id:'c2',x:20,y:180,w:300,h:120,shape:'dia',l:"char = 'Y' ?",fs:21},
   {id:'th',x:380,y:110,w:200,h:90,l:'THEN',s:'display it'},
   {id:'el',x:60,y:380,w:220,h:90,l:'ELSE_',s:'exit to DOS'}],
   edges:[{id:'y1',a:'c1:r',b:'th:t',l:'true'},{id:'y2',a:'c2:r',b:'th:b',l:'true'},{id:'n1',a:'c1:b',b:'c2:t',l:'false',lx:210,ly:160},{id:'n2',a:'c2:b',b:'el:t',l:'false',lx:210,ly:345}]}),
  b:{type:'code',lines:['    MOV AH,1        ;prepare to read','    INT 21H         ;char in AL',"    CMP AL,'y'      ;char = 'y'?",'    JE  THEN        ;yes, go to display it',"    CMP AL,'Y'      ;char = 'Y'?",'    JE  THEN        ;yes, go to display it','    JMP ELSE_       ;no, terminate','THEN:','    MOV AH,2        ;prepare to display','    MOV DL,AL       ;get char','    INT 21H         ;display it','    JMP END_IF      ;and exit','ELSE_:','    MOV AH,4CH','    INT 21H         ;DOS exit','END_IF:']}},
 [st('An OR condition is true if at least one part is true. Example 6.7 reads a character; if it is a lowercase or uppercase y, display it, otherwise end the program.',
     'OR শর্ত সত্য হয় অন্তত একটি অংশ সত্য হলে। উদাহরণ ৬.৭ একটি অক্ষর পড়ে; সেটি ছোট বা বড় হাতের y হলে দেখায়, নাহলে প্রোগ্রাম শেষ করে।',{ln:[1,2]}),
  st('First test for a lowercase y. If it matches, the OR is already true, so jump into THEN.',
     'প্রথমে ছোট হাতের y পরীক্ষা করি। মিলে গেলে OR ইতিমধ্যেই সত্য, তাই THEN এ জাম্প করি।',{hl:['c1','th'],on:['y1'],ln:[3,4]}),
  st('If not, there is still a chance: test for an uppercase Y. A match also jumps into THEN.',
     'না মিললেও সুযোগ আছে: বড় হাতের Y পরীক্ষা করি। মিলে গেলে এটিও THEN এ জাম্প করে।',{hl:['c2','th'],on:['n1','y2'],ln:[5,6]}),
  st('Only when both tests fail do we JMP to ELSE, which returns to DOS. THEN is allowed as a label, but ELSE is reserved, hence the underscore.',
     'দুটি পরীক্ষাই ব্যর্থ হলে তবেই JMP দিয়ে ELSE_ এ যাই, যা ডসে ফিরে যায়। THEN লেবেল হিসেবে চলে, কিন্তু ELSE সংরক্ষিত, তাই আন্ডারস্কোর।',{hl:['el'],on:['n1','n2'],ln:[7,15]}),
  st('Rule for OR: jump into the true branch as soon as any part succeeds. It is the mirror image of the AND rule.',
     'OR এর নিয়ম: যেকোনো অংশ সফল হলেই সাথে সাথে ট্রু-ব্রাঞ্চে জাম্প করো। এটি AND নিয়মের ঠিক উল্টো।',{hl:['c1','c2','th'],on:['y1','y2'],note:'OR: each succeeding test jumps IN'})]),

T('FOR loop with LOOP','LOOP দিয়ে FOR লুপ',
 {type:'code',lines:['    MOV CX,80       ;number of stars to display','    MOV AH,2        ;display character function',"    MOV DL,'*'      ;character to display",'TOP:','    INT 21H         ;display a star','    LOOP TOP        ;repeat 80 times',';--- safe version: skip if CX = 0 ---','    JCXZ SKIP','TOP2:','    ;body of the loop','    LOOP TOP2','SKIP:'],regs:['CX','AH','DL'],out:true},
 [st('A FOR loop runs a known number of times. The LOOP instruction makes it easy: CX is the counter. LOOP decrements CX, and if CX is not zero, jumps back to the label.',
     'FOR লুপ নির্দিষ্ট সংখ্যক বার চলে। LOOP ইনস্ট্রাকশন এটি সহজ করে দেয়: CX হলো কাউন্টার। LOOP প্রথমে CX এক কমায়, আর CX শূন্য না হলে লেবেলে ফিরে যায়।',{ln:6}),
  st('Example 6.8 displays a row of 80 stars. CX gets 80, AH gets 2, and DL gets the star character.',
     'উদাহরণ ৬.৮ ৮০টি তারার একটি সারি দেখায়। CX এ ৮০, AH এ ২, আর DL এ তারা চিহ্ন রাখি।',{ln:[1,3],regs:{CX:'0050',AH:'02',DL:"'*'"}}),
  st('The first pass displays one star. LOOP decrements CX to 79, which is not zero, so it jumps back to TOP.',
     'প্রথমবার একটি তারা দেখা যায়। LOOP CX কমিয়ে ৭৯ করে, যা শূন্য নয়, তাই TOP এ ফিরে যায়।',{ln:[5,6],regs:{CX:'004F'},out:'*'}),
  st('Pass after pass, the stars build up. When LOOP decrements CX to zero, control falls through to the next instruction.',
     'বারবার ঘুরে তারার সারি বাড়তে থাকে। যখন LOOP CX কমিয়ে শূন্য করে, নিয়ন্ত্রণ নিচের ইনস্ট্রাকশনে চলে যায়।',{ln:[5,6],regs:{CX:'0000'},out:'*'.repeat(80)}),
  st('A FOR loop built this way always runs at least once. If CX is 0 on entry, LOOP turns it into FFFF and the loop runs 65,535 more times! JCXZ, jump if CX is zero, placed before the loop, bypasses it safely.',
     'এভাবে তৈরি FOR লুপ অন্তত একবার চলবেই। ঢোকার সময় CX = ০ হলে LOOP একে FFFF বানায়, আর লুপ আরও ৬৫,৫৩৫ বার চলে! লুপের আগে JCXZ, অর্থাৎ CX শূন্য হলে জাম্প, রাখলে নিরাপদে লুপ এড়ানো যায়।',{ln:[8,12],regs:{CX:'0000'},note:'CX = 0 → LOOP makes FFFFh → 65,535 extra passes'})]),

T('WHILE loop','WHILE লুপ',
 {type:'split',a:fl({nodes:[
   {id:'r',x:150,y:10,w:220,h:66,l:'read a char',fs:20},
   {id:'c',x:120,y:120,w:280,h:130,shape:'dia',l:'char ≠ CR ?',fs:22},
   {id:'b',x:140,y:310,w:240,h:90,l:'count = count + 1',s:'read a char',fs:20},
   {id:'e',x:430,y:155,w:160,h:60,shape:'pill',l:'END_WHILE',fs:18}],
   edges:[{id:'e0',a:'r:b',b:'c:t'},{id:'et',a:'c:b',b:'b:t',l:'true',lx:300,ly:290},{id:'lp',a:'b:l',b:'c:l',via:[[50,355],[50,185]],l:'JMP',lx:30,ly:270},{id:'ef',a:'c:r',b:'e:l',l:'false',ly:175}]}),
  b:{type:'code',lines:['    MOV DX,0        ;DX counts characters','    MOV AH,1        ;prepare to read','    INT 21H         ;character in AL','WHILE_:','    CMP AL,0DH      ;CR?','    JE  END_WHILE   ;yes, exit','    INC DX          ;not CR, increment count','    INT 21H         ;read a character','    JMP WHILE_      ;loop back','END_WHILE:'],regs:['AL','DX'],out:true}},
 [st('A WHILE loop checks its condition at the top. If the condition is false from the start, the body never runs. Example 6.9 counts the characters typed on a line.',
     'WHILE লুপ শুরুতেই শর্ত পরীক্ষা করে। শুরুতেই শর্ত মিথ্যা হলে বডি একবারও চলে না। উদাহরণ ৬.৯ এক লাইনে টাইপ করা অক্ষর গোনে।',{hl:['c']}),
  st('Because the test is at the top, a character must be read before entering the loop. The user types H, so AL holds 48 hex. DX starts at 0.',
     'যেহেতু পরীক্ষা শুরুতে, তাই লুপে ঢোকার আগেই একটি অক্ষর পড়তে হয়। ব্যবহারকারী H টাইপ করে, তাই AL এ 48h। DX শুরু ০ থেকে।',{hl:['r'],on:['e0'],ln:[1,3],regs:{DX:'0000',AL:"'H'"},out:'H'}),
  st('H is not a carriage return, so the body runs: DX becomes 1, the next character, I, is read, and JMP goes back to the test.',
     'H ক্যারেজ রিটার্ন নয়, তাই বডি চলে: DX হয় ১, পরের অক্ষর I পড়া হয়, আর JMP আবার পরীক্ষায় ফিরে যায়।',{hl:['c','b'],on:['et','lp'],ln:[5,9],regs:{DX:'0001',AL:"'I'"},out:'HI'}),
  st('Again not a carriage return: DX becomes 2, and this time the user presses Enter, so AL holds 0D hex.',
     'আবারও ক্যারেজ রিটার্ন নয়: DX হয় ২, আর এবার ব্যবহারকারী এন্টার চাপে, তাই AL এ 0Dh।',{hl:['c','b'],on:['et','lp'],ln:[7,9],regs:{DX:'0002',AL:'0D'},out:'HI\n'}),
  st('Now the test finds a carriage return, and JE exits to END_WHILE with the count, 2, in DX. A WHILE loop needs two jumps: a conditional one at the top and a JMP at the bottom.',
     'এবার পরীক্ষায় ক্যারেজ রিটার্ন পাওয়া যায়, আর JE গণনা ২ নিয়ে END_WHILE এ বেরিয়ে যায়। WHILE লুপে দুটি জাম্প লাগে: শুরুতে একটি কন্ডিশনাল, আর শেষে একটি JMP।',{hl:['c','e'],on:['ef'],ln:[5,6],rhl:['DX'],note:'DX = 2 characters'})]),

T('REPEAT loop','REPEAT লুপ',
 {type:'split',a:fl({nodes:[
   {id:'b',x:170,y:30,w:260,h:80,l:'read a char',fs:22},
   {id:'c',x:130,y:180,w:340,h:140,shape:'dia',l:'char = blank ?',fs:22},
   {id:'e',x:200,y:420,w:200,h:60,shape:'pill',l:'done',fs:20}],
   edges:[{id:'e0',a:'b:b',b:'c:t'},{id:'lp',a:'c:l',b:'b:l',via:[[50,250],[50,70]],l:'false',lx:40,ly:160},{id:'et',a:'c:b',b:'e:t',l:'true',lx:330,ly:375}]}),
  b:{type:'code',lines:['    MOV AH,1        ;prepare to read','REPEAT:','    INT 21H         ;char in AL',';until',"    CMP AL,' '      ;a blank?",'    JNE REPEAT      ;no, keep reading'],regs:['AL'],out:true}},
 [st('In a REPEAT, UNTIL loop the statements run first, and then the condition is checked. Because the test is at the bottom, the body always runs at least once.',
     'REPEAT-UNTIL লুপে আগে স্টেটমেন্ট চলে, তারপর শর্ত পরীক্ষা হয়। যেহেতু পরীক্ষা শেষে, তাই বডি অন্তত একবার চলবেই।',{hl:['b','c']}),
  st('Example 6.10 reads characters until a blank is read. The first key is A.',
     'উদাহরণ ৬.১০ একটি ফাঁকা স্থান পড়া পর্যন্ত অক্ষর পড়তে থাকে। প্রথম কী হলো A।',{hl:['b'],on:['e0'],ln:[2,3],regs:{AL:"'A'"},out:'A'}),
  st('A is not a blank, so JNE jumps back to REPEAT and another key is read.',
     'A ফাঁকা নয়, তাই JNE আবার REPEAT এ ফিরে যায়, আর আরেকটি কী পড়া হয়।',{hl:['c','b'],on:['lp'],ln:[5,6],regs:{AL:"'B'"},out:'AB'}),
  st('When the user types a blank, the comparison is equal, JNE falls through, and the loop ends.',
     'ব্যবহারকারী ফাঁকা স্থান দিলে তুলনা সমান হয়, JNE জাম্প না করে নিচে নামে, আর লুপ শেষ হয়।',{hl:['c','e'],on:['et'],ln:[5,6],regs:{AL:"' '"},out:'AB '}),
  st('WHILE or REPEAT? A REPEAT is a little shorter, with only one jump. Use WHILE when zero passes must be possible, and REPEAT when at least one pass is always correct.',
     'WHILE নাকি REPEAT? REPEAT একটু ছোট, এতে মাত্র একটি জাম্প। শূন্যবার চলার সম্ভাবনা থাকলে WHILE, আর অন্তত একবার চলা সবসময় ঠিক হলে REPEAT ব্যবহার করো।',{note:'WHILE: 0+ passes · REPEAT: 1+ passes'})]),

T('Top-down program: first and last capitals','টপ-ডাউন প্রোগ্রাম: প্রথম ও শেষ বড় হাতের অক্ষর',
 {type:'code',lines:PGM62,regs:['AL','FIRST','LAST'],init:{FIRST:'?',LAST:'?'},out:true},
 [st('The task: read a line of text, then display the capital letter that comes first alphabetically and the one that comes last. Top-down design splits it into three steps: display a prompt, read and process the line, display the results.',
     'কাজটি হলো: এক লাইন টেক্সট পড়া, তারপর বর্ণানুক্রমে প্রথম আর শেষ বড় হাতের অক্ষর দেখানো। টপ-ডাউন ডিজাইনে এটি তিন ধাপে ভাগ হয়: প্রম্পট দেখানো, লাইন পড়ে প্রক্রিয়া করা, ফল দেখানো।',{ln:[1,7]}),
  st('Step one displays the prompt with function 9. The 0D and 0A at the end of the prompt move the cursor to the next line.',
     'প্রথম ধাপে ফাংশন ৯ দিয়ে প্রম্পট দেখানো হয়। প্রম্পটের শেষের 0D আর 0A কার্সরকে পরের লাইনে নিয়ে যায়।',{ln:[9,13],out:'Type a line of text\n'}),
  st('FIRST and LAST need starting values. FIRST starts as the closing bracket, which follows Z in ASCII, and LAST starts as the at sign, which precedes A. So the first capital typed will replace both.',
     'FIRST আর LAST এর শুরুর মান দরকার। FIRST শুরু হয় ] দিয়ে, যা ASCII তে Z এর পরে আসে, আর LAST শুরু হয় @ দিয়ে, যা A এর আগে আসে। তাই প্রথম যে বড় হাতের অক্ষর টাইপ হবে, সেটি দুটোকেই প্রতিস্থাপন করবে।',{ln:[5,7],regs:{FIRST:"']'",LAST:"'@'"}}),
  st('Step two is a WHILE loop. The first character, T, is read. It is a capital, which is an AND test, and it is below the bracket and above the at sign, so FIRST and LAST both become T.',
     'দ্বিতীয় ধাপ একটি WHILE লুপ। প্রথম অক্ষর T পড়া হয়। এটি বড় হাতের অক্ষর, যা একটি AND পরীক্ষা, আর এটি ] এর চেয়ে ছোট ও @ এর চেয়ে বড়, তাই FIRST আর LAST দুটোই হয় T।',{ln:[14,29],regs:{AL:"'T'",FIRST:"'T'",LAST:"'T'"},out:'Type a line of text\nT'}),
  st('The loop keeps reading. After THE QUICK BROWN, the smallest capital seen is B and the largest is W.',
     'লুপ পড়তে থাকে। THE QUICK BROWN এর পরে সবচেয়ে ছোট বড় হাতের অক্ষর B, আর সবচেয়ে বড় W।',{ln:[31,32],regs:{AL:"'N'",FIRST:"'B'",LAST:"'W'"},out:'Type a line of text\nTHE QUICK BROWN'}),
  st('After FOX JUMPED, X beats W for last place. The carriage return then ends the WHILE loop.',
     'FOX JUMPED এর পরে শেষ স্থানে W কে হারিয়ে X আসে। তারপর ক্যারেজ রিটার্ন WHILE লুপ শেষ করে।',{ln:[17,18],regs:{AL:'0D',FIRST:"'B'",LAST:"'X'"},out:'Type a line of text\nTHE QUICK BROWN FOX JUMPED.'}),
  st('Step three: FIRST is no longer the bracket, so capitals were found. CAP_MSG, FIRST, the middle text and LAST are consecutive in memory, so one INT 21h call prints them all.',
     'তৃতীয় ধাপ: FIRST আর ] নেই, তাই বড় হাতের অক্ষর পাওয়া গেছে। CAP_MSG, FIRST, মাঝের লেখা আর LAST মেমোরিতে পরপর আছে, তাই একটি INT 21h কলেই সব প্রিন্ট হয়।',{ln:[34,42],out:'Type a line of text\nTHE QUICK BROWN FOX JUMPED.\nFirst capital = B Last capital = X'}),
  st('If no capitals are typed, FIRST still holds the bracket, and the program prints No capitals instead. Try it in EMU8086 with different lines.',
     'কোনো বড় হাতের অক্ষর না দিলে FIRST এ ] থেকে যায়, আর প্রোগ্রাম No capitals দেখায়। EMU8086 এ বিভিন্ন লাইন দিয়ে চেষ্টা করে দেখো।',{ln:[35,38],note:"FIRST = ']' → 'No capitals'"})])
]});
</script>
<script>
"use strict";
/* ===================== CHAPTER 7 ===================== */
CH.push({n:7,t:{en:'Logic, Shift and Rotate Instructions',bn:'লজিক, শিফট ও রোটেট ইনস্ট্রাকশন'},topics:[

T('Truth tables and bitwise logic','ট্রুথ টেবিল ও বিটওয়াইজ লজিক',
 {type:'bits',rows:[{id:'a',label:'operand',n:8,idx:true,show:'h'},{id:'m',label:'mask',n:8,show:'h'},{id:'r',label:'result',n:8,show:'h'}]},
 [st('Logic instructions change the bit pattern of a byte or word, one bit position at a time. Treat 1 as true and 0 as false. AND gives 1 only if both bits are 1; OR if at least one is 1; XOR if the bits are different; NOT flips a bit.',
     'লজিক ইনস্ট্রাকশন একটি বাইট বা ওয়ার্ডের বিট প্যাটার্ন বদলায়, প্রতিটি বিট আলাদাভাবে। ১ কে সত্য আর ০ কে মিথ্যা ধরি। AND ফল ১ দেয় শুধু দুটো বিটই ১ হলে; OR অন্তত একটি ১ হলে; XOR বিট দুটো ভিন্ন হলে; আর NOT বিট উল্টে দেয়।',{rows:{a:'10101010',m:'11110000'},vis:['a','m'],note:'AND: both 1 · OR: any 1 · XOR: different · NOT: flip'}),
  st('10101010 AND 11110000 gives 10100000. Where the mask has 1s, the upper bits are kept; where it has 0s, the lower bits are cleared.',
     '10101010 AND 11110000 = 10100000। মাস্কে যেখানে ১, সেই উপরের বিটগুলো থেকে যায়; যেখানে ০, নিচের বিটগুলো মুছে যায়।',{rows:{r:'10100000'},vis:['a','m','r'],hl:{r:[0,1,2,3]},note:'AND: keep where mask = 1, clear where mask = 0'}),
  st('10101010 OR 11110000 gives 11111010. The upper four bits are forced to 1, and the lower four are unchanged.',
     '10101010 OR 11110000 = 11111010। উপরের চারটি বিট জোর করে ১ হয়, নিচের চারটি অপরিবর্তিত।',{rows:{r:'11111010'},vis:['a','m','r'],hl:{r:[4,5,6,7]},note:'OR: set where mask = 1'}),
  st('10101010 XOR 11110000 gives 01011010. The upper four bits are flipped, and the lower four are unchanged.',
     '10101010 XOR 11110000 = 01011010। উপরের চারটি বিট উল্টে যায়, নিচের চারটি অপরিবর্তিত।',{rows:{r:'01011010'},vis:['a','m','r'],hl:{r:[4,5,6,7]},note:'XOR: flip where mask = 1'}),
  st("NOT 10101010 gives 01010101. Every bit is flipped. This is the one's complement.",
     "NOT 10101010 = 01010101। প্রতিটি বিট উল্টে যায়। এটিই ওয়ান'স কমপ্লিমেন্ট।",{rows:{r:'01010101'},vis:['a','r'],hl:{r:'all'},note:"NOT: one's complement"})]),

T('Masks: clear, set and flip chosen bits','মাস্ক: নির্দিষ্ট বিট মোছা, সেট ও উল্টানো',
 {type:'bits',rows:[{id:'x',label:'AL',n:8,idx:true,show:'h'},{id:'m',label:'mask',n:8,show:'h'},{id:'r',label:'AL after',n:8,show:'h'},
   {id:'dx',label:'DX',n:16,show:'h'},{id:'m16',label:'mask',n:16,show:'h'},{id:'r16',label:'DX after',n:16,show:'h'}]},
 [st('AND, OR and XOR take the form instruction destination, source. The result goes to the destination, a register or memory location. Afterwards SF, ZF and PF reflect the result, while CF and OF are always cleared to 0.',
     'AND, OR, XOR এর রূপ: ইনস্ট্রাকশন ডেস্টিনেশন, সোর্স। ফল যায় ডেস্টিনেশনে, যা একটি রেজিস্টার বা মেমোরি লোকেশন। এর পরে SF, ZF, PF ফল দেখায়, আর CF ও OF সবসময় ০ হয়ে যায়।',{rows:{x:'11010110'},vis:['x'],note:'after AND / OR / XOR: CF = 0, OF = 0'}),
  st('A mask is a source pattern chosen to change exactly the bits we want. AND with 0 clears a bit, OR with 1 sets it, XOR with 1 flips it. A mask bit that leaves a bit alone is 1 for AND, and 0 for OR and XOR.',
     'মাস্ক হলো এমন একটি সোর্স প্যাটার্ন, যা ঠিক যে বিটগুলো চাই সেগুলোই বদলায়। AND এ ০ দিলে বিট মোছে, OR এ ১ দিলে বিট সেট হয়, XOR এ ১ দিলে বিট উল্টায়। কোনো বিট অপরিবর্তিত রাখতে AND এর মাস্কে ১, আর OR ও XOR এর মাস্কে ০।',{vis:['x'],note:'b AND 0 = 0 · b OR 1 = 1 · b XOR 1 = NOT b'}),
  st('Example 7.2: clear the sign bit of AL and keep the rest. Use AND with mask 0111 1111, which is 7F hex.',
     'উদাহরণ ৭.২: AL এর সাইন বিট মুছে বাকিগুলো রাখা। মাস্ক 0111 1111, অর্থাৎ 7Fh দিয়ে AND করি।',{rows:{m:'01111111',r:'01010110'},vis:['x','m','r'],hl:{r:[7]},note:'AND AL,7Fh'}),
  st('Example 7.3: set the most and least significant bits of AL. Use OR with mask 1000 0001, which is 81 hex.',
     'উদাহরণ ৭.৩: AL এর সবচেয়ে বাম আর সবচেয়ে ডান বিট সেট করা। মাস্ক 1000 0001, অর্থাৎ 81h দিয়ে OR করি।',{rows:{m:'10000001',r:'11010111'},vis:['x','m','r'],hl:{r:[7,0]},note:'OR AL,81h'}),
  st('Example 7.4: change the sign bit of DX. XOR with 8000 hex flips bit 15 only. Writing masks in hex avoids typing errors, especially for 16-bit masks.',
     'উদাহরণ ৭.৪: DX এর সাইন বিট উল্টানো। 8000h দিয়ে XOR করলে শুধু বিট ১৫ উল্টায়। মাস্ক হেক্সে লিখলে টাইপের ভুল কমে, বিশেষ করে ১৬ বিটের মাস্কে।',{rows:{dx:'0001001000110100',m16:'1000000000000000',r16:'1001001000110100'},vis:['dx','m16','r16'],hl:{r16:[15]},note:'XOR DX,8000h'})]),

T('Common tasks with logic instructions','লজিক ইনস্ট্রাকশনের সাধারণ ব্যবহার',
 {type:'bits',rows:[{id:'x',label:'AL',n:8,idx:true,show:'hc'},{id:'m',label:'mask',n:8,show:'h'},{id:'r',label:'result',n:8,show:'hc'}]},
 [st("When a key is read, AL gets its ASCII code, not its value. Pressing 5 gives 35 hex. The digit's value is in the low four bits; the high four bits are always 0011.",
     'কী পড়লে AL এ আসে তার ASCII কোড, মান নয়। ৫ চাপলে আসে 35h। অঙ্কের মান থাকে নিচের চারটি বিটে; উপরের চারটি বিট সবসময় 0011।',{rows:{x:'00110101'},vis:['x'],hl:{x:[0,1,2,3]}}),
  st('So AND AL, 0F hex clears the high nibble and leaves the value 5. SUB AL, 30 hex also works, but AND makes it clear that we are changing the bit pattern.',
     'তাই AND AL,0Fh উপরের নিবল মুছে মান ৫ রেখে দেয়। SUB AL,30h ও কাজ করে, তবে AND দিলে বোঝা যায় যে আমরা বিট প্যাটার্ন বদলাচ্ছি।',{rows:{m:'00001111',r:'00000101'},vis:['x','m','r'],note:"AND AL,0Fh : '5' → 5"}),
  st('Lowercase and uppercase letters differ only in bit 5. To convert a to A, clear bit 5 with AND and the mask DF hex. The leading 0 in 0DFh is needed because a hex constant must start with a digit.',
     'ছোট আর বড় হাতের অক্ষরের পার্থক্য শুধু বিট ৫ এ। a কে A বানাতে মাস্ক DFh দিয়ে AND করে বিট ৫ মুছি। 0DFh এর শুরুর ০ দরকার, কারণ হেক্স ধ্রুবক অঙ্ক দিয়ে শুরু হতে হয়।',{rows:{x:'01100001',m:'11011111',r:'01000001'},vis:['x','m','r'],hl:{x:[5],r:[5]},note:"AND DL,0DFh : 'a' → 'A'"}),
  st('To clear a register, XOR AX, AX works because a bit XOR itself is always 0. It is 2 bytes, shorter than MOV AX, 0. A memory location, though, must be cleared with MOV.',
     'রেজিস্টার শূন্য করতে XOR AX,AX কাজ করে, কারণ কোনো বিটকে নিজের সাথে XOR করলে সবসময় ০ হয়। এটি ২ বাইট, MOV AX,0 এর চেয়ে ছোট। তবে মেমোরি লোকেশন MOV দিয়েই শূন্য করতে হয়।',{rows:{x:'10110010',m:'10110010',r:'00000000'},vis:['x','m','r'],note:'XOR AX,AX → 0 (2 bytes)'}),
  st('To test a register for zero, OR CX, CX leaves CX unchanged but sets the flags: ZF is 1 if CX is zero. It can replace CMP CX, 0.',
     'রেজিস্টার শূন্য কিনা পরীক্ষা করতে OR CX,CX, যা CX বদলায় না কিন্তু ফ্ল্যাগ সেট করে: CX শূন্য হলে ZF = ১। এটি CMP CX,0 এর বদলে ব্যবহার করা যায়।',{rows:{x:'00000000',m:'00000000',r:'00000000'},vis:['x','m','r'],note:'OR CX,CX → ZF = 1 if CX = 0'})]),

T('NOT and TEST','NOT ও TEST',
 {type:'bits',rows:[{id:'x',label:'AL',n:8,idx:true,show:'hu'},{id:'m',label:'mask',n:8,show:'h'},{id:'r',label:'AND result',n:8,show:'h'}]},
 [st("NOT destination flips every bit, giving the one's complement. It does not affect any status flag.",
     "NOT ডেস্টিনেশন প্রতিটি বিট উল্টে ওয়ান'স কমপ্লিমেন্ট দেয়। এটি কোনো স্ট্যাটাস ফ্ল্যাগ বদলায় না।",{rows:{x:'00000110',r:'11111001'},vis:['x','r'],note:'NOT AL — flags unchanged'}),
  st('TEST performs an AND, but does not change the destination. Its only purpose is to set the flags.',
     'TEST একটি AND করে, কিন্তু ডেস্টিনেশন বদলায় না। এর একমাত্র কাজ ফ্ল্যাগ সেট করা।',{vis:['x'],note:'TEST = AND without storing'}),
  st('To examine bits, put 1s in the mask where you want to test. Example 7.6: even numbers have 0 in bit 0, so TEST AL, 1 checks whether AL is even. With AL equal to 6, the result is 0, ZF is 1, and JZ jumps.',
     'বিট পরীক্ষা করতে মাস্কে যে স্থানগুলো দেখতে চাই সেখানে ১ রাখি। উদাহরণ ৭.৬: জোড় সংখ্যার বিট ০ সবসময় ০, তাই TEST AL,1 দেখে AL জোড় কিনা। AL = ৬ হলে ফল ০, ZF = ১, আর JZ জাম্প করে।',{rows:{x:'00000110',m:'00000001',r:'00000000'},vis:['x','m','r'],hl:{x:[0]},note:'AL = 6 → result 0 → ZF = 1 → JZ BELOW'}),
  st('With AL equal to 7, bit 0 is 1, the result is 1, ZF is 0, and the jump is not taken.',
     'AL = ৭ হলে বিট ০ এর মান ১, ফল ১, ZF = ০, আর জাম্প হয় না।',{rows:{x:'00000111',r:'00000001'},vis:['x','m','r'],hl:{x:[0],r:[0]},note:'AL = 7 → result 1 → ZF = 0 → no jump'})]),

T('SHL and SAL: shift left','SHL ও SAL: বামে শিফট',
 {type:'bits',cf:true,rows:[{id:'dh',label:'DH',n:8,idx:true,show:'h'},{id:'al',label:'AL',n:8,idx:true,show:'u'}]},
 [st('Shift instructions move bits. A single shift is written SHL destination, 1. For N positions, put N in CL and write SHL destination, CL. In SHL, a 0 enters the rightmost bit, and the most significant bit goes into CF.',
     'শিফট ইনস্ট্রাকশন বিটগুলো সরায়। একবার শিফটের জন্য লিখি SHL ডেস্টিনেশন,1। N ঘর সরাতে CL এ N রেখে লিখি SHL ডেস্টিনেশন,CL। SHL এ ডান দিকে একটি ০ ঢোকে, আর সবচেয়ে বাম বিট যায় CF এ।',{rows:{dh:'10001010'},cf:'0',vis:['dh']}),
  st('Example 7.7: DH is 8A hex and CL is 3. After the first shift, the 1 from the left lands in CF, and DH is 14 hex.',
     'উদাহরণ ৭.৭: DH = 8Ah আর CL = 3। প্রথম শিফটের পর বাম দিকের ১ টি গিয়ে পড়ে CF এ, আর DH হয় 14h।',{op:{id:'dh',t:'SHL'},vis:['dh'],note:'1st shift: CF = 1, DH = 14h'}),
  st('After the second shift, CF is 0 and DH is 28 hex.',
     'দ্বিতীয় শিফটের পর CF = ০ আর DH = 28h।',{op:{id:'dh',t:'SHL'},vis:['dh'],note:'2nd shift: CF = 0, DH = 28h'}),
  st('After the third, DH is 50 hex and CF is 0. Shortcut: erase the leftmost 3 bits and add three 0s on the right. CF holds the last bit pushed out. CL itself is unchanged.',
     'তৃতীয়টির পর DH = 50h আর CF = ০। সহজ উপায়: বাম দিকের ৩টি বিট মুছে ডান দিকে তিনটি ০ বসাও। CF এ থাকে সবশেষে বের হওয়া বিট। CL নিজে বদলায় না।',{op:{id:'dh',t:'SHL'},vis:['dh'],note:'SHL DH,CL (CL = 3) → DH = 50h, CF = 0'}),
  st('A left shift multiplies by 2, just as adding a 0 in decimal multiplies by 10. AL holds 5.',
     'বামে একবার শিফট করলে মান ২ দিয়ে গুণ হয়, যেমন দশমিকে ডানে একটি ০ বসালে ১০ দিয়ে গুণ হয়। AL এ আছে ৫।',{rows:{al:'00000101'},cf:'0',vis:['al']}),
  st('One shift left gives 10.',
     'বামে একবার শিফট করলে হয় ১০।',{op:{id:'al',t:'SHL'},vis:['al'],note:'5 × 2 = 10'}),
  st('Another gives 20. SAL, shift arithmetic left, is the same machine instruction as SHL; we write SAL when we mean multiplication. To multiply AX by 8, write MOV CL, 3 and SAL AX, CL. For a multiple shift, CF and OF only reflect the last shift, so they cannot detect overflow reliably.',
     'আরেকবার করলে হয় ২০। SAL, অর্থাৎ শিফট অ্যারিথমেটিক লেফট, আর SHL একই মেশিন ইনস্ট্রাকশন; গুণ বোঝাতে SAL লিখি। AX কে ৮ দিয়ে গুণ করতে লিখি MOV CL,3 আর SAL AX,CL। একাধিক শিফটে CF আর OF শুধু শেষ শিফটটি দেখায়, তাই এরা ওভারফ্লো ঠিকভাবে ধরতে পারে না।',{op:{id:'al',t:'SAL'},vis:['al'],note:'20 · MOV CL,3 / SAL AX,CL → AX × 8'})],'shift'),

T('SHR and SAR: shift right','SHR ও SAR: ডানে শিফট',
 {type:'bits',cf:true,rows:[{id:'dh',label:'DH',n:8,idx:true,show:'h'},{id:'ax',label:'AX',n:16,show:'u'},{id:'al',label:'AL',n:8,idx:true,show:'s'}]},
 [st('SHR shifts right. A 0 enters the most significant bit, and the rightmost bit goes into CF.',
     'SHR ডানে শিফট করে। সবচেয়ে বাম বিটে একটি ০ ঢোকে, আর সবচেয়ে ডান বিট যায় CF এ।',{rows:{dh:'10001010'},cf:'0',vis:['dh']}),
  st('Example 7.9: DH is 8A hex and CL is 2. Shift right twice.',
     'উদাহরণ ৭.৯: DH = 8Ah আর CL = 2। দুইবার ডানে শিফট করি।',{op:{id:'dh',t:'SHR',c:2},vis:['dh'],note:'SHR DH,CL (CL = 2) → DH = 22h, CF = 1'}),
  st('A right shift divides by 2, rounding down for odd numbers. Example 7.10: to divide the unsigned number 65143 by 4, shift AX right twice.',
     'ডানে শিফট করলে ২ দিয়ে ভাগ হয়, বিজোড় সংখ্যায় নিচের দিকে রাউন্ড হয়। উদাহরণ ৭.১০: আনসাইনড সংখ্যা ৬৫১৪৩ কে ৪ দিয়ে ভাগ করতে AX কে দুইবার ডানে শিফট করি।',{rows:{ax:'1111111001110111'},cf:'0',vis:['ax']}),
  st('AX becomes 16285. The true answer is 16285.75, so the fraction is simply dropped.',
     'AX হয় ১৬২৮৫। সঠিক উত্তর ১৬২৮৫.৭৫, তাই ভগ্নাংশটি বাদ পড়ে।',{op:{id:'ax',t:'SHR',c:2},vis:['ax'],note:'65143 ÷ 4 = 16285 (rounded down)'}),
  st('SHR would break negative numbers, because it pushes a 0 into the sign bit. SAR, shift arithmetic right, copies the old sign bit back in instead. Example 7.11: AL holds minus 15.',
     'SHR ঋণাত্মক সংখ্যা নষ্ট করে দেয়, কারণ এটি সাইন বিটে ০ ঢোকায়। SAR, অর্থাৎ শিফট অ্যারিথমেটিক রাইট, এর বদলে পুরনো সাইন বিটটি আবার বসায়। উদাহরণ ৭.১১: AL এ আছে −১৫।',{rows:{al:'11110001'},cf:'0',vis:['al']}),
  st('After SAR AL, 1, AL is minus 8. Minus 15 divided by 2 is minus 7.5, rounded down to minus 8, and the sign bit was preserved. Use SHR for unsigned and SAR for signed division.',
     'SAR AL,1 এর পরে AL = −৮। −১৫ কে ২ দিয়ে ভাগ করলে −৭.৫, যা নিচের দিকে রাউন্ড হয়ে −৮, আর সাইন বিট রক্ষা পেয়েছে। আনসাইনড ভাগে SHR, সাইনড ভাগে SAR ব্যবহার করো।',{op:{id:'al',t:'SAR'},vis:['al'],hl:{al:[7]},note:'SAR: sign bit copied back in → −15 → −8'})],'shift'),

T('ROL and ROR: rotate','ROL ও ROR: রোটেট',
 {type:'bits',cf:true,rows:[{id:'x',label:'AL',n:8,idx:true,show:'h'}]},
 [st('Rotates are like shifts, except the bit that leaves one end comes back in at the other end. Think of the bits as a circle.',
     'রোটেট অনেকটা শিফটের মতো, তবে এক প্রান্ত দিয়ে যে বিট বের হয়, সেটি অন্য প্রান্ত দিয়ে আবার ঢোকে। বিটগুলোকে একটি বৃত্তের মতো ভাবো।',{rows:{x:'10001010'},cf:'0'}),
  st('ROL rotates left. The most significant bit moves into the rightmost bit, and CF also gets a copy of it.',
     'ROL বামে রোটেট করে। সবচেয়ে বাম বিটটি চলে যায় সবচেয়ে ডানে, আর CF ও এর একটি কপি পায়।',{op:{id:'x',t:'ROL'},note:'ROL AL,1 → 15h, CF = 1'}),
  st('ROR rotates right. The rightmost bit moves into the most significant bit, and also into CF. Rotating back undoes the first rotation.',
     'ROR ডানে রোটেট করে। সবচেয়ে ডান বিটটি চলে যায় সবচেয়ে বামে, আর CF এও যায়। উল্টো দিকে রোটেট করলে আগের রোটেট বাতিল হয়ে যায়।',{op:{id:'x',t:'ROR'},note:'ROR AL,1 → back to 8Ah, CF = 0'}),
  st('Because nothing is lost, rotating a register by its full width brings it back unchanged. Example 7.12 uses this: rotate BX left 16 times, and each time CF holds one bit, so JNC and INC can count the 1 bits without changing BX.',
     'যেহেতু কিছুই হারায় না, রেজিস্টারকে তার পুরো দৈর্ঘ্য পরিমাণ রোটেট করলে আগের মানে ফিরে আসে। উদাহরণ ৭.১২ এটি কাজে লাগায়: BX কে ১৬ বার বামে রোটেট করি, প্রতিবার CF এ একটি বিট আসে, তাই JNC আর INC দিয়ে BX না বদলে ১ বিটগুলো গোনা যায়।',{op:{id:'x',t:'ROL',c:8},note:'8 rotations of AL → original value'})],'shift'),

T('RCL and RCR: rotate through carry','RCL ও RCR: ক্যারির মধ্য দিয়ে রোটেট',
 {type:'bits',cf:true,rows:[{id:'x',label:'DH',n:8,idx:true,show:'h'}]},
 [st('RCL and RCR include CF in the circle. In RCL, the most significant bit goes into CF, and the old CF goes into the rightmost bit. The circle is 9 bits for a byte and 17 for a word.',
     'RCL আর RCR, CF কে বৃত্তের অংশ করে নেয়। RCL এ সবচেয়ে বাম বিট যায় CF এ, আর CF এর পুরনো মান যায় সবচেয়ে ডান বিটে। বাইটের জন্য বৃত্তটি ৯ বিটের, ওয়ার্ডের জন্য ১৭ বিটের।',{rows:{x:'10001010'},cf:'1'}),
  st('Watch RCL once: the left 1 drops into CF, and the old CF, 1, enters on the right.',
     'একবার RCL দেখি: বাম দিকের ১ পড়ে CF এ, আর CF এর পুরনো ১ ঢোকে ডান দিকে।',{op:{id:'x',t:'RCL'},note:'RCL: MSB → CF, old CF → LSB'}),
  st('Example 7.13: DH is 8A hex, CF is 1, and CL is 3. RCR moves the old CF into the most significant bit, and the rightmost bit into CF. After one rotation, DH is C5 hex and CF is 0.',
     'উদাহরণ ৭.১৩: DH = 8Ah, CF = 1, CL = 3। RCR পুরনো CF কে নেয় সবচেয়ে বাম বিটে, আর সবচেয়ে ডান বিটকে নেয় CF এ। একবার রোটেটের পর DH = C5h আর CF = ০।',{rows:{x:'10001010'},cf:'1',op:{id:'x',t:'RCR'},note:'1: DH = C5h, CF = 0'}),
  st('After two rotations, DH is 62 hex and CF is 1.',
     'দুইবার রোটেটের পর DH = 62h আর CF = ১।',{op:{id:'x',t:'RCR'},note:'2: DH = 62h, CF = 1'}),
  st('After three, DH is B1 hex and CF is 0. All shifts and rotates set SF, PF and ZF from the result, put the last bit out in CF, and set OF if the sign changed on the last rotation.',
     'তিনবার পর DH = B1h আর CF = ০। সব শিফট আর রোটেট ফলাফল অনুযায়ী SF, PF, ZF সেট করে, শেষে বের হওয়া বিট CF এ রাখে, আর শেষ রোটেটে চিহ্ন বদলালে OF সেট করে।',{op:{id:'x',t:'RCR'},note:'RCR DH,CL (CL = 3) → DH = B1h, CF = 0'})],'shift'),

T('Application: reversing a bit pattern','প্রয়োগ: বিট প্যাটার্ন উল্টানো',
 {type:'bits',cf:true,cfRow:'al',rows:[{id:'al',label:'AL',n:8,idx:true,show:'h'},{id:'bl',label:'BL',n:8,show:'h'}]},
 [st('Goal: turn AL equal to 1101 1100 into its mirror image, 0011 1011. The idea is to move bits out of the left end of AL with SHL, and into the left end of BL with RCR.',
     'লক্ষ্য: AL = 1101 1100 কে তার আয়নার প্রতিবিম্ব 0011 1011 এ রূপান্তর করা। ধারণা হলো SHL দিয়ে AL এর বাম প্রান্ত থেকে বিট বের করা, আর RCR দিয়ে BL এর বাম প্রান্তে ঢোকানো।',{rows:{al:'11011100',bl:'00000000'},cf:'0'}),
  st('First pass: SHL AL, 1 drops bit 7 into CF. RCR BL, 1 then pushes that bit into the left end of BL.',
     'প্রথমবার: SHL AL,1 বিট ৭ কে CF এ ফেলে। তারপর RCR BL,1 সেই বিটকে BL এর বাম প্রান্তে ঠেলে দেয়।',{op:[{id:'al',t:'SHL'},{id:'bl',t:'RCR'}]}),
  st('Second pass: the next bit of AL travels the same way, and the first bit moves one place right inside BL.',
     'দ্বিতীয়বার: AL এর পরের বিটটিও একই পথে যায়, আর প্রথম বিটটি BL এর ভেতরে এক ঘর ডানে সরে।',{op:[{id:'al',t:'SHL'},{id:'bl',t:'RCR'}]}),
  st('LOOP repeats this 8 times in all. The first bit taken from AL ends up at the right end of BL, so BL holds the reversed pattern. Finally MOV AL, BL.',
     'LOOP মোট ৮ বার এটি করে। AL থেকে প্রথম যে বিটটি নেওয়া হয়েছিল সেটি BL এর ডান প্রান্তে গিয়ে পৌঁছায়, তাই BL এ উল্টানো প্যাটার্ন থাকে। শেষে MOV AL,BL।',{op:[{id:'al',t:'SHL'},{id:'bl',t:'RCR'},{id:'al',t:'SHL'},{id:'bl',t:'RCR'},{id:'al',t:'SHL'},{id:'bl',t:'RCR'},{id:'al',t:'SHL'},{id:'bl',t:'RCR'},{id:'al',t:'SHL'},{id:'bl',t:'RCR'},{id:'al',t:'SHL'},{id:'bl',t:'RCR'}],note:'BL = 0011 1011 = 3Bh'})],'shift'),

T('Binary and hex input','বাইনারি ও হেক্স ইনপুট',
 {type:'bits',rows:[{id:'bx',label:'BX',n:16,idx:true,nib:true,show:'h'}]},
 [st('To read a hex number, we collect its digits in BX. Each hex digit is 4 bits, so before inserting a new digit, BX is shifted left 4 times. Start by clearing BX.',
     'একটি হেক্স সংখ্যা পড়তে এর অঙ্কগুলো BX এ জমা করি। প্রতিটি হেক্স অঙ্ক ৪ বিট, তাই নতুন অঙ্ক ঢোকানোর আগে BX কে ৪ বার বামে শিফট করি। প্রথমে BX শূন্য করি।',{rows:{bx:'0000000000000000'},note:'XOR BX,BX'}),
  st('The user types 6. Convert it with AND AL, 0F hex, shift BX left 4, then OR the value into the low four bits.',
     'ব্যবহারকারী ৬ টাইপ করে। AND AL,0Fh দিয়ে রূপান্তর করি, BX কে ৪ বার বামে শিফট করি, তারপর OR দিয়ে মানটি নিচের চারটি বিটে বসাই।',{rows:{bx:'0000000000000110'},hl:{bx:[0,1,2,3]},note:"'6' → 0110"}),
  st('Next the user types A. A letter is converted by subtracting 37 hex, because 41 hex minus 37 hex is 0A. First, SHL BX, CL with CL equal to 4 makes room.',
     'এরপর ব্যবহারকারী A টাইপ করে। অক্ষরকে রূপান্তর করতে 37h বিয়োগ করি, কারণ 41h − 37h = 0Ah। প্রথমে SHL BX,CL (CL = 4) দিয়ে জায়গা খালি করি।',{op:{id:'bx',t:'SHL',c:4},note:'SHL BX,CL (CL = 4)'}),
  st('Then OR BL, AL puts 1010 into the low four bits. BX now holds 6A hex.',
     'তারপর OR BL,AL দিয়ে নিচের চারটি বিটে 1010 বসাই। BX এ এখন 6Ah।',{rows:{bx:'0000000001101010'},hl:{bx:[0,1,2,3]},note:"'A' → 1010 · BX = 006Ah"}),
  st('Finally B: shift left 4 again and insert 1011. BX holds 06AB hex. Binary input works the same way, shifting by 1 instead of 4.',
     'সবশেষে B: আবার ৪ বার বামে শিফট করে 1011 বসাই। BX এ থাকে 06ABh। বাইনারি ইনপুটও একইভাবে কাজ করে, শুধু ৪ এর বদলে ১ বার শিফট।',{op:{id:'bx',t:'SHL',c:4},after:{bx:'0000011010101011'},hl:{bx:[0,1,2,3]},note:'BX = 06ABh'})]),

T('Hex output','হেক্স আউটপুট',
 {type:'bits',rows:[{id:'bx',label:'BX',n:16,idx:true,nib:true,show:'h'},{id:'dl',label:'DL',n:8,nib:true,show:'h'}]},
 [st('To print BX in hex, take its four hex digits from the left, one at a time. BX holds 4CA9 hex.',
     'BX কে হেক্সে প্রিন্ট করতে বাম দিক থেকে এর চারটি হেক্স অঙ্ক একটি একটি করে নিই। BX এ আছে 4CA9h।',{rows:{bx:'0100110010101001'},vis:['bx']}),
  st('Copy BH into DL, then shift DL right 4 times. DL now holds the leftmost digit, 4. Add 30 hex to get the character 4.',
     'BH কে DL এ কপি করি, তারপর DL কে ৪ বার ডানে শিফট করি। DL এ এখন সবচেয়ে বাম অঙ্ক ৪। 30h যোগ করে অক্ষর ৪ পাই।',{rows:{dl:'01001100'},op:{id:'dl',t:'SHR',c:4},note:"output so far: 4"}),
  st('Rotate BX left 4 times to bring the next digit to the top. Nothing is lost, because this is a rotate.',
     'পরের অঙ্কটি উপরে আনতে BX কে ৪ বার বামে রোটেট করি। রোটেট বলে কিছুই হারায় না।',{op:{id:'bx',t:'ROL',c:4},note:'output so far: 4'}),
  st('Round two gives C. Digits 10 to 15 are turned into A to F by adding 37 hex.',
     'দ্বিতীয় রাউন্ডে আসে C। ১০ থেকে ১৫ অঙ্ককে 37h যোগ করে A থেকে F বানানো হয়।',{rows:{dl:'11001010'},op:[{id:'dl',t:'SHR',c:4},{id:'bx',t:'ROL',c:4}],note:'output so far: 4C'}),
  st('Round three gives A, and round four gives 9. After four rotations, BX is back to its original value, 4CA9. The output is 4CA9.',
     'তৃতীয় রাউন্ডে আসে A, আর চতুর্থ রাউন্ডে 9। চারবার রোটেটের পর BX আবার আগের মান 4CA9 এ ফিরে আসে। আউটপুট 4CA9।',{rows:{dl:'10010100'},op:[{id:'bx',t:'ROL',c:4},{id:'bx',t:'ROL',c:4}],after:{dl:'00001001'},note:'output: 4CA9 · BX restored'})])
]});

const STK=()=>({id:'s',title:'stack segment (SS)',rows:[{a:'00F8h'},{a:'00FAh'},{a:'00FCh'},{a:'00FEh'},{a:'0100h',sym:'end'}]});
CH.push({n:8,t:{en:'The Stack and Introduction to Procedures',bn:'স্ট্যাক ও প্রোসিডিউরের পরিচিতি'},topics:[

T('What is a stack?','স্ট্যাক কী?',
 {type:'mem',cols:[STK()],regs:['SS','SP'],init:{SS:'0B4E',SP:'0100'}},
 [st('A stack is a one-dimensional structure where items are added and removed at one end only. It works last in, first out, like a pile of dishes: the last dish on is the first one off.',
     'স্ট্যাক হলো একমাত্রিক একটি কাঠামো, যেখানে শুধু এক প্রান্ত দিয়ে জিনিস রাখা আর সরানো হয়। এটি লাস্ট ইন, ফার্স্ট আউট নিয়মে চলে, ঠিক থালার স্তূপের মতো: সবার শেষে রাখা থালাটিই সবার আগে তোলা হয়।',{note:'LIFO: last in, first out'}),
  st('A program reserves memory for the stack with a stack segment declaration, such as dot STACK 100 hex.',

  st('When the program is loaded, SS holds the stack segment number, and SP, the stack pointer, starts at 100 hex. That is the empty-stack position.',
     'প্রোগ্রাম লোড হলে SS এ থাকে স্ট্যাক সেগমেন্টের নম্বর, আর SP বা স্ট্যাক পয়েন্টার শুরু হয় 100h থেকে। এটি খালি স্ট্যাকের অবস্থান।',{ptr:{SP:'s:4'},rhl:['SP']}),
  st('When the stack is not empty, SP holds the offset of the top of the stack. The stack grows toward lower addresses, toward the beginning of memory.',

T('PUSH and PUSHF','PUSH ও PUSHF',
 {type:'mem',cols:[STK()],regs:['AX','BX','SP'],init:{AX:'1234',BX:'5678',SP:'0100'}},
 [st('To add a word to the stack, we PUSH it. The source is a 16-bit register or memory word. The stack is empty, so SP is 100 hex.',
     'স্ট্যাকে একটি ওয়ার্ড রাখতে আমরা PUSH করি। সোর্স হলো ১৬ বিটের রেজিস্টার বা মেমোরি ওয়ার্ড। স্ট্যাক এখন খালি, তাই SP = 100h।',{ptr:{SP:'s:4'}}),
  st('PUSH AX does two things. First, SP is decreased by 2. Then a copy of AX is moved to the address SS colon SP. AX itself is unchanged.',
     'PUSH AX দুটি কাজ করে। প্রথমে SP ২ কমে। তারপর AX এর একটি কপি SS:SP অ্যাড্রেসে যায়। AX নিজে অপরিবর্তিত থাকে।',{fly:{from:'r:AX',to:'s:3',v:'1234'},set:{'s:3':'1234'},ptr:{SP:'s:3'},regs:{SP:'00FE'},hl:['s:3'],note:'SP − 2 → [SS:SP] ← AX'}),
  st('PUSH BX does the same: SP drops to FC hex, and BX is copied there. Each push makes the stack grow toward the beginning of memory.',

  st('PUSHF, with no operands, pushes the contents of the FLAGS register onto the stack.',

T('POP and POPF','POP ও POPF',
 {type:'mem',cols:[STK()],regs:['CX','DX','SP'],init:{CX:'0000',DX:'0000',SP:'00FC'}},
 [st('To remove the top item, we POP it. The destination is a 16-bit register, except IP, or a memory word. Here two words are on the stack and SP is FC hex.',
     'চূড়ার জিনিসটি সরাতে আমরা POP করি। ডেস্টিনেশন হলো IP ছাড়া যেকোনো ১৬ বিটের রেজিস্টার, বা মেমোরি ওয়ার্ড। এখানে স্ট্যাকে দুটি ওয়ার্ড আছে আর SP = FCh।',{set:{'s:3':'1234','s:2':'5678'},ptr:{SP:'s:2'}}),
  st('POP CX first moves the word at SS colon SP into CX, then increases SP by 2. CX gets 5678, the last word pushed.',
     'POP CX প্রথমে SS:SP অ্যাড্রেসের ওয়ার্ডটি CX এ নেয়, তারপর SP ২ বাড়ায়। CX পায় 5678, সবার শেষে রাখা ওয়ার্ডটি।',{fly:{from:'s:2',to:'r:CX',v:'5678'},regs:{CX:'5678',SP:'00FE'},ptr:{SP:'s:3'},note:'CX ← [SS:SP] → SP + 2'}),
  st('POP DX gets 1234, and SP is back to 100 hex. The stack is empty. Items came off in the reverse of the order they went on.',
     'POP DX পায় 1234, আর SP আবার 100h এ ফিরে আসে। স্ট্যাক খালি। জিনিসগুলো যে ক্রমে রাখা হয়েছিল তার উল্টো ক্রমে বের হলো।',{fly:{from:'s:3',to:'r:DX',v:'1234'},regs:{DX:'1234',SP:'0100'},ptr:{SP:'s:4'}}),
  st('PUSH and POP are word operations, so PUSH DL is illegal, and on the 8086 so is pushing an immediate number. PUSH, PUSHF, POP and POPF do not affect the flags. DOS also uses the stack, but it always pops what it pushes before returning.',
     'PUSH আর POP ওয়ার্ড অপারেশন, তাই PUSH DL অবৈধ, আর ৮০৮৬ এ সরাসরি সংখ্যা PUSH করাও অবৈধ। PUSH, PUSHF, POP, POPF কোনো ফ্ল্যাগ বদলায় না। ডসও স্ট্যাক ব্যবহার করে, তবে ফেরার আগে যা রেখেছিল সব সরিয়ে নেয়।',{note:'PUSH DL ✗   PUSH 2 ✗ (8086)   POP IP ✗'})]),

T('Application: reversing input','প্রয়োগ: ইনপুট উল্টানো',
 {type:'mem',cols:[{id:'s',title:'stack',rows:[{a:'00F8h'},{a:'00FAh'},{a:'00FCh'},{a:'00FEh'},{a:'0100h',sym:'end'}]}],regs:['AL','CX','SP'],init:{CX:'0000',SP:'0100'},out:true},
 [st('Because the stack is last in, first out, items come off in reverse order. This program reads characters and displays them backwards on the next line.',
     'স্ট্যাক লাস্ট ইন, ফার্স্ট আউট বলে জিনিসগুলো উল্টো ক্রমে বের হয়। এই প্রোগ্রাম কিছু অক্ষর পড়ে, আর পরের লাইনে সেগুলো উল্টো করে দেখায়।',{ptr:{SP:'s:4'},out:'?'}),
  st('Each character is pushed as it is read, and CX counts them. A is pushed first.',
     'প্রতিটি অক্ষর পড়ার সাথে সাথে PUSH করা হয়, আর CX গুনে রাখে। প্রথমে A PUSH হয়।',{fly:{from:'r:AL',to:'s:3',v:'0041'},regs:{AL:"'A'",CX:'0001',SP:'00FE'},set:{'s:3':"0041 'A'"},ptr:{SP:'s:3'},out:'?A'}),
  st('Then B, then C. The last character read is now on top.',
     'তারপর B, তারপর C। শেষে পড়া অক্ষরটি এখন চূড়ায়।',{regs:{AL:"'C'",CX:'0003',SP:'00FA'},set:{'s:2':"0042 'B'",'s:1':"0043 'C'"},ptr:{SP:'s:1'},hl:['s:1'],out:'?ABC'}),
  st('A carriage return ends the input. Now a FOR loop runs CX times: each pass pops a character and displays it. C comes off first.',
     'ক্যারেজ রিটার্ন দিলে ইনপুট শেষ হয়। এখন একটি FOR লুপ CX বার চলে: প্রতিবার একটি অক্ষর POP করে দেখায়। প্রথমে বের হয় C।',{fly:{from:'s:1',to:'r:AL',v:"'C'"},regs:{AL:"'C'",SP:'00FC'},ptr:{SP:'s:2'},out:'?ABC\nC'}),
  st('Then B and A. The line comes out reversed, and the stack is empty again.',
     'তারপর B আর A। লাইনটি উল্টো হয়ে বের হয়, আর স্ট্যাক আবার খালি।',{regs:{AL:"'A'",SP:'0100',CX:'0000'},ptr:{SP:'s:4'},out:'?ABC\nCBA'})]),

T('Procedures: CALL and RET','প্রোসিডিউর: CALL ও RET',
 {type:'split',a:{type:'code',lines:['MAIN PROC','    ...','    CALL PROC1      ;at offset 0010h','    MOV AX,BX       ;offset 0012h: return here','    ...','MAIN ENDP','PROC1 PROC','    ;body of PROC1  ;starts at 0200h','    RET             ;return to caller','PROC1 ENDP']},
  b:{type:'mem',cols:[{id:'s',title:'stack',rows:[{a:'00FCh'},{a:'00FEh'},{a:'0100h',sym:'end'}]}],regs:['IP','SP'],init:{IP:'0010',SP:'0100'}}},
 [st('A procedure is a named block of code, declared with PROC and ENDP. One procedure, usually MAIN, is in charge, and it calls the others. A procedure ends with RET.',
     'প্রোসিডিউর হলো নাম দেওয়া একটি কোড ব্লক, যা PROC আর ENDP দিয়ে ঘোষণা করা হয়। একটি প্রোসিডিউর, সাধারণত MAIN, মূল দায়িত্বে থাকে এবং অন্যগুলোকে কল করে। প্রোসিডিউর শেষ হয় RET দিয়ে।',{ln:[7,10],ptr:{SP:'s:2'}}),
  st('CALL PROC1 sits at offset 10 hex. Execution reaches it with IP pointing there.',
     'CALL PROC1 আছে অফসেট 10h এ। IP সেখানে নির্দেশ করে থাকা অবস্থায় এক্সিকিউশন এখানে পৌঁছায়।',{ln:3}),
  st('CALL pushes the return address, the offset of the next instruction, 12 hex, onto the stack. Then it loads IP with the start of PROC1, so the procedure runs.',
     'CALL প্রথমে রিটার্ন অ্যাড্রেস, অর্থাৎ পরের ইনস্ট্রাকশনের অফসেট 12h, স্ট্যাকে PUSH করে। তারপর IP তে PROC1 এর শুরুর অ্যাড্রেস বসায়, ফলে প্রোসিডিউরটি চলতে শুরু করে।',{ln:8,set:{'s:1':'0012'},ptr:{SP:'s:1'},regs:{SP:'00FE',IP:'0200'},hl:['s:1'],note:'CALL: push return address · IP ← PROC1'}),
  st('RET pops the word on top of the stack into IP. Control returns to the instruction right after the CALL.',
     'RET স্ট্যাকের চূড়ার ওয়ার্ডটি POP করে IP তে রাখে। নিয়ন্ত্রণ ফিরে যায় CALL এর ঠিক পরের ইনস্ট্রাকশনে।',{ln:9,fly:{from:'s:1',to:'r:IP',v:'0012'},regs:{IP:'0012',SP:'0100'},ptr:{SP:'s:2'},note:'RET: IP ← pop'}),
  st('Execution continues in MAIN. Procedures usually pass values through registers, and each one should be documented with what it receives, what it returns and what it uses. The stack must be balanced, or RET will pop the wrong address.',
     'এক্সিকিউশন আবার MAIN এ চলে। প্রোসিডিউর সাধারণত রেজিস্টারের মাধ্যমে মান আদান-প্রদান করে, আর প্রতিটির ডকুমেন্টেশনে লেখা থাকা উচিত সে কী নেয়, কী ফেরত দেয় আর কী ব্যবহার করে। স্ট্যাক ব্যালান্সড থাকতে হবে, নাহলে RET ভুল অ্যাড্রেস POP করবে।',{ln:4,note:'receives · returns · uses'})])
]});
